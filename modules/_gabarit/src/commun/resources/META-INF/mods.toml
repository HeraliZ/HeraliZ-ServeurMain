# Projet fusionné : UN jar, PLUSIEURS mods. Chaque mod d'origine garde son modId (objets, blocs, entités, sons, structures,
# configs et canaux réseau inchangés) ; le mod porteur (« heraliz_gabarit », en PREMIER) porte le code partagé.
# Ce fichier est IDENTIQUE dans les trois jars (-client, -serveur, -complet).
# Chaque [[mods]] a SA classe @Mod (FML 47 : ModLoader.buildMods), et inversement. Mettre le porteur en premier
# (le premier modId donne le nom du module Java du jar).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="heraliz_gabarit"
version="${mod_version}"
displayName="HeraliZ Gabarit"
authors="${mod_authors}"
description='''Mod porteur du jar fusionné : pont client / serveur, onglet créatif commun.'''
[[dependencies.heraliz_gabarit]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.heraliz_gabarit]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

