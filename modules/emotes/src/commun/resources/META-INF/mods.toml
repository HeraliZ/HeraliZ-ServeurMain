# HeraliZ Emote coupé en trois jars (-client, -serveur, -complet) : UN mod, modId d'origine inchangé.
# Ce fichier est IDENTIQUE dans les trois jars (docs/METHODE_CLIENT_SERVEUR.md).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="heraliz_emote"
version="${mod_version}"
displayName="HeraliZ Emote"
logoFile="heraliz_emote_logo.png"
authors="${mod_authors}"
description='''46 emotes avec objets 3D, musique et menu avec aperçu (touche 0, à sur un clavier AZERTY ; roue d'Emotecraft : touche ²), et Maj + clic droit sur un joueur pour copier son emote.

Inclut Emotecraft et Player Animator de KosmX (licences CC BY 4.0 et MIT, voir third_party/ dans le jar) : rien d'autre à installer.'''
displayTest="IGNORE_ALL_VERSION"

[[dependencies.heraliz_emote]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.heraliz_emote]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.heraliz_emote]]
    modId="emotecraft"
    mandatory=true
    versionRange="[2.1,)"
    ordering="AFTER"
    side="CLIENT"

# 25/10 : pas de tir ni de coup TaCZ pendant une emote et 10 s après (serveur/TirsSansArme, client/TirsClient) ; facultatif
[[dependencies.heraliz_emote]]
    modId="tacz"
    mandatory=false
    versionRange="[1.1,)"
    ordering="AFTER"
    side="BOTH"
