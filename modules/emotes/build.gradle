// HeraliZ Emote (gabarit : mods/_gabarit, méthode : docs/METHODE_CLIENT_SERVEUR.md).
// UN mod (pas de fusion : son modId, son paquet, sa classe @Mod), coupé en trois ensembles de sources :
//   commun  (sourceSets.main, src/commun)  : enregistrements, paquets, classes partagées réduites au nécessaire ;
//   client  (src/client)                   : rendus, modèles, écrans, HUD, sons, mixins client, assets/ ;
//   serveur (src/serveur)                  : IA, règles, commandes, butin, data/.
// client et serveur voient commun, jamais l'un l'autre ; commun ne voit ni l'un ni l'autre (le compilateur l'interdit).
// Trois jars réobfusqués : -client (commun + client), -serveur (commun + serveur), -complet (tout, pour le solo).
// Construire : PYTHONIOENCODING=utf-8 python outils/lancer.py build mods/heraliz-emote build livrer
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
}

version = mod_version
group = mod_group_id

base {
    archivesName = jar_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    // Aucune configuration de lancement : pas de client ni de serveur de dev, le propriétaire teste lui-même en jeu.
}

// ------------------------------------------------------------------ les trois ensembles de sources
sourceSets {
    main {                                   // = « commun »
        java.srcDirs = ['src/commun/java']
        resources.srcDirs = ['src/commun/resources']
    }
    client {
        java.srcDirs = ['src/client/java']
        resources.srcDirs = ['src/client/resources']
        compileClasspath += main.output + main.compileClasspath
    }
    serveur {
        java.srcDirs = ['src/serveur/java']
        resources.srcDirs = ['src/serveur/resources']
        compileClasspath += main.output + main.compileClasspath
    }
}

// Mixins : deux tables de correspondance (docs/METHODE_CLIENT_SERVEUR.md, piège n°25).
//   - commune (src/commun/resources/*.mixins.json : règle des emotes côté serveur) -> dans les trois jars ;
//   - client (src/client/resources/*.mixins.json) -> seulement dans -client et -complet.
mixin {
    add sourceSets.main, "${jar_name}-commun.refmap.json"
    add sourceSets.client, "${jar_name}.refmap.json"
}

repositories {
    flatDir { dirs rootProject.file('libs'), file('libs') }
    // pas exclusiveContent : ForgeGradle sert les copies remappées sous le même groupe
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // GeckoLib = geckolib222 4.4.7 du modpack, le seul GeckoLib du serveur : compilé contre lui, JAMAIS embarqué.
    // (copier TEST SERVEUR - Ptero/mods/geckolib222-forge-1.20.1-4.4.7.jar en libs/geckolib222-<geckolib_libs_version>.jar)
    if (rootProject.file("libs/geckolib222-4.4.7.jar").exists()) {
        compileOnly fg.deobf("blank:geckolib222:4.4.7")
    }
    // Autres mods du modpack nécessaires à la compilation : libs/<nom>-<version>-<suffixe du projet>.jar, puis
    //   compileOnly fg.deobf("blank:<nom>:<version>-<suffixe du projet>")   (suffixe unique : cache de deobf partagé)
    // Emotecraft et Player Animator (KosmX) : embarqués tels quels (Jar-in-Jar, repris du jar 2.5.2, voir jarjarDans)
    compileOnly fg.deobf("maven.modrinth:emotecraft:2.2.7-b.build.50+1.20.1-forge")
    compileOnly fg.deobf("maven.modrinth:playeranimator:1.0.2-rc1+1.20-forge")
    // TaCZ (jar d'un autre auteur, jamais embarqué) : tirs refusés pendant le délai sans arme après une emote (25/10)
    compileOnly fg.deobf("blank:tacz-1.20.1:1.1.8-hotfix")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    clientAnnotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var props = [mod_version: mod_version, minecraft_version_range: minecraft_version_range, forge_version_range: forge_version_range,
                 loader_version_range: loader_version_range, mod_license: mod_license, mod_authors: mod_authors]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:-removal', '-Xlint:-deprecation', '-Xmaxerrs', '1000']
}

// Tables de correspondance des mixins toujours refaites (25/10, comme gradle/module-coupe.gradle) : une compilation
// lancée à part pouvait effacer la table du dossier tmp ; la fabrication suivante croyait la compilation « à jour » et
// livrait un jar sans table (mixins non réobfusqués : plantage au chargement).
def tableAttendue = { String tache, String nom -> tasks.named(tache, JavaCompile).configure {
    options.incremental = false
    def table = file("build/tmp/${tache}/${nom}")
    outputs.upToDateWhen { table.exists() }
} }
tableAttendue('compileJava', "${jar_name}-commun.refmap.json")
tableAttendue('compileClientJava', "${jar_name}.refmap.json")

// ------------------------------------------------------------------ les trois jars
def manifeste = [
        'Specification-Title'     : jar_name,
        'Specification-Vendor'    : mod_authors,
        'Specification-Version'   : '1',
        'Implementation-Title'    : project.name,
        'Implementation-Version'  : mod_version,
        'Implementation-Vendor'   : mod_authors,
]
// Configs de mixins : communes (src/commun/resources) dans les trois jars, client (src/client/resources) dans -client et -complet.
def mixinsCommun = fileTree('src/commun/resources') { include '*.mixins.json' }.files*.name.sort()
def mixinsClient = fileTree('src/client/resources') { include '*.mixins.json' }.files*.name.sort()
def manifesteServeur = manifeste + (mixinsCommun ? ['MixinConfigs': mixinsCommun.join(',')] : [:])
def manifesteClient = manifeste + ((mixinsCommun + mixinsClient) ? ['MixinConfigs': (mixinsCommun + mixinsClient).join(',')] : [:])
// Emotecraft + Player Animator embarqués (META-INF/jarjar, avec metadata.json), identiques au jar 2.5.2 : dans les trois jars
// (Emotecraft relaie les emotes côté serveur ; la règle serveur vise ses classes)
def jarjarDans = { Jar j ->
    j.from(zipTree('libs/heraliz_emote-jarjar-2.5.2.jar')) { include 'META-INF/jarjar/**' }
}

// -complet : commun + client + serveur (solo, profil de test)
tasks.named('jar', Jar).configure {
    archiveClassifier = 'complet'
    from sourceSets.client.output
    from sourceSets.serveur.output
    jarjarDans(it)
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest { attributes(manifesteClient) }
    finalizedBy 'reobfJar'
}

// -client : commun + client + assets (pour les joueurs)
tasks.register('clientJar', Jar) {
    group = 'build'
    archiveClassifier = 'client'
    from sourceSets.main.output
    from sourceSets.client.output
    jarjarDans(it)
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest { attributes(manifesteClient) }
    finalizedBy 'reobfClientJar'
}

// -serveur : commun + serveur + data (pour le serveur), sans mixins client ni table de correspondance
tasks.register('serveurJar', Jar) {
    group = 'build'
    archiveClassifier = 'serveur'
    from sourceSets.main.output
    from sourceSets.serveur.output
    jarjarDans(it)
    exclude "${jar_name}.refmap.json"
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest { attributes(manifesteServeur) }
    finalizedBy 'reobfServeurJar'
}

// une tâche reobf<Nom> par jar (sinon le jar garde les noms de développement et plante au chargement)
reobf {
    create('clientJar')
    create('serveurJar')
}

tasks.named('build').configure { dependsOn 'clientJar', 'serveurJar' }

// Copie des trois jars réobfusqués dans dist/fusion/
tasks.register('livrer', Copy) {
    group = 'build'
    dependsOn 'reobfJar', 'reobfClientJar', 'reobfServeurJar'
    from(layout.buildDirectory.dir('libs')) { include "${jar_name}-${mod_version}-complet.jar", "${jar_name}-${mod_version}-client.jar", "${jar_name}-${mod_version}-serveur.jar" }
    into rootProject.file('dist/fusion')
}
