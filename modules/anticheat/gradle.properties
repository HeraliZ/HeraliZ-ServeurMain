

# Jar coupé : <jar_name>-<version>-client.jar (joueurs), -serveur.jar (Ptero, avec une copie du jar joueur pour le défi
# d'intégrité), -complet.jar (solo).
# jar_name NE dit PAS « spartan » exprès (05/11, demande du propriétaire) : le nom du fichier joueur est volontairement
# anodin pour qu'un tricheur mette plus de temps à repérer l'anticheat dans le dossier mods. Le mod_id reste « spartan »
# (il ne peut pas changer : mondes, configs, canaux, défi d'intégrité). officiel.json et le pack du launcher sont
# refabriqués à partir du jar (empreinte), donc le renommage suffit, sans rien d'autre à changer.
jar_name=renderlib-forge
mod_id=spartan
mod_name=Spartan AntiCheat
mod_version=2.11.1
mod_group_id=com.Spartan
mod_description=Anticheat HeraliZ : detections serveur, correction instantanee, anti-ESP, suivi a travers les murs, defi d integrite, controle d integrite silencieux (jars, injection), bans compte+IP+PC, alertes Discord.
