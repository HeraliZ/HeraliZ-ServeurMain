# Reanimation coupé en trois jars (-client, -serveur, -complet) : UN mod, modId d'origine inchangé.
# Ce fichier est IDENTIQUE dans les trois jars (docs/METHODE_CLIENT_SERVEUR.md).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="reanimation"
version="${mod_version}"
displayName="Reanimation"
authors="${mod_authors}"
description='''Etat a terre au lieu de la mort : ramper, se vider de son sang, se faire fouiller ou reanimer.'''

[[dependencies.reanimation]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.reanimation]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Curios : facultatif (emplacements Curios d'un joueur à terre montrés à la fouille, s'il est là)
[[dependencies.reanimation]]
    modId="curios"
    mandatory=false
    versionRange="[5.14,)"
    ordering="NONE"
    side="BOTH"

# Noyau HeraliZ : kit des HUD (à terre, réanimation ; refonte du 25/10), toujours installé avec le serveur et chez les joueurs
[[dependencies.reanimation]]
    modId="heraliz_noyau"
    mandatory=true
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"
