# Noyau HeraliZ : état du joueur (en combat, à terre, en match), règles du combat, kit d'interface.
# Ce fichier est IDENTIQUE dans les trois jars (-client, -serveur, -complet).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="heraliz_noyau"
version="${mod_version}"
displayName="HeraliZ Noyau"
authors="${mod_authors}"
description='''Socle commun des mods HeraliZ : tag de combat, déconnexion en combat, commandes refusées en combat et sur la carte, kit d'interface.'''
[[dependencies.heraliz_noyau]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.heraliz_noyau]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
