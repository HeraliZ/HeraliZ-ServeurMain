# HeraliZ Boutique : grades, boutique, casino, caisses : un jar, plusieurs mods (chacun garde son modId et sa version).
# Ce fichier est IDENTIQUE dans les trois jars (-client, -serveur, -complet).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# ---- heraliz_grades (ancien projet heraliz-grades, version 2.7.2)
[[mods]]
modId="heraliz_grades"
version="2.7.2"
displayName="HeraliZ Grades"
authors="${mod_authors}"
description='''Grades HeraliZ (staff, boutique, Survivant), préfixes, commandes /grade (console seulement pour donner et retirer).'''
[[dependencies.heraliz_grades]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.heraliz_grades]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# ---- un bloc par mod fusionné (modId D'ORIGINE), par exemple :
# [[mods]]
# modId="heralisz_melee"
