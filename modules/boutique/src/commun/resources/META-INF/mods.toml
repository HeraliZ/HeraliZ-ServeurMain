#     ordering="AFTER"
#     side="BOTH"
# (+ forge, minecraft, et les dépendances d'origine du mod : geckolib, curios...)

# ---- heralizcasino (ancien projet heraliz-casino, version 2.5.1)
[[mods]]
modId="heralizcasino"
version="2.7.0"
displayName="Heraliz Casino"
authors="${mod_authors}"
description='''Le casino du serveur HERALIZ : machines 3D animees (machines a sous, Grande Roue, Plinko, Blackjack, Roulette, Crash, Des, Mines, Pile ou Face, Course de chevaux, Video Poker), jetons et caisse de change. La maison garde toujours l'avantage.'''

[[dependencies.heralizcasino]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.heralizcasino]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# HeraliZ Economie (les herals, monnaie du serveur) : facultatif. Present, la caisse vend et rachete les jetons contre
# les herals du compte du joueur ; absent, le casino fonctionne comme avant (objets seulement).
[[dependencies.heralizcasino]]
    modId="heralisz_economie"
    mandatory=false
    versionRange="[0.1.0,)"
    ordering="AFTER"
    side="BOTH"

# ---- heralizcrates (ancien projet heraliz-crates, version 2.21.0)
[[mods]]
modId="heralizcrates"
version="2.21.0"
displayName="Heraliz Crates"
authors="${mod_authors}"
description='''Caisses animées HD du serveur HERALIZ : caisses 3D (boss, vote, quêtes, événement, gemme, camos, stickers, chantier, trauma, largage, emotes), cadenas et clés 3D, roue de butin, interface d'ouverture épurée façon CS:GO (accroupi + clic droit), éditeur de butin en jeu pour les opérateurs, effets et sons custom.'''

[[dependencies.heralizcrates]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.heralizcrates]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
