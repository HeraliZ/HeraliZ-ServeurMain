# HeraliZ Capture : outil d'essai des écrans, sur un client d'essai seulement (jamais livré, jamais sur le serveur).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="heraliz_capture"
version="${mod_version}"
displayName="HeraliZ Capture (essais)"
authors="${mod_authors}"
displayTest="IGNORE_ALL_VERSION"
description='''Outil d'essai : joue un script (touches, commandes, écrans, interactions) et capture chaque écran.'''
[[dependencies.heraliz_capture]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.heraliz_capture]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
