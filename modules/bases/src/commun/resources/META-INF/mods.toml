# CRac coupé en trois jars (-client, -serveur, -complet) : UN mod, modId d'origine inchangé.
# Ce fichier est IDENTIQUE dans les trois jars (docs/METHODE_CLIENT_SERVEUR.md).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="crac"
version="${mod_version}"
displayName="CRac"
authors="${mod_authors}"
description='''Construction de base facon Rust (plan, marteau, tiers, Claim Block, raids). Edition HeraliZ.'''

[[dependencies.crac]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.crac]]
    modId="geckolib"
    mandatory=true
    versionRange="[4.4,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.crac]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.crac]]
    modId="heralisz_clans"
    mandatory=false
    versionRange="[0.1.0,)"
    ordering="AFTER"
    side="BOTH"
