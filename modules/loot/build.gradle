// HeraliZ Loot : conteneurs par paliers, rotation par zones, raretés, salles à carte.
plugins {
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
}

apply from: rootProject.file('gradle/module-coupe.gradle')

dependencies {
    // kit des écrans en verre du noyau (fouille et coffres de base en verre, 14/11)
    compileOnly project(path: ':noyau', configuration: 'devComplet')
}
