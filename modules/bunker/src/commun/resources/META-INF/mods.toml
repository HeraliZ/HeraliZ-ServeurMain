# HeraliZ Bunker coupé en trois jars (-client, -serveur, -complet) : UN mod, modId d'origine inchangé.
# Ce fichier est IDENTIQUE dans les trois jars (docs/METHODE_CLIENT_SERVEUR.md).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="heralisz_bunker"
version="${mod_version}"
displayName="HeraliZ Bunker"
authors="${mod_authors}"
description='''Portes animees HeraliZ (bunker, coffre-fort, sas, silos, cargo, garage...), reprises de HBM Nuclear Tech Modernized (GPL-3.0). Aucune autre mecanique.'''

[[dependencies.heralisz_bunker]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.heralisz_bunker]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.heralisz_bunker]]
    modId="playeranimator"
    mandatory=true
    versionRange="[1.0,)"
    ordering="NONE"
    side="CLIENT"
