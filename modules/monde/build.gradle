// HeraliZ Monde : carte, décors, train, véhicules, spawn, extraction, frappes.
// Regroupe : heralisz-utils, heraliz-decors, heraliz-extraction, airstrike (chaque mod garde son modId et sa version, voir src/commun/resources/META-INF/mods.toml).
plugins {
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
}

apply from: rootProject.file('gradle/module-coupe.gradle')

dependencies {
    compileOnly fg.deobf("blank:tacz-1.20.1:1.1.8-hotfix")
    compileOnly fg.deobf("blank:ywzj_vehicle:0.5.10-fuse")
    compileOnly fg.deobf("blank:MutantsZombies:0.9.8")
    compileOnly fg.deobf("blank:curios-forge:5.14.1")
    compileOnly project(path: ':voix', configuration: 'devComplet')
    compileOnly project(path: ':clans', configuration: 'devComplet')
    compileOnly project(path: ':noyau', configuration: 'devComplet')
}
