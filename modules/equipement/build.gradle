// HeraliZ Équipement : armures, combinaisons et composants.
// Regroupe : heraliz-armory, heraliz-composants (chaque mod garde son modId et sa version, voir src/commun/resources/META-INF/mods.toml).
plugins {
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
}

apply from: rootProject.file('gradle/module-coupe.gradle')

dependencies {
    compileOnly fg.deobf("blank:curios-forge:5.14.1")
    compileOnly fg.deobf("blank:tacz-1.20.1:1.1.8-hotfix")
}
