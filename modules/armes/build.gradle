// HeraliZ Tactique : UN projet, UN jar fusionné (6 mods : heraliz_tactique + heralisz_tactical, heralisz_melee,
// heralisz_heal, heralisz_grenade, heralisz_camo ; chacun garde son modId), coupé en trois ensembles de sources
// (docs/METHODE_CLIENT_SERVEUR.md) :
//   commun  (sourceSets.main, src/commun)  : enregistrements, paquets, objets et entités réduits, état synchronisé ;
//   client  (src/client)                   : rendus, animations, shaders des camos, HUD, écrans, sons, mixins client, assets/ ;
//   serveur (src/serveur)                  : coups, dégâts, soins, effets, explosions, C4, camos appliqués, data/.
// client et serveur voient commun, jamais l'un l'autre ; commun ne voit ni l'un ni l'autre (le compilateur l'interdit).
// Trois jars réobfusqués : -client (commun + client), -serveur (commun + serveur), -complet (tout, pour le solo).
// Construire : PYTHONIOENCODING=utf-8 python outils/lancer.py build mods/heraliz-tactique build livrer
//
// Licence : heralisz_tactical est un fork de LesRaisins Tactical Equipments 0.4.3 (LesRaisins Studio), GNU GPL 3.0.
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
}

version = mod_version
group = mod_group_id

base {
    archivesName = jar_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    // transformateur d'accès de heralisz_tactical (inchangé), dans les trois jars
    accessTransformer = file('src/commun/resources/META-INF/accesstransformer.cfg')
    // Aucune configuration de lancement : pas de client ni de serveur de dev, le propriétaire teste lui-même en jeu.
}

// ------------------------------------------------------------------ les trois ensembles de sources
sourceSets {
    main {                                   // = « commun »
        java.srcDirs = ['src/commun/java']
        resources.srcDirs = ['src/commun/resources']
    }
    client {
        java.srcDirs = ['src/client/java']
        resources.srcDirs = ['src/client/resources']
        compileClasspath += main.output + main.compileClasspath
    }
    serveur {
        java.srcDirs = ['src/serveur/java']
        resources.srcDirs = ['src/serveur/resources']
        compileClasspath += main.output + main.compileClasspath
    }
}

// Mixins : deux tables de correspondance.
//   - commune (src/commun/resources/*.mixins.json : mixins des DEUX côtés de heralisz_tactical : enclume, bouclier, objets
//     consommés ; de heraliz_tactique : s'allonger, ramper de TaCZ vu par le serveur) -> dans les trois jars ;
//   - client (src/client/resources/*.mixins.json) -> seulement dans -client et -complet.
mixin {
    add sourceSets.main, "${jar_name}-commun.refmap.json"
    add sourceSets.client, "${jar_name}.refmap.json"
}

repositories {
    flatDir { dirs rootProject.file('libs'), file('libs') }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // GeckoLib : pas utilisé par ce groupe (bloc gardé du gabarit ; jamais embarqué).
    if (rootProject.file("libs/geckolib222-4.4.7.jar").exists()) {
        compileOnly fg.deobf("blank:geckolib222:4.4.7")
    }
    // Mods du modpack nécessaires à la compilation (jamais embarqués), suffixe -hztactique (cache de deobf partagé) :
    // TaCZ (armes, établi, modèles bedrock, onglets) : obligatoire en jeu
    compileOnly fg.deobf("blank:tacz-1.20.1:1.1.8-hotfix")
    // modèles bedrock en 1re personne (bibliothèque embarquée par TaCZ)
    compileOnly fg.deobf("blank:simplebedrockmodel:2.2.2")
    // LuaJ (scripts des machines à états) et MixinExtras : fournis en jeu par TaCZ
    compileOnly files('libs/luaj-core-3.0.8-figura.jar', 'libs/luaj-jse-3.0.8-figura.jar', 'libs/MixinExtras-0.3.6.jar')
    // compatibilités facultatives : animations 3e personne, écran de configuration (heralisz_tactical)
    compileOnly fg.deobf("blank:player-animation-lib-forge:1.0.2")
    compileOnly fg.deobf("blank:cloth-config:11.1.136-forge")
    // camo des sacs (heralisz_camo) : HeraliZ Backpack (mod « backpacked ») et Curios, facultatifs en jeu
    compileOnly fg.deobf("blank:curios-forge:5.14.1")
    compileOnly project(path: ':sacs', configuration: 'devComplet')
    // kit HUD commun du noyau (anneau des soins, polices, palette : refonte du 25/10)
    compileOnly project(path: ':noyau', configuration: 'devComplet')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    clientAnnotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // MixinExtras (@WrapWithCondition) : son processeur ajoute ses cibles à la table, sinon le mixin échoue en jeu
    annotationProcessor files('libs/MixinExtras-0.3.6.jar')
    clientAnnotationProcessor files('libs/MixinExtras-0.3.6.jar')
}

tasks.named('processResources', ProcessResources).configure {
    var props = [mod_version: mod_version, minecraft_version_range: minecraft_version_range, forge_version_range: forge_version_range,
                 loader_version_range: loader_version_range, mod_license: mod_license, mod_authors: mod_authors]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:-removal', '-Xlint:-deprecation', '-Xmaxerrs', '1000']
}

// Tables de correspondance des mixins toujours refaites (25/10, comme gradle/module-coupe.gradle) : une compilation
// lancée à part pouvait effacer la table du dossier tmp ; la fabrication suivante croyait la compilation « à jour » et
// livrait un jar sans table (mixins non réobfusqués : plantage au chargement).
def tableAttendue = { String tache, String nom -> tasks.named(tache, JavaCompile).configure {
    options.incremental = false
    def table = file("build/tmp/${tache}/${nom}")
    outputs.upToDateWhen { table.exists() }
} }
tableAttendue('compileJava', "${jar_name}-commun.refmap.json")
tableAttendue('compileClientJava', "${jar_name}.refmap.json")

// ------------------------------------------------------------------ les trois jars
def manifeste = [
        'Specification-Title'     : jar_name,
        'Specification-Vendor'    : mod_authors,
        'Specification-Version'   : '1',
        'Implementation-Title'    : project.name,
        'Implementation-Version'  : mod_version,
        'Implementation-Vendor'   : mod_authors,
]
// Configs de mixins : communes (src/commun/resources) dans les trois jars, client (src/client/resources) dans -client et -complet.
def mixinsCommun = fileTree('src/commun/resources') { include '*.mixins.json' }.files*.name.sort()
def mixinsClient = fileTree('src/client/resources') { include '*.mixins.json' }.files*.name.sort()
def manifesteServeur = manifeste + (mixinsCommun ? ['MixinConfigs': mixinsCommun.join(',')] : [:])
def manifesteClient = manifeste + ((mixinsCommun + mixinsClient) ? ['MixinConfigs': (mixinsCommun + mixinsClient).join(',')] : [:])

// -complet : commun + client + serveur (solo, profil de test)
tasks.named('jar', Jar).configure {
    archiveClassifier = 'complet'
    from sourceSets.client.output
    from sourceSets.serveur.output
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest { attributes(manifesteClient) }
    finalizedBy 'reobfJar'
}

// -client : commun + client + assets (pour les joueurs)
tasks.register('clientJar', Jar) {
    group = 'build'
    archiveClassifier = 'client'
    from sourceSets.main.output
    from sourceSets.client.output
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest { attributes(manifesteClient) }
    finalizedBy 'reobfClientJar'
}

// -serveur : commun + serveur + data (pour le serveur) : mixins communs et leur table, sans mixins client ni leur table
tasks.register('serveurJar', Jar) {
    group = 'build'
    archiveClassifier = 'serveur'
    from sourceSets.main.output
    from sourceSets.serveur.output
    exclude "${jar_name}.refmap.json"
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest { attributes(manifesteServeur) }
    finalizedBy 'reobfServeurJar'
}

// une tâche reobf<Nom> par jar (sinon le jar garde les noms de développement et plante au chargement)
reobf {
    create('clientJar')
    create('serveurJar')
}

tasks.named('build').configure { dependsOn 'clientJar', 'serveurJar' }

// Copie des trois jars réobfusqués dans dist/fusion/
tasks.register('livrer', Copy) {
    group = 'build'
    dependsOn 'reobfJar', 'reobfClientJar', 'reobfServeurJar'
    from(layout.buildDirectory.dir('libs')) { include "${jar_name}-${mod_version}-complet.jar", "${jar_name}-${mod_version}-client.jar", "${jar_name}-${mod_version}-serveur.jar" }
    into rootProject.file('dist/fusion')
}
