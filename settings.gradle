// HeraliZ : une seule fabrication pour tous les modules (modules/<nom>).
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'heraliz'

include 'anticheat'
project(':anticheat').projectDir = file('modules/anticheat')
include 'armes'
project(':armes').projectDir = file('modules/armes')
include 'banc'
project(':banc').projectDir = file('modules/banc')
include 'bases'
