include 'capture'
project(':capture').projectDir = file('modules/capture')
include 'clans'
project(':clans').projectDir = file('modules/clans')
include 'clashwar'
project(':clashwar').projectDir = file('modules/clashwar')
include 'emotes'
project(':emotes').projectDir = file('modules/emotes')
include 'equipement'
