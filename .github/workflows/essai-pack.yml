# Essai du pack du launcher (temporaire, branche de travail seulement) : Nebula avec les mods tiers du dépôt, sans
# rien déposer nulle part. À retirer une fois le pack branché sur la mise en ligne du serveur.
name: Essai pack launcher

on:
  push:
    branches: [claude/amazing-euler-zyl33z]
    paths: ["outils/pack_launcher.py", ".github/workflows/essai-pack.yml"]

permissions:
  contents: read

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Nebula
        run: |
          git clone --depth 1 https://github.com/dscalzi/Nebula.git nebula
          echo "Nebula : $(git -C nebula rev-parse HEAD)"
          cd nebula
          npm ci || npm i
          npm run build

      - name: Pack (essai)
        run: python3 outils/pack_launcher.py nebula pack --essai --version 0.0.1

      - name: Ce que Nebula a produit
        if: always()
        run: |
          find pack/racine -maxdepth 4 -type d | grep -v '/tacz/' | head -n 60
          cat pack/racine/servers/heraliz-1.20.1/servermeta.json || true
          python3 - <<'PY' || true
          import json
          d = json.load(open("pack/racine/distribution.json"))
          print({k: v for k, v in d.items() if k != "servers"})
          s = d["servers"][0]
          print({k: v for k, v in s.items() if k != "modules"})
          def tour(ms, p=0):
              for m in ms:
                  a = m["artifact"]
                  print("  " * p + m["type"], m["id"], a.get("url", "")[:120], a.get("path"), m.get("classpath"))
                  if p < 1:
                      tour(m.get("subModules", [])[:40], p + 1)
          tour([m for m in s["modules"] if m["type"] != "File"][:8])
          print(len(s["modules"]), "modules au premier niveau")
          PY
