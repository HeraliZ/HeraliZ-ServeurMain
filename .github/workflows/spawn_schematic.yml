# Schematic du spawn : cherche sur le Ptero le schematic du spawn (« spawnbangerdelamort » par défaut : .schem de
# WorldEdit, .schematic ou structure .nbt), le copie dans monde/spawn_schematic/, puis COMPOSE le monde du spawn
# (heralisz:spawn) : la grotte du terminus de la cinématique (réveil -61 265 2 et épave inchangés) + ce schematic à
# l'est, relié par un tunnel qui part de la niche de la grotte, avec la borne de départ dans la partie spawn
# (outils/monde_spawn.py composer). Résultat dans monde/spawn/ (ce que dépose la case « deposer_spawn » du workflow
# « Serveur HeraliZ ») et rendus dans monde/spawn_rendus/, enregistrés sur la BRANCHE DE TRAVAIL seulement (jamais main).
# LECTURE SEULE sur le Ptero : listes de dossiers et copie de quelques petits fichiers (le schematic, server.properties,
# data/heraliz_cinematique.dat du monde en service) ; rien n'est jamais écrit, renommé ni supprimé sur le Ptero.
# Sans secrets du Ptero ou sans schematic trouvé, la composition se fait avec celui déjà enregistré dans
# monde/spawn_schematic/ s'il y en a un. Part d'une branche de travail quand ce fichier ou l'outil change, ou par
# « Run workflow » (sur une branche de travail).
name: Schematic du spawn

on:
  workflow_dispatch:
    inputs:
      nom:
        description: "Nom du schematic à chercher (sans extension)"
        default: "spawnbangerdelamort"
      position:
        description: "Coin bas nord-ouest du schematic « X Y Z » dans le monde du spawn (vide = automatique, à l'est de la grotte)"
        default: ""
      borne:
        description: "Place de la borne de départ « X Y Z » dans le repère du schematic (vide = automatique)"
        default: ""
      ecart:
        description: "Longueur minimale du tunnel entre la grotte et le schematic (vide = 10)"
        default: ""
  push:
    branches-ignore: [main]
    paths: [".github/workflows/spawn_schematic.yml", "outils/monde_spawn.py"]

permissions:
  contents: write   # seulement pour enregistrer le schematic, le monde du spawn composé et les rendus sur la branche de travail

concurrency:
  group: spawn-schematic
  cancel-in-progress: false

jobs:
  schematic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PTERO_SFTP_HOST: ${{ secrets.PTERO_SFTP_HOST }}
      PTERO_SFTP_PORT: ${{ secrets.PTERO_SFTP_PORT }}
      PTERO_SFTP_USER: ${{ secrets.PTERO_SFTP_USER }}
      PTERO_SFTP_PASSWORD: ${{ secrets.PTERO_SFTP_PASSWORD }}
      PYTHONIOENCODING: utf-8
      NOM: ${{ inputs.nom || 'spawnbangerdelamort' }}
      POSITION: ${{ inputs.position }}
      BORNE: ${{ inputs.borne }}
      ECART: ${{ inputs.ecart }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          python -m pip install --quiet numpy pillow
          case "$NOM" in ""|*[!A-Za-z0-9_.-]*) echo "::error::Nom refusé : « $NOM »"; exit 1;; esac
          for v in $POSITION $BORNE $ECART; do case "$v" in *[!0-9-]*) echo "::error::Nombre refusé : « $v »"; exit 1;; esac; done
          mkdir -p travail
          : > travail/rapport.md

      - name: Accès au Ptero
        run: |
          if [ -z "$PTERO_SFTP_HOST" ]; then
            echo "::warning::Secrets du SFTP du Ptero absents : composition avec le schematic déjà enregistré dans le dépôt, s'il y en a un."
            echo "PTERO=non" >> "$GITHUB_ENV"
            exit 0
          fi
          HOTE="${PTERO_SFTP_HOST#sftp://}"
          HOTE="${HOTE%%/*}"
          PORT="${PTERO_SFTP_PORT:-}"
          case "$HOTE" in *:*) [ -z "$PORT" ] && PORT="${HOTE##*:}"; HOTE="${HOTE%%:*}";; esac
          PORT="${PORT:-2022}"
          echo "::add-mask::$HOTE"
          echo "PTERO=oui" >> "$GITHUB_ENV"
          echo "PTERO_HOTE=$HOTE" >> "$GITHUB_ENV"
          echo "PTERO_PORT=$PORT" >> "$GITHUB_ENV"
          echo "LFTP_REGLAGES=set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; set net:reconnect-interval-base 5; set xfer:clobber on;" >> "$GITHUB_ENV"

      # recherche : racine du serveur, plugins/ (WorldEdit : plugins/WorldEdit/schematics/), schematics/, config/
      # (WorldEdit de Forge : config/worldedit/schematics/) et les structures du monde en service (generated/) ; rien d'autre
      - name: Recherche du schematic (lecture seule)
        if: env.PTERO == 'oui'
        run: |
          l() { lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "$LFTP_REGLAGES $1 bye" < /dev/null; }
          cd travail
          MONDE=""
          if l "get /server.properties -o server_ptero.properties;" > /dev/null 2>&1; then
            MONDE=$(tr -d '\r' < server_ptero.properties | sed -n 's/^level-name=//p' | head -n 1)
          fi
          case "$MONDE" in *[!A-Za-z0-9_.-]*|.|..) MONDE="";; esac
          echo "MONDE=$MONDE" >> "$GITHUB_ENV"
          : > tout.txt
          l "cls -1 /;" 2> /dev/null | sed 's#^#/#; s#^//#/#' >> tout.txt || true
          for D in plugins schematics config ${MONDE:+$MONDE/generated}; do
            l "find --maxdepth=6 /$D/;" 2> /dev/null >> tout.txt || true
          done
          echo "$(wc -l < tout.txt) chemins listés"
          grep -i -- "$NOM" tout.txt | grep -v '/$' | sort -u > trouves.txt || true
          {
            echo "## Recherche de « $NOM » sur le Ptero (lecture seule)"
            echo
            echo "Monde en service (server.properties du Ptero) : \`${MONDE:-illisible}\`. Dossiers fouillés : racine, \`plugins/\`, \`schematics/\`, \`config/\`${MONDE:+, \`$MONDE/generated/\`} ($(wc -l < tout.txt) chemins)."
            echo
            if [ -s trouves.txt ]; then
              echo "Fichiers trouvés :"
              sed 's/.*/- `&`/' trouves.txt
            else
              echo "**Aucun fichier dont le nom contient « $NOM ».** Autres schematics présents :"
              grep -i -E '\.(schem|schematic|nbt)$' tout.txt | grep -v -E '/(data|playerdata|stats|advancements)/' | head -n 40 | sed 's/.*/- `&`/' || true
            fi
            echo
          } >> rapport.md
          # le meilleur : .schem, puis .schematic, puis .nbt, puis le reste ; le plus gros à égalité
          mkdir -p candidats
          i=0
          while read -r P; do
            i=$((i + 1)); [ $i -le 10 ] || break
            case "$P" in *[!A-Za-z0-9_./-]*) echo "(nom ignoré : $P)"; continue;; esac
            l "get \"$P\" -o \"candidats/$i-$(basename "$P")\";" > /dev/null 2>&1 || echo "(copie impossible : $P)"
          done < trouves.txt
          ls -la candidats
          CHOIX=$(for f in candidats/*; do
                    [ -f "$f" ] || continue
                    case "$f" in *.schem) r=1;; *.schematic) r=2;; *.nbt) r=3;; *) r=4;; esac
                    echo "$r $(stat -c %s "$f") $f"
                  done | sort -k1,1n -k2,2nr | head -n 1 | cut -d' ' -f3-)
          if [ -n "$CHOIX" ]; then
            T=$(stat -c %s "$CHOIX")
            ORIG=$(sed -n "$(basename "$CHOIX" | cut -d- -f1)p" trouves.txt)
            echo "Choisi : \`$ORIG\` ($T octets)." >> rapport.md
            echo >> rapport.md
            if [ "$T" -gt 90000000 ]; then
              echo "::warning::Schematic de $T octets : trop gros pour le dépôt (100 Mo au plus), composé mais pas enregistré."
            fi
            echo "SCHEMATIC=travail/$CHOIX" >> "$GITHUB_ENV"
            echo "SOURCE=$ORIG" >> "$GITHUB_ENV"
          fi

      # contrôles en lecture seule pour l'arrivée des joueurs : monde du spawn déjà déposé ? décor de la cinématique
      # réglé en jeu (data/heraliz_cinematique.dat du monde en service : il passe avant celui du mod) ?
      - name: Contrôles de l'arrivée (lecture seule)
        if: env.PTERO == 'oui' && env.MONDE != ''
        run: |
          l() { lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "$LFTP_REGLAGES $1 bye" < /dev/null; }
          cd travail
          N=$(l "cls -1 /$MONDE/dimensions/heralisz/spawn/region/;" 2> /dev/null | grep -c '\.mca$' || true)
          l "get /$MONDE/data/heraliz_cinematique.dat -o heraliz_cinematique.dat;" > /dev/null 2>&1 || rm -f heraliz_cinematique.dat
          {
            echo "## Arrivée des joueurs (monde \`$MONDE\` du Ptero, lecture seule)"
            echo
            if [ "${N:-0}" -gt 0 ]; then
              echo "- \`$MONDE/dimensions/heralisz/spawn/\` existe déjà ($N fichiers de régions) : la case « deposer_spawn » REFUSERA de l'écraser. Si c'est l'ancien spawn à remplacer : le supprimer depuis le panel, serveur arrêté, avant le dépôt."
            else
              echo "- monde du spawn pas encore déposé (\`$MONDE/dimensions/heralisz/spawn/\` absent ou vide) : la case « deposer_spawn » le posera."
            fi
          } >> rapport.md
          python - >> rapport.md <<'PY'
          import gzip, sys
          from pathlib import Path
          sys.path.insert(0, "../outils")
          import monde_spawn as ms
          f = Path("heraliz_cinematique.dat")
          if not f.exists():
              print("- décor de la cinématique jamais réglé en jeu sur ce monde : c'est celui du mod qui compte (réveil -61 265 2, monde `heralisz:spawn`).")
          else:
              d = ms.nbt_lire(gzip.decompress(f.read_bytes())).v
              d = d["data"].v if "data" in d else d
              if "reveil" not in d:
                  print("- `data/heraliz_cinematique.dat` présent, sans réglage du réveil : c'est le décor du mod qui compte (`heralisz:spawn`).")
              else:
                  r = d["reveil"].v
                  monde = d["monde"].v if "monde" in d else "minecraft:overworld"
                  pos = "%.1f %.1f %.1f" % (r["x"].v, r["y"].v, r["z"].v)
                  if monde == "heralisz:spawn":
                      print("- décor réglé en jeu : réveil en %s dans `heralisz:spawn` (il passe avant celui du mod ; vérifier qu'il tombe bien dans la grotte : `/cinematique info`)." % pos)
                  else:
                      print("- **ATTENTION** : décor de la cinématique réglé en jeu dans `%s` (réveil en %s). Il passe avant celui du mod : première connexion, mort sans lit et extraction mènent LÀ, pas au monde du spawn. Une fois le monde du spawn déposé : `/cinematique reveil` debout au point de réveil de la grotte (-61 265 2 dans `heralisz:spawn`, regard 45°), puis `/cinematique epave poser`." % (monde, pos))
          print()
          PY

      - name: Schematic déjà dans le dépôt
        run: |
          if [ -z "${SCHEMATIC:-}" ]; then
            F=$(ls monde/spawn_schematic/*.schem monde/spawn_schematic/*.schematic monde/spawn_schematic/*.nbt 2> /dev/null | head -n 1 || true)
            if [ -n "$F" ]; then
              echo "Schematic pris dans le dépôt : \`$F\` (pas trouvé sur le Ptero ou Ptero inaccessible)." >> travail/rapport.md
              echo >> travail/rapport.md
              echo "SCHEMATIC=$F" >> "$GITHUB_ENV"
              echo "SOURCE=dépôt ($F)" >> "$GITHUB_ENV"
            else
              echo "::warning::Aucun schematic « $NOM » : ni sur le Ptero, ni dans monde/spawn_schematic/. Rien n'est composé."
              echo "**Pas de schematic : rien n'est composé.** Le chercher en jeu (\`//schem list\` de WorldEdit), puis relancer avec son nom." >> travail/rapport.md
            fi
          fi

      - name: Composition du monde du spawn
        id: compo
        if: env.SCHEMATIC != ''
        run: |
          cd travail
          S="$GITHUB_WORKSPACE/$SCHEMATIC"
          python ../outils/monde_spawn.py schematic "$S" --rapport schematic.md > schematic.json || { echo "::error::Schematic illisible"; tail -n 5 schematic.json; }
          [ -f schematic.md ] && cat schematic.md >> rapport.md
          OPTS=""
          [ -n "$POSITION" ] && OPTS="$OPTS --position $POSITION"
          [ -n "$BORNE" ] && OPTS="$OPTS --borne $BORNE"
          [ -n "$ECART" ] && OPTS="$OPTS --ecart $ECART"
          set +e
          python ../outils/monde_spawn.py composer "$S" $OPTS --sortie compose --rendus rendus \
            --config-bordure "$GITHUB_WORKSPACE/serveur/defaultconfigs/heraliz_spawn-server.toml" > compose.log 2>&1
          RC=$?
          set -e
          cat compose.log
          {
            echo "## Composition du monde du spawn"
            echo
            if [ $RC -ne 0 ]; then
              echo "**Échec** (rien n'est remplacé dans \`monde/spawn/\`) :"
              echo '```'
              tail -n 15 compose.log
              echo '```'
            else
              echo '```'
              grep '^\[spawn\]' compose.log || true
              echo '```'
            fi
            echo
          } >> rapport.md
          if [ $RC -eq 0 ]; then
            python - >> rapport.md <<'PY'
          import json
          i = json.load(open("compose/spawn/heraliz_spawn.json", encoding="utf-8"))
          s, t, b = i["schematic"], i["tunnel"], i["borne"]
          print("- grotte du terminus inchangée : réveil %s, regard %s°, épave (%d barrières invisibles) ; seule la porte de service de la niche est retirée (passage vers le spawn)." % (" ".join(map(str, i["reveil"])), i["cap"], i["barrieres_epave"]))
          print("- tunnel de %d blocs de la niche (%s) au schematic, %s ; arrivée dans le spawn en %s." % (t["longueur"], " ".join(map(str, t["de"])), "à plat" if t["montee"] == 0 else "escaliers de %+d" % t["montee"], " ".join(map(str, t["arrivee"]))))
          print("- schematic posé avec son coin bas nord-ouest en %s (on y marche en y = %d) ; raccord : %d blocs retirés, %d blocs de sol ajoutés ; %d entités de blocs, %d entités%s." % (" ".join(map(str, s["position"])), s["niveau_de_marche"], s["blocs_retires"], s["sols_ajoutes"], s["entites_de_blocs"], s["entites"], (", %d ignorées (hors du volume)" % s["entites_ignorees"]) if s["entites_ignorees"] else ""))
          print("- borne de départ en %d %d %d, écran vers %s (%s)." % (b["x"], b["y"], b["z"], b["facing"], b["origine"]))
          if i["bordure_suffit"]:
              print("- bordure du monde du spawn : celle par défaut (256 blocs autour du réveil) contient tout.")
          else:
              print("- **bordure du monde du spawn agrandie à %d blocs** (défaut 256) : `serveur/defaultconfigs/heraliz_spawn-server.toml` (copié dans le monde à chaque mise en ligne)." % i["bordure_conseillee"])
          print("\nRendus : `monde/spawn_rendus/` (vue de dessus, coupe le long de la voie, coupe le long du tunnel, vue au réveil, vue en arrivant face à la borne).\n")
          PY
            echo "compose=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Résumé
        if: always()
        run: |
          {
            cat travail/rapport.md 2> /dev/null || true
            echo
            echo "Rien n'a été modifié sur le Ptero."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Garder tout
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: spawn-schematic
          path: |
            travail/rapport.md
            travail/schematic.json
            travail/compose.log
            travail/candidats/
            travail/compose/
            travail/rendus/
          retention-days: 7
          if-no-files-found: ignore

      # schematic, rapport, monde du spawn composé et petits rendus : enregistrés sur la branche de travail (jamais main)
      - name: Enregistrer sur la branche de travail
        if: always() && github.ref_name != 'main'
        run: |
          R=monde/spawn_schematic
          mkdir -p "$R"
          cp travail/rapport.md "$R/rapport.md"
          if [ -n "${SCHEMATIC:-}" ] && [ "${SCHEMATIC#travail/}" != "$SCHEMATIC" ]; then
            T=$(stat -c %s "$SCHEMATIC")
            if [ "$T" -le 90000000 ]; then
              find "$R" -maxdepth 1 -type f \( -name '*.schem' -o -name '*.schematic' -o -name '*.nbt' \) -delete
              cp "$SCHEMATIC" "$R/$(basename "$SCHEMATIC" | cut -d- -f2-)"
            fi
          fi
          if [ "${{ steps.compo.outputs.compose }}" = "oui" ]; then
            rm -rf monde/spawn monde/spawn_rendus
            cp -r travail/compose/spawn monde/spawn
            mkdir -p monde/spawn_rendus
            find travail/rendus -name '*.png' -size -900k -exec cp {} monde/spawn_rendus/ \;
          fi
          git config user.name "HeraliZ"
          git config user.email "heraliz@users.noreply.github.com"
          git add -A "$R"
          [ -d monde/spawn ] && git add -A monde/spawn
          [ -d monde/spawn_rendus ] && git add -A monde/spawn_rendus
          [ -f serveur/defaultconfigs/heraliz_spawn-server.toml ] && git add serveur/defaultconfigs/heraliz_spawn-server.toml
          if git diff --cached --quiet; then echo "Rien de nouveau à enregistrer."; exit 0; fi
          if [ "${{ steps.compo.outputs.compose }}" = "oui" ]; then
            MSG="Monde du spawn : grotte du terminus + schematic du spawn ($NOM), composés (lecture seule sur le Ptero)"
          else
            MSG="Schematic du spawn : compte rendu de la recherche sur le Ptero (lecture seule)"
          fi
          git commit -q -m "$MSG"
          for i in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:refs/heads/$GITHUB_REF_NAME" && break
            sleep 5
          done
          echo "Enregistré sur la branche $GITHUB_REF_NAME : $R/ $( [ "${{ steps.compo.outputs.compose }}" = "oui" ] && echo 'monde/spawn/ monde/spawn_rendus/')" >> "$GITHUB_STEP_SUMMARY"
