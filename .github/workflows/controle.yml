# Contrôle d'une demande de fusion (pull request) vers main : fabrique les mods modifiés et lance les contrôles possibles
# sans Minecraft (GeckoLib, langues, noms perso), comme la mise en ligne (serveur.yml), mais SANS rien envoyer au Ptero
# ni au site. Une fusion n'est faite que si ce contrôle est vert : main reste toujours fabricable.
name: Contrôle avant fusion

on:
  pull_request:
    branches: [main]
    paths: ["mods/**", "outils/**", ".github/workflows/serveur.yml", ".github/workflows/controle.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fabriquer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NOMS_INTERDITS: ${{ secrets.NOMS_INTERDITS }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # caches de la mise en ligne, en lecture seule : les jars de main déjà fabriqués sont repris, seuls les mods
      # modifiés par la demande sont refaits (rien n'est réécrit dans les caches de main)
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mods/*/build.gradle', 'mods/*/gradle.properties') }}
          restore-keys: gradle-

      - uses: actions/cache/restore@v4
        with:
          path: mods/*/build/libs
          key: jars-${{ github.sha }}
          restore-keys: jars-

      - name: Fabriquer les mods modifiés
        run: python outils/construire.py --si-change

      - name: Noms interdits
        if: env.NOMS_INTERDITS != ''
        run: printf '%s\n' "$NOMS_INTERDITS" > outils/noms_interdits.txt

      - name: Contrôles (GeckoLib, noms perso, langues)
        run: python outils/verifier.py --sans-split
