# Gunpacks du serveur : compare le dossier tacz du Ptero au dépôt (outils/gunpacks_serveur.py). Le serveur envoie aux
# joueurs les armes de TOUS les gunpacks de son dossier tacz, mais les joueurs n'ont que les images du dépôt : un
# gunpack resté sur le Ptero sans être dans le dépôt donne des carrés roses et noirs dans le menu créatif (la mise en
# ligne complète tacz sans rien y supprimer). Par défaut LECTURE SEULE (résumé de l'exécution). Case « supprimer » :
# ce qui n'est pas dans le dépôt est SUPPRIMÉ du Ptero (gunpacks entiers, index d'objets en trop ; le pack par défaut de
# TaCZ est gardé), pris en compte au prochain redémarrage du serveur. Part aussi, en lecture seule, d'une branche de
# travail quand ce fichier ou l'outil change.
name: Gunpacks du serveur

on:
  workflow_dispatch:
    inputs:
      supprimer:
        description: "Supprimer du Ptero les gunpacks et objets qui ne sont pas dans le dépôt (carrés roses)"
        type: boolean
        default: false
  push:
    branches-ignore: [main]
    paths: [".github/workflows/gunpacks.yml", "outils/gunpacks_serveur.py"]

permissions:
  contents: read

concurrency:
  group: serveur
  cancel-in-progress: false

jobs:
  gunpacks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PTERO_SFTP_HOST: ${{ secrets.PTERO_SFTP_HOST }}
      PTERO_SFTP_PORT: ${{ secrets.PTERO_SFTP_PORT }}
      PTERO_SFTP_USER: ${{ secrets.PTERO_SFTP_USER }}
      PTERO_SFTP_PASSWORD: ${{ secrets.PTERO_SFTP_PASSWORD }}
      PYTHONIOENCODING: utf-8
      SUPPRIMER: ${{ github.event_name == 'workflow_dispatch' && inputs.supprimer }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comparaison avec le dépôt (et suppression si demandée)
        run: |
          pip install --quiet paramiko
          if [ "$SUPPRIMER" = "true" ]; then
            python outils/gunpacks_serveur.py --resume resume.md --supprimer
          else
            python outils/gunpacks_serveur.py --resume resume.md
          fi
          cat resume.md >> "$GITHUB_STEP_SUMMARY"
