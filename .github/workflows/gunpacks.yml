# Gunpacks du serveur : compare le dossier tacz du Ptero au dépôt (outils/gunpacks_serveur.py). Le serveur envoie aux
# joueurs les armes de TOUS les gunpacks de son dossier tacz, mais les joueurs n'ont que les images du dépôt : un
# gunpack resté sur le Ptero sans être dans le dépôt donne des carrés roses et noirs dans le menu créatif (la mise en
# ligne complète tacz sans rien y supprimer). Par défaut LECTURE SEULE (résumé de l'exécution). Case « ranger » : ce
# qui n'est pas dans le dépôt est DÉPLACÉ vers /tacz_ranges/<date>/ (jamais effacé ; pour revenir en arrière, le
# remettre dans /tacz), pris en compte au prochain redémarrage du serveur. Part aussi, en lecture seule, d'une branche
# de travail quand ce fichier ou l'outil change.
name: Gunpacks du serveur

on:
  workflow_dispatch:
    inputs:
      ranger:
        description: "Déplacer vers /tacz_ranges/<date>/ ce qui n'est pas dans le dépôt (rien n'est effacé)"
        type: boolean
        default: false
  push:
    branches-ignore: [main]
    paths: [".github/workflows/gunpacks.yml", "outils/gunpacks_serveur.py"]

permissions:
  contents: read

concurrency:
  group: serveur
  cancel-in-progress: false

jobs:
  gunpacks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PTERO_SFTP_HOST: ${{ secrets.PTERO_SFTP_HOST }}
      PTERO_SFTP_PORT: ${{ secrets.PTERO_SFTP_PORT }}
      PTERO_SFTP_USER: ${{ secrets.PTERO_SFTP_USER }}
      PTERO_SFTP_PASSWORD: ${{ secrets.PTERO_SFTP_PASSWORD }}
      PYTHONIOENCODING: utf-8
      RANGER: ${{ github.event_name == 'workflow_dispatch' && inputs.ranger }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comparaison avec le dépôt (et rangement si demandé)
        run: |
          pip install --quiet paramiko
          if [ "$RANGER" = "true" ]; then
            python outils/gunpacks_serveur.py --resume resume.md --ranger
          else
            python outils/gunpacks_serveur.py --resume resume.md
          fi
          cat resume.md >> "$GITHUB_STEP_SUMMARY"
