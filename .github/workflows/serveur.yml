# Fabrication et mise en ligne du serveur HeraliZ (voir CLAUDE.md, section 8).
# À chaque envoi sur main : fabrique les mods modifiés, contrôle, garde les jars à télécharger et, si les secrets du
# Ptero sont réglés, met à jour les fichiers du serveur par SFTP. Redémarrage seulement sur demande (Run workflow).
name: Serveur HeraliZ

on:
  push:
    branches: [main]
    paths: ["mods/**", "serveur/**", "client/**", "outils/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      redemarrer:
        description: "Redémarrer le serveur après la mise à jour"
        type: boolean
        default: false
      installation_complete:
        description: "Installation complète : envoyer aussi Mohist et les fichiers de la racine (server.properties...)"
        type: boolean
        default: false
      deposer_carte:
        description: "Nouvelle carte : la carte de monde/HeraliZ devient le monde du serveur (ancien monde gardé en copie, serveur redémarré)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: serveur
  cancel-in-progress: false

jobs:
  serveur:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PTERO_SFTP_HOST: ${{ secrets.PTERO_SFTP_HOST }}
      PTERO_SFTP_PORT: ${{ secrets.PTERO_SFTP_PORT }}
      PTERO_SFTP_USER: ${{ secrets.PTERO_SFTP_USER }}
      PTERO_SFTP_PASSWORD: ${{ secrets.PTERO_SFTP_PASSWORD }}
      PTERO_URL: ${{ secrets.PTERO_URL }}
      PTERO_SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
      PTERO_API_KEY: ${{ secrets.PTERO_API_KEY }}
      NOMS_INTERDITS: ${{ secrets.NOMS_INTERDITS }}
      SPARTAN_DISCORD_ALERTES: ${{ secrets.SPARTAN_DISCORD_ALERTES }}
      SPARTAN_DISCORD_SANCTIONS: ${{ secrets.SPARTAN_DISCORD_SANCTIONS }}
      SPARTAN_LAUNCHER_SECRET: ${{ secrets.SPARTAN_LAUNCHER_SECRET }}
      LITEBANS_DB_USER: ${{ secrets.LITEBANS_DB_USER }}
      LITEBANS_DB_PASSWORD: ${{ secrets.LITEBANS_DB_PASSWORD }}
      # accès à la VM du site réglés (pack du launcher) ; les secrets eux-mêmes ne sont donnés qu'à l'étape du pack
      SITE_PRET: ${{ secrets.SITE_SSH_HOTE != '' && secrets.SITE_SSH_UTILISATEUR != '' && secrets.SITE_SSH_MDP != '' }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # chaque fichier reprend la date de son dernier changement dans Git (et non celle du téléchargement) : la mise en
      # ligne ne renvoie au Ptero que ce qui a vraiment changé
      - name: Dates des fichiers (celles de Git)
        run: |
          python - <<'EOF'
          import os, subprocess
          sortie = subprocess.run(["git", "-c", "core.quotepath=false", "log", "--name-only", "--no-renames", "--format=@%ct"],
                                  capture_output=True, text=True, encoding="utf-8", errors="replace").stdout
          date, vus = None, set()
          for l in sortie.splitlines():
              if l.startswith("@"):
                  date = int(l[1:])
              elif l and l not in vus:
                  vus.add(l)
                  if os.path.isfile(l):
                      os.utime(l, (date, date))
          print(len(vus), "fichiers datés")
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # caches : Gradle (Minecraft, Forge, bibliothèques) et jars déjà fabriqués (seuls les mods modifiés sont refaits)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mods/*/build.gradle', 'mods/*/gradle.properties') }}
          restore-keys: gradle-

      - uses: actions/cache@v4
        with:
          path: mods/*/build/libs
          key: jars-${{ github.sha }}
          restore-keys: jars-

      - name: Fabriquer les mods modifiés
        run: python outils/construire.py --si-change

      # liste des noms perso interdits (un par ligne), gardée dans un secret : jamais écrite dans le dépôt
      - name: Noms interdits
        if: env.NOMS_INTERDITS != ''
        run: printf '%s\n' "$NOMS_INTERDITS" > outils/noms_interdits.txt

      - name: Contrôles (GeckoLib, noms perso)
        run: python outils/verifier.py --sans-split

      # copies à télécharger dans l'onglet Actions : un quota d'artefacts plein (« Artifact storage quota has been
      # hit ») ne doit pas bloquer la suite
      - name: Garder nos jars serveur
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: mods-serveur
          path: livraison/mods serveur/*-serveur.jar
          retention-days: 3

      - name: Garder nos jars joueurs
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: mods-client
          path: |
            livraison/mods client/*-client.jar
            livraison/mods client/heraliz_interface-*.jar
            livraison/mods client/dayzhotbar-*.jar
          retention-days: 3

      # secrets écrits dans les fichiers envoyés, jamais dans le dépôt : webhooks Discord et secret du launcher de
      # Spartan ; base de données de LiteBans (sans ses secrets : base locale H2, sans historique des sanctions)
      - name: Secrets (Spartan, LiteBans)
        if: env.PTERO_SFTP_HOST != ''
        run: |
          python - <<'EOF'
          import os, pathlib, re
          p = pathlib.Path("serveur/config/spartan-common.toml")
          s = p.read_text(encoding="utf-8")
          for marque in ("SPARTAN_DISCORD_ALERTES", "SPARTAN_DISCORD_SANCTIONS", "SPARTAN_LAUNCHER_SECRET"):
              valeur = os.environ.get(marque, "").strip().replace("\\", "\\\\").replace('"', '\\"')
              s = s.replace("__%s__" % marque, valeur)
          p.write_text(s, encoding="utf-8")
          p = pathlib.Path("livraison/plugins/LiteBans/config.yml")
          s = p.read_text(encoding="utf-8")
          user, mdp = os.environ.get("LITEBANS_DB_USER", "").strip(), os.environ.get("LITEBANS_DB_PASSWORD", "").strip()
          if not (user and mdp):
              s = re.sub(r"(?m)^(\s*driver\s*:\s*).+$", lambda m: m.group(1) + "H2", s)
          for marque, valeur in (("LITEBANS_DB_USER", user), ("LITEBANS_DB_PASSWORD", mdp)):
              s = s.replace("__%s__" % marque, valeur.replace("'", "''"))
          p.write_text(s, encoding="utf-8")
          EOF

      # Adresse du SFTP nettoyée (« sftp:// » ou port collés par erreur) et testée AVANT tout envoi : un Ptero
      # injoignable fait échouer la mise en ligne en quelques secondes, avec un message clair (au lieu d'attendre 2 h).
      - name: Accès au Ptero
        if: env.PTERO_SFTP_HOST != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp netcat-openbsd
          HOTE="${PTERO_SFTP_HOST#sftp://}"
          HOTE="${HOTE%%/*}"
          PORT="${PTERO_SFTP_PORT:-}"
          case "$HOTE" in *:*) [ -z "$PORT" ] && PORT="${HOTE##*:}"; HOTE="${HOTE%%:*}";; esac
          PORT="${PORT:-2022}"
          echo "::add-mask::$HOTE"
          if ! timeout 20 nc -z -w 15 "$HOTE" "$PORT"; then
            echo "::error::Le SFTP du Ptero ne répond pas depuis GitHub (port $PORT). Vérifier PTERO_SFTP_HOST (adresse seule, sans sftp:// ni :port), PTERO_SFTP_PORT, et que le SFTP est ouvert sur internet."
            exit 1
          fi
          echo "SFTP du Ptero joignable (port $PORT)."
          echo "PTERO_HOTE=$HOTE" >> "$GITHUB_ENV"
          echo "PTERO_PORT=$PORT" >> "$GITHUB_ENV"
          echo "LFTP_REGLAGES=set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30; set net:reconnect-interval-base 5;" >> "$GITHUB_ENV"

      - name: Mettre à jour le Ptero (SFTP)
        if: env.PTERO_SFTP_HOST != ''
        timeout-minutes: 60
        run: |
          # plugins retirés du dépôt : on supprime leur JAR du Ptero, un par un (jamais leurs dossiers de données)
          lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "$LFTP_REGLAGES cls -1 /plugins/; bye" > plugins_ptero.txt
          python - <<'EOF'
          import pathlib
          garder = {p.name for p in pathlib.Path("livraison/plugins").glob("*.jar")}
          distants = [l.strip().rstrip("/").split("/")[-1] for l in open("plugins_ptero.txt", encoding="utf-8", errors="replace")]
          retirer = sorted(n for n in distants if n.lower().endswith(".jar") and n not in garder)
          with open("retirer.lftp", "w", encoding="utf-8") as f:
              for n in retirer:
                  f.write('rm -f "/plugins/%s"' % n.replace('"', '') + chr(10))
          print("plugins retirés du Ptero :", ", ".join(retirer) or "aucun")
          EOF
          # le monde en service : level-name du server.properties du Ptero (celui du dépôt à défaut)
          MONDE=""
          if lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" \
              -e "$LFTP_REGLAGES set cmd:fail-exit yes; set xfer:clobber on; get /server.properties -o server_ptero_maj.properties; bye" < /dev/null; then
            MONDE=$(tr -d '\r' < server_ptero_maj.properties | sed -n 's/^level-name=//p' | head -n 1)
          fi
          case "$MONDE" in ""|.|..|*[!A-Za-z0-9_.-]*)
            MONDE=$(grep -E '^level-name=' serveur/server.properties | cut -d= -f2)
            echo "::warning::server.properties du Ptero illisible : réglages serverconfig copiés dans /$MONDE (nom du dépôt).";;
          esac
          echo "Monde du serveur : /$MONDE"
          lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "
            $LFTP_REGLAGES
            source retirer.lftp;
            mirror -R -P 8 --delete 'livraison/mods serveur' /mods;
            mirror -R -P 8 --exclude-glob *.jar --exclude-glob *.db --exclude-glob *.sqlite livraison/plugins /plugins;
            mput -O /plugins livraison/plugins/*.jar;
            mirror -R -P 8 serveur/config /config;
            mkdir -p -f /config/spartan; put -O /config/spartan livraison/spartan/officiel.json;
            mirror -R -P 8 serveur/defaultconfigs /defaultconfigs;
            mirror -R -P 8 serveur/defaultconfigs /$MONDE/serverconfig;
            mirror -R -P 8 serveur/tacz /tacz;
            rm -f /tacz/arkaniaz_pack_0_converted/data/tacz/index/blocks/ammo_workbench.json /tacz/arkaniaz_pack_0_converted/data/tacz/index/blocks/attachment_workbench.json /tacz/arkaniaz_pack_0_converted/data/tacz/data/blocks/ammo_workbench.json /tacz/arkaniaz_pack_0_converted/data/tacz/data/blocks/attachment_workbench.json;
            mirror -R -P 8 serveur/heralisz_matchs /heralisz_matchs;
            mirror -R -P 8 serveur/mohist-config /mohist-config;
            bye"
          echo "Mise à jour du Ptero terminée."

      # Première installation (ou serveur à remettre à neuf) : Mohist, pris dans la Release « base-serveur » et contrôlé
      # par serveur/mohist.sha256, + les fichiers de la racine. Le monde, ops.json et libraries/ ne sont jamais envoyés
      # (Mohist télécharge ses bibliothèques au premier démarrage).
      - name: Installation complète (Mohist et racine du serveur)
        if: env.PTERO_SFTP_HOST != '' && github.event_name == 'workflow_dispatch' && inputs.installation_complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download base-serveur --pattern "$(cut -d' ' -f3 serveur/mohist.sha256)" --dir serveur
          (cd serveur && sha256sum -c mohist.sha256)
          lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "
            $LFTP_REGLAGES
            mput -O / serveur/mohist-*.jar serveur/server.properties serveur/bukkit.yml serveur/spigot.yml serveur/commands.yml serveur/eula.txt serveur/server-icon.png;
            bye"

      # Nouvelle carte (case « deposer_carte ») : la carte de départ de monde/HeraliZ devient le monde du serveur.
      # 1. envoi de la carte À CÔTÉ (<monde>_nouvelle_<date>) pendant que le serveur tourne, reprise si la liaison coupe,
      #    contrôle fichier par fichier, réglages serverconfig du monde en service puis ceux du dépôt ;
      # 2. joueurs prévenus, arrêt propre ; 3. l'ancien monde prend le nom <monde>_ancien_<date> (jamais supprimé) et la
      #    carte prend sa place ; 4. redémarrage. Un échec avant la bascule ne touche ni au serveur ni à son monde.
      # Clans, hérals, tags, bunkers (reposés seuls), comptes AuthMe et bans sont hors du monde : rien n'est perdu.
      - name: Mettre la carte de départ en service
        if: github.event_name == 'workflow_dispatch' && inputs.deposer_carte
        timeout-minutes: 90
        run: |
          if [ -z "$PTERO_SFTP_HOST" ] || [ -z "$PTERO_URL" ] || [ -z "$PTERO_SERVER_ID" ] || [ -z "$PTERO_API_KEY" ]; then
            echo "::error::Il faut les secrets du SFTP et de l'API du Ptero : le serveur doit être arrêté pour changer de monde."
            exit 1
          fi
          API="${PTERO_URL%/}/api/client/servers/$PTERO_SERVER_ID"
          ptero() {
            curl -sS -f --retry 3 --retry-all-errors -H "Authorization: Bearer $PTERO_API_KEY" -H "Content-Type: application/json" \
              -H "Accept: Application/vnd.pterodactyl.v1+json" "$@"
          }
          etat() { ptero "$API/resources" | python -c 'import json, sys; print(json.load(sys.stdin)["attributes"]["current_state"])'; }
          sftp() { lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "$LFTP_REGLAGES set cmd:fail-exit yes; set xfer:clobber on; $1 bye" < /dev/null; }
          existe() { sftp "cls -d \"$1\";" > /dev/null 2>&1; }

          # le monde en service : level-name du server.properties DU PTERO, obligatoirement (le nom du dépôt peut être
          # différent : se tromper de nom poserait la carte à côté du monde que le serveur charge)
          MONDE=""
          if sftp "get /server.properties -o server_ptero_carte.properties;"; then
            MONDE=$(tr -d '\r' < server_ptero_carte.properties | sed -n 's/^level-name=//p' | head -n 1)
          fi
          case "$MONDE" in
            ""|.|..|*[!A-Za-z0-9_.-]*|mods|plugins|config|defaultconfigs|libraries|logs|tacz|heralisz_*|heraliz_*|mohist-config)
              echo "::error::Nom du monde illisible ou inattendu dans le server.properties du Ptero : « $MONDE ». Rien n'a été changé."
              exit 1;;
          esac
          DATE=$(date -u +%Y-%m-%d_%Hh%M)
          NOUVEAU="${MONDE}_nouvelle_$DATE"
          if ! sftp "cls -1 /;" > racine_brute.txt; then
            echo "::error::Les dossiers du Ptero ne se lisent pas. Rien n'a été changé."
            exit 1
          fi
          tr -d '\r' < racine_brute.txt | sed 's:/*$::; s:.*/::' > racine_ptero.txt
          echo "Monde du serveur : /$MONDE. Dossiers du Ptero : $(paste -sd ' ' racine_ptero.txt)"

          # 1. la carte à côté, serveur en marche ; une liaison coupée reprend là où elle s'est arrêtée (3 essais)
          for essai in 1 2 3; do
            if sftp "set net:timeout 120; set net:max-retries 10; set net:reconnect-interval-base 10; mirror -R -P 2 monde/HeraliZ \"/$NOUVEAU\";"; then
              break
            fi
            if [ "$essai" = 3 ]; then
              echo "::error::La carte n'a pas pu être envoyée (3 essais). Le serveur et son monde n'ont pas été touchés ; carte incomplète dans /$NOUVEAU (à supprimer depuis le panel)."
              exit 1
            fi
            echo "Envoi interrompu (essai $essai sur 3) : reprise là où il s'est arrêté."
          done
          # contrôle : chaque fichier présent avec la bonne taille (seule la ligne « mkdir -p » du dossier est attendue)
          sftp "mirror -R --dry-run --ignore-time --no-perms monde/HeraliZ \"/$NOUVEAU\";" > controle.txt 2>&1 || echo "contrôle impossible" >> controle.txt
          grep -v '^mkdir -p ' controle.txt | sed -E 's#//[^/@]*@#//#g' > ecarts.txt || true
          if [ -s ecarts.txt ] || ! grep -q '^mkdir -p ' controle.txt; then
            head -n 50 ecarts.txt
            echo "::error::Carte envoyée incomplète ($(wc -l < ecarts.txt) écarts). Le serveur et son monde n'ont pas été touchés ; carte incomplète dans /$NOUVEAU (à supprimer depuis le panel)."
            exit 1
          fi
          echo "Carte envoyée dans /$NOUVEAU et contrôlée : $(find monde/HeraliZ -type f | wc -l) fichiers."
          # réglages « serveur » des mods : ceux du monde en service, puis ceux du dépôt (ils font foi)
          if grep -Fxq "$MONDE" racine_ptero.txt && existe "/$MONDE/serverconfig"; then
            sftp "mirror \"/$MONDE/serverconfig\" ancien_serverconfig;" && sftp "mirror -R ancien_serverconfig \"/$NOUVEAU/serverconfig\";" \
              || echo "::warning::Réglages du monde en service non recopiés (Forge reprendra ceux de defaultconfigs)."
          fi
          sftp "mirror -R serveur/defaultconfigs \"/$NOUVEAU/serverconfig\";" || echo "::warning::defaultconfigs non recopié (Forge le fera au démarrage)."

          # 2. arrêt propre : le serveur sauvegarde l'ancien monde avant la bascule
          if ! E=$(etat); then
            echo "::error::L'API du Ptero ne répond pas : serveur et monde non touchés (carte prête dans /$NOUVEAU)."
            exit 1
          fi
          echo "Serveur : $E"
          if [ "$E" != "offline" ]; then
            if [ "$E" = "running" ]; then
              ptero -X POST "$API/command" -d '{"command":"say Nouvelle carte : redémarrage du serveur dans 1 minute."}' > /dev/null || true
              sleep 60
            fi
            if ! ptero -X POST "$API/power" -d '{"signal":"stop"}'; then
              echo "::error::Le panel refuse d'arrêter le serveur : monde non touché (carte prête dans /$NOUVEAU)."
              exit 1
            fi
            for _ in $(seq 90); do
              sleep 10
              E=$(etat || echo inconnu)
              [ "$E" = "offline" ] && break
            done
            if [ "$E" != "offline" ]; then
              echo "::error::Le serveur ne s'est pas arrêté en 15 minutes (état : $E) : monde non touché (carte prête dans /$NOUVEAU). Vérifier le serveur dans le panel."
              exit 1
            fi
          fi
          echo "Serveur arrêté."

          # 3. bascule : l'ancien monde (et ses dimensions à part, s'il y en a) garde ses fichiers sous un autre nom,
          #    la carte prend sa place. En cas d'échec, les anciens noms sont remis et le serveur redémarre dessus.
          DEPLACES=""
          retablir() {
            echo "::error::Échec pendant $1 : l'ancien monde est remis en place (carte laissée dans /$NOUVEAU)."
            for nom in $DEPLACES; do
              if ! sftp "mv \"/${nom}_ancien_$DATE\" \"/$nom\";"; then
                echo "::error::/${nom}_ancien_$DATE n'a pas pu reprendre le nom /$nom : serveur laissé arrêté, le renommer depuis le panel."
                return
              fi
            done
            ptero -X POST "$API/power" -d '{"signal":"start"}' || true
          }
          for nom in "$MONDE" "${MONDE}_nether" "${MONDE}_the_end"; do
            grep -Fxq "$nom" racine_ptero.txt || continue
            if ! sftp "mv \"/$nom\" \"/${nom}_ancien_$DATE\";"; then retablir "la mise de côté de /$nom"; exit 1; fi
            DEPLACES="$DEPLACES $nom"
            echo "/$nom gardé dans /${nom}_ancien_$DATE"
          done
          if existe "/$MONDE"; then retablir "la mise de côté de l'ancien monde (/$MONDE est toujours là)"; exit 1; fi
          if ! sftp "mv \"/$NOUVEAU\" \"/$MONDE\";"; then retablir "la mise en place de la carte"; exit 1; fi
          echo "La carte est maintenant /$MONDE."
          GARDE="aucun (pas de monde /$MONDE sur le Ptero)"
          case " $DEPLACES " in *" $MONDE "*) GARDE="/${MONDE}_ancien_$DATE";; esac

          # zones WorldGuard de l'ancien monde : elles restent rattachées au nom du monde, donc aux mêmes coordonnées
          ZONES=""
          if sftp "get \"/plugins/WorldGuard/worlds/$MONDE/regions.yml\" -o regions_ptero.yml;" 2> /dev/null; then
            ZONES=$(python - <<'EOF'
          import re
          zones, retrait, dedans = [], None, False
          for l in open("regions_ptero.yml", encoding="utf-8", errors="replace").read().splitlines():
              if not l.strip() or l.lstrip().startswith("#"):
                  continue
              if not dedans:
                  dedans = re.match(r"regions\s*:", l) is not None
                  continue
              r = len(l) - len(l.lstrip(" "))
              if r == 0:
                  break
              retrait = retrait or r
              m = re.match(r"([^ :#][^:]*):\s*$", l[r:]) if r == retrait else None
              if m and m.group(1).strip("'\"") != "__global__":
                  zones.append(m.group(1).strip("'\""))
          print(" ".join(zones))
          EOF
            ) || ZONES=""
            if [ -n "$ZONES" ]; then
              echo "::warning::Zones WorldGuard de l'ancienne carte toujours actives (mêmes coordonnées sur la nouvelle) : $ZONES"
            fi
          fi

          # 4. redémarrage sur la nouvelle carte
          if ! ptero -X POST "$API/power" -d '{"signal":"start"}'; then
            echo "::error::La carte est en place mais le serveur n'a pas pu être démarré : le démarrer depuis le panel."
            exit 1
          fi
          debut=$SECONDS
          E=""
          while [ $((SECONDS - debut)) -lt 900 ]; do
            sleep 15
            E=$(etat || echo inconnu)
            [ "$E" = "running" ] && break
            [ "$E" = "offline" ] && [ $((SECONDS - debut)) -gt 60 ] && break
          done
          {
            echo "### Nouvelle carte déposée sur le Ptero"
            echo "- monde du serveur : \`/$MONDE\` (carte de \`monde/HeraliZ\`, contrôlée fichier par fichier)"
            case "$GARDE" in
              /*) echo "- ancien monde gardé tel quel : \`$GARDE\` (à supprimer depuis le panel quand tout va bien)";;
              *) echo "- ancien monde : $GARDE";;
            esac
            if [ -n "$ZONES" ]; then echo "- zones WorldGuard de l'ancienne carte encore actives, aux mêmes coordonnées : $ZONES"; fi
            echo "- état du serveur après le démarrage : $E"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$E" in
            running) echo "Serveur démarré sur la nouvelle carte. Ancien monde gardé : $GARDE.";;
            offline) echo "::error::Le serveur s'est arrêté pendant son démarrage sur la nouvelle carte : voir la console du panel. Ancien monde gardé : $GARDE."
                     exit 1;;
            *) echo "::warning::Démarrage pas encore terminé après 15 minutes (état : $E) : voir la console du panel. Ancien monde gardé : $GARDE.";;
          esac

      - name: Redémarrer le serveur
        if: env.PTERO_API_KEY != '' && github.event_name == 'workflow_dispatch' && inputs.redemarrer && !inputs.deposer_carte
        run: |
          curl -sS -f -X POST "$PTERO_URL/api/client/servers/$PTERO_SERVER_ID/power" \
            -H "Authorization: Bearer $PTERO_API_KEY" -H "Content-Type: application/json" \
            -H "Accept: Application/vnd.pterodactyl.v1+json" -d '{"signal":"restart"}'

      # Pack du launcher (voir CLAUDE.md, section 8) : les jars joueurs de CETTE fabrication (ceux qui viennent d'aller
      # sur le Ptero : Spartan compare leurs empreintes) et le dossier tacz, mis en forme par Nebula (le générateur de
      # Helios, version figée), puis déposés sur la VM du site, là où le launcher les cherche (distributionUrl de
      # launcher/app/heraliz.json). Dernière étape : un échec ici ne retient ni la mise à jour du Ptero ni son redémarrage.
      - uses: actions/setup-node@v4
        if: env.SITE_PRET == 'true' && env.PTERO_SFTP_HOST != ''
        with:
          node-version: "22"

      - name: Pack du launcher (heraliz.fr/launcher)
        if: env.SITE_PRET == 'true' && env.PTERO_SFTP_HOST != ''
        timeout-minutes: 45
        env:
          NEBULA: 7ffc978727b95e03ae9d125688cf5cf132b78419
          SITE_SSH_HOTE: ${{ secrets.SITE_SSH_HOTE }}
          SITE_SSH_PORT: ${{ secrets.SITE_SSH_PORT }}
          SITE_SSH_UTILISATEUR: ${{ secrets.SITE_SSH_UTILISATEUR }}
          SITE_SSH_MDP: ${{ secrets.SITE_SSH_MDP }}
        run: |
          git init -q nebula
          git -C nebula fetch -q --depth 1 https://github.com/dscalzi/Nebula.git "$NEBULA"
          git -C nebula checkout -q FETCH_HEAD
          if ! (cd nebula && npm ci --no-audit --no-fund && npm run build) > nebula.log 2>&1; then tail -n 60 nebula.log; exit 1; fi
          # (Nebula affiche toute la distribution : seules les lignes de l'outil sont gardées, sauf en cas d'échec)
          if ! python outils/pack_launcher.py nebula pack --version "1.0.$GITHUB_RUN_NUMBER" > pack.log 2>&1; then tail -n 80 pack.log; exit 1; fi
          grep '^\[pack\]' pack.log

          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync > /dev/null
          export SSHPASS="$SITE_SSH_MDP"
          SSH=(ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15 -o PubkeyAuthentication=no -p "${SITE_SSH_PORT:-22}")
          VM="$SITE_SSH_UTILISATEUR@$SITE_SSH_HOTE"
          DOSSIER=/var/www/launcher
          if ! sshpass -e "${SSH[@]}" "$VM" true < /dev/null; then
            echo "::error::Connexion à la VM du site impossible : vérifier les secrets SITE_SSH_* (le workflow « Site HeraliZ », choix « verifier », aide à trouver)."
            exit 1
          fi
          if ! sshpass -e "${SSH[@]}" "$VM" "command -v rsync > /dev/null && [ -w $DOSSIER ]" < /dev/null; then
            echo "::error::La VM du site n'est pas prête pour le pack (rsync ou dossier $DOSSIER) : lancer le workflow « Site HeraliZ » avec « installer », puis relancer cette mise en ligne."
            exit 1
          fi
          # 1. fichiers nouveaux ou changés, mis en place tous ensemble à la fin ; 2. distribution.json ; 3. retrait des
          # anciens fichiers : un joueur qui lance le launcher pendant l'envoi ne tombe jamais sur un fichier manquant
          RS=(rsync -r --perms --checksum --chmod=D755 --chmod=F644 -e "sshpass -e ${SSH[*]}")
          "${RS[@]}" --delay-updates --exclude=/distribution.json pack/envoi/ "$VM:$DOSSIER/"
          "${RS[@]}" pack/envoi/distribution.json "$VM:$DOSSIER/"
          "${RS[@]}" --delete pack/envoi/ "$VM:$DOSSIER/"

          # vu d'internet : la distribution servie est celle envoyée, et quelques fichiers ont la bonne taille
          python - <<'EOF'
          import json, os, sys, urllib.request
          envoi = json.load(open("pack/envoi/distribution.json", encoding="utf-8"))
          r = json.load(open("pack/resume.json", encoding="utf-8"))
          base = r["distribution"].rsplit("/", 1)[0] + "/"
          def ouvrir(url, methode="GET"):
              return urllib.request.urlopen(urllib.request.Request(url, method=methode, headers={"Cache-Control": "no-cache"}), timeout=60)
          def echec(message):
              print("::error::" + message)
              sys.exit(1)
          try:
              with ouvrir(r["distribution"]) as rep:
                  servie = json.loads(rep.read())
          except Exception as e:
              echec(f"{r['distribution']} illisible ({e}) : lancer le workflow « Site HeraliZ » avec « installer » (accès /launcher/ du site).")
          if servie != envoi:
              echec(f"{r['distribution']} ne donne pas le pack envoyé.")
          mods = [m for s in envoi["servers"] for m in s["modules"]]
          fichiers = [m for m in mods if m["type"] == "File"]
          choix = [m for m in mods if m["type"] in ("ForgeHosted", "ForgeMod")][:2] + fichiers[:1] + fichiers[len(fichiers) // 2:][:1] + fichiers[-1:]
          for m in choix:
              a = m["artifact"]
              if not a["url"].startswith(base):
                  continue
              try:
                  with ouvrir(a["url"], "HEAD") as rep:
                      taille = rep.headers.get("Content-Length")
              except Exception as e:
                  echec(f"{a['url']} illisible ({e}).")
              if taille != str(a["size"]):
                  echec(f"{a['url']} : taille {taille} au lieu de {a['size']}.")
          print(f"Pack du launcher en ligne : {r['distribution']} ({r['mods']} mods, {r['fichiers']} fichiers, {r['octets'] / 1048576:.0f} Mo).")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Pack du launcher\n"
                      f"- {r['mods']} mods joueurs, {r['fichiers']} fichiers, {r['octets'] / 1048576:.0f} Mo (version {r['version']})\n"
                      f"- en ligne : {r['distribution']}\n")
          EOF
