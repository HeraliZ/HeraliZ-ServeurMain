# Fabrication et mise en ligne du serveur HeraliZ (voir CLAUDE.md, section 8).
# À chaque envoi sur main : fabrique les mods modifiés, contrôle, garde les jars à télécharger et, si les secrets du
# Ptero sont réglés, met à jour les fichiers du serveur par SFTP. Redémarrage seulement sur demande (Run workflow).
name: Serveur HeraliZ

on:
  push:
    branches: [main]
    paths: ["mods/**", "serveur/**", "client/**", "outils/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      redemarrer:
        description: "Redémarrer le serveur après la mise à jour"
        type: boolean
        default: false
      installation_complete:
        description: "Installation complète : envoyer aussi Mohist et les fichiers de la racine (server.properties...)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: serveur
  cancel-in-progress: false

jobs:
  serveur:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PTERO_SFTP_HOST: ${{ secrets.PTERO_SFTP_HOST }}
      PTERO_SFTP_PORT: ${{ secrets.PTERO_SFTP_PORT }}
      PTERO_SFTP_USER: ${{ secrets.PTERO_SFTP_USER }}
      PTERO_SFTP_PASSWORD: ${{ secrets.PTERO_SFTP_PASSWORD }}
      PTERO_URL: ${{ secrets.PTERO_URL }}
      PTERO_SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
      PTERO_API_KEY: ${{ secrets.PTERO_API_KEY }}
      NOMS_INTERDITS: ${{ secrets.NOMS_INTERDITS }}
      SPARTAN_DISCORD_ALERTES: ${{ secrets.SPARTAN_DISCORD_ALERTES }}
      SPARTAN_DISCORD_SANCTIONS: ${{ secrets.SPARTAN_DISCORD_SANCTIONS }}
      SPARTAN_LAUNCHER_SECRET: ${{ secrets.SPARTAN_LAUNCHER_SECRET }}
      LITEBANS_DB_USER: ${{ secrets.LITEBANS_DB_USER }}
      LITEBANS_DB_PASSWORD: ${{ secrets.LITEBANS_DB_PASSWORD }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # chaque fichier reprend la date de son dernier changement dans Git (et non celle du téléchargement) : la mise en
      # ligne ne renvoie au Ptero que ce qui a vraiment changé
      - name: Dates des fichiers (celles de Git)
        run: |
          python - <<'EOF'
          import os, subprocess
          sortie = subprocess.run(["git", "-c", "core.quotepath=false", "log", "--name-only", "--no-renames", "--format=@%ct"],
                                  capture_output=True, text=True, encoding="utf-8", errors="replace").stdout
          date, vus = None, set()
          for l in sortie.splitlines():
              if l.startswith("@"):
                  date = int(l[1:])
              elif l and l not in vus:
                  vus.add(l)
                  if os.path.isfile(l):
                      os.utime(l, (date, date))
          print(len(vus), "fichiers datés")
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # caches : Gradle (Minecraft, Forge, bibliothèques) et jars déjà fabriqués (seuls les mods modifiés sont refaits)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mods/*/build.gradle', 'mods/*/gradle.properties') }}
          restore-keys: gradle-

      - uses: actions/cache@v4
        with:
          path: mods/*/build/libs
          key: jars-${{ github.sha }}
          restore-keys: jars-

      - name: Fabriquer les mods modifiés
        run: python outils/construire.py --si-change

      # liste des noms perso interdits (un par ligne), gardée dans un secret : jamais écrite dans le dépôt
      - name: Noms interdits
        if: env.NOMS_INTERDITS != ''
        run: printf '%s\n' "$NOMS_INTERDITS" > outils/noms_interdits.txt

      - name: Contrôles (GeckoLib, noms perso)
        run: python outils/verifier.py --sans-split

      - name: Garder nos jars serveur
        uses: actions/upload-artifact@v4
        with:
          name: mods-serveur
          path: livraison/mods serveur/*-serveur.jar
          retention-days: 3

      - name: Garder nos jars joueurs
        uses: actions/upload-artifact@v4
        with:
          name: mods-client
          path: |
            livraison/mods client/*-client.jar
            livraison/mods client/heraliz_interface-*.jar
            livraison/mods client/dayzhotbar-*.jar
          retention-days: 3

      # secrets écrits dans les fichiers envoyés, jamais dans le dépôt : webhooks Discord et secret du launcher de
      # Spartan ; base de données de LiteBans (sans ses secrets : base locale H2, sans historique des sanctions)
      - name: Secrets (Spartan, LiteBans)
        if: env.PTERO_SFTP_HOST != ''
        run: |
          python - <<'EOF'
          import os, pathlib, re
          p = pathlib.Path("serveur/config/spartan-common.toml")
          s = p.read_text(encoding="utf-8")
          for marque in ("SPARTAN_DISCORD_ALERTES", "SPARTAN_DISCORD_SANCTIONS", "SPARTAN_LAUNCHER_SECRET"):
              valeur = os.environ.get(marque, "").strip().replace("\\", "\\\\").replace('"', '\\"')
              s = s.replace("__%s__" % marque, valeur)
          p.write_text(s, encoding="utf-8")
          p = pathlib.Path("livraison/plugins/LiteBans/config.yml")
          s = p.read_text(encoding="utf-8")
          user, mdp = os.environ.get("LITEBANS_DB_USER", "").strip(), os.environ.get("LITEBANS_DB_PASSWORD", "").strip()
          if not (user and mdp):
              s = re.sub(r"(?m)^(\s*driver\s*:\s*).+$", lambda m: m.group(1) + "H2", s)
          for marque, valeur in (("LITEBANS_DB_USER", user), ("LITEBANS_DB_PASSWORD", mdp)):
              s = s.replace("__%s__" % marque, valeur.replace("'", "''"))
          p.write_text(s, encoding="utf-8")
          EOF

      # Adresse du SFTP nettoyée (« sftp:// » ou port collés par erreur) et testée AVANT tout envoi : un Ptero
      # injoignable fait échouer la mise en ligne en quelques secondes, avec un message clair (au lieu d'attendre 2 h).
      - name: Accès au Ptero
        if: env.PTERO_SFTP_HOST != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp netcat-openbsd
          HOTE="${PTERO_SFTP_HOST#sftp://}"
          HOTE="${HOTE%%/*}"
          PORT="${PTERO_SFTP_PORT:-}"
          case "$HOTE" in *:*) [ -z "$PORT" ] && PORT="${HOTE##*:}"; HOTE="${HOTE%%:*}";; esac
          PORT="${PORT:-2022}"
          echo "::add-mask::$HOTE"
          if ! timeout 20 nc -z -w 15 "$HOTE" "$PORT"; then
            echo "::error::Le SFTP du Ptero ne répond pas depuis GitHub (port $PORT). Vérifier PTERO_SFTP_HOST (adresse seule, sans sftp:// ni :port), PTERO_SFTP_PORT, et que le SFTP est ouvert sur internet."
            exit 1
          fi
          echo "SFTP du Ptero joignable (port $PORT)."
          echo "PTERO_HOTE=$HOTE" >> "$GITHUB_ENV"
          echo "PTERO_PORT=$PORT" >> "$GITHUB_ENV"
          echo "LFTP_REGLAGES=set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30; set net:reconnect-interval-base 5;" >> "$GITHUB_ENV"

      - name: Mettre à jour le Ptero (SFTP)
        if: env.PTERO_SFTP_HOST != ''
        timeout-minutes: 60
        run: |
          # plugins retirés du dépôt : on supprime leur JAR du Ptero, un par un (jamais leurs dossiers de données)
          lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "$LFTP_REGLAGES cls -1 /plugins/; bye" > plugins_ptero.txt
          python - <<'EOF'
          import pathlib
          garder = {p.name for p in pathlib.Path("livraison/plugins").glob("*.jar")}
          distants = [l.strip().rstrip("/").split("/")[-1] for l in open("plugins_ptero.txt", encoding="utf-8", errors="replace")]
          retirer = sorted(n for n in distants if n.lower().endswith(".jar") and n not in garder)
          with open("retirer.lftp", "w", encoding="utf-8") as f:
              for n in retirer:
                  f.write('rm -f "/plugins/%s"' % n.replace('"', '') + chr(10))
          print("plugins retirés du Ptero :", ", ".join(retirer) or "aucun")
          EOF
          MONDE=$(grep -E '^level-name=' serveur/server.properties | cut -d= -f2)
          lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "
            $LFTP_REGLAGES
            source retirer.lftp;
            mirror -R -P 8 --delete 'livraison/mods serveur' /mods;
            mirror -R -P 8 --exclude-glob *.jar --exclude-glob *.db --exclude-glob *.sqlite livraison/plugins /plugins;
            mput -O /plugins livraison/plugins/*.jar;
            mirror -R -P 8 serveur/config /config;
            mkdir -p -f /config/spartan; put -O /config/spartan livraison/spartan/officiel.json;
            mirror -R -P 8 serveur/defaultconfigs /defaultconfigs;
            mirror -R -P 8 serveur/defaultconfigs /$MONDE/serverconfig;
            mirror -R -P 8 serveur/tacz /tacz;
            rm -f /tacz/arkaniaz_pack_0_converted/data/tacz/index/blocks/ammo_workbench.json /tacz/arkaniaz_pack_0_converted/data/tacz/index/blocks/attachment_workbench.json /tacz/arkaniaz_pack_0_converted/data/tacz/data/blocks/ammo_workbench.json /tacz/arkaniaz_pack_0_converted/data/tacz/data/blocks/attachment_workbench.json;
            mirror -R -P 8 serveur/heralisz_matchs /heralisz_matchs;
            mirror -R -P 8 serveur/mohist-config /mohist-config;
            bye"
          echo "Mise à jour du Ptero terminée."

      # Première installation (ou serveur à remettre à neuf) : Mohist, pris dans la Release « base-serveur » et contrôlé
      # par serveur/mohist.sha256, + les fichiers de la racine. Le monde, ops.json et libraries/ ne sont jamais envoyés
      # (Mohist télécharge ses bibliothèques au premier démarrage).
      - name: Installation complète (Mohist et racine du serveur)
        if: env.PTERO_SFTP_HOST != '' && github.event_name == 'workflow_dispatch' && inputs.installation_complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download base-serveur --pattern "$(cut -d' ' -f3 serveur/mohist.sha256)" --dir serveur
          (cd serveur && sha256sum -c mohist.sha256)
          lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "
            $LFTP_REGLAGES
            mput -O / serveur/mohist-*.jar serveur/server.properties serveur/bukkit.yml serveur/spigot.yml serveur/commands.yml serveur/eula.txt serveur/server-icon.png;
            bye"

      - name: Redémarrer le serveur
        if: env.PTERO_API_KEY != '' && github.event_name == 'workflow_dispatch' && inputs.redemarrer
        run: |
          curl -sS -f -X POST "$PTERO_URL/api/client/servers/$PTERO_SERVER_ID/power" \
            -H "Authorization: Bearer $PTERO_API_KEY" -H "Content-Type: application/json" \
            -H "Accept: Application/vnd.pterodactyl.v1+json" -d '{"signal":"restart"}'
