# Fabrication et mise en ligne du serveur HeraliZ (voir CLAUDE.md, section 8).
# À chaque envoi sur main : fabrique les mods modifiés, contrôle, garde les jars à télécharger et, si les secrets du
# Ptero sont réglés, met à jour les fichiers du serveur par SFTP. Redémarrage seulement sur demande (Run workflow).
name: Serveur HeraliZ

on:
  push:
    branches: [main]
    paths: ["mods/**", "serveur/**", "client/**", "outils/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      redemarrer:
        description: "Redémarrer le serveur après la mise à jour"
        type: boolean
        default: false
      installation_complete:
        description: "Installation complète : envoyer aussi Mohist et les fichiers de la racine (server.properties...)"
        type: boolean
        default: false
      deposer_carte:
        description: "Nouvelle carte : la carte de monde/HeraliZ devient le monde du serveur (ancien monde gardé en copie, serveur redémarré)"
        type: boolean
        default: false
      deposer_spawn:
        description: "Monde du spawn : déposer monde/spawn du dépôt (grotte + schematic du spawn ; sinon la grotte générée) dans dimensions/heralisz/spawn du monde (une seule fois, refusé si déjà là ; puis redémarrer)"
        type: boolean
        default: false
      reinitialiser_bases:
        description: "Monde des bases : mettre de côté dimensions/crac/bases (renommé bases_ancien_<date>, jamais supprimé) pour que Minecraft le refasse avec le nouveau terrain (serveur arrêté puis redémarré ; bases posées perdues)"
        type: boolean
        default: false
      tester_discord:
        description: "Envoyer un message de test dans le salon Discord privé des alertes de Spartan"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: serveur
  cancel-in-progress: false

jobs:
  serveur:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PTERO_SFTP_HOST: ${{ secrets.PTERO_SFTP_HOST }}
      PTERO_SFTP_PORT: ${{ secrets.PTERO_SFTP_PORT }}
      PTERO_SFTP_USER: ${{ secrets.PTERO_SFTP_USER }}
      PTERO_SFTP_PASSWORD: ${{ secrets.PTERO_SFTP_PASSWORD }}
      PTERO_URL: ${{ secrets.PTERO_URL }}
      PTERO_SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
      PTERO_API_KEY: ${{ secrets.PTERO_API_KEY }}
      NOMS_INTERDITS: ${{ secrets.NOMS_INTERDITS }}
      SPARTAN_DISCORD_ALERTES: ${{ secrets.SPARTAN_DISCORD_ALERTES }}
      SPARTAN_DISCORD_SANCTIONS: ${{ secrets.SPARTAN_DISCORD_SANCTIONS }}
      LITEBANS_DB_USER: ${{ secrets.LITEBANS_DB_USER }}
      LITEBANS_DB_PASSWORD: ${{ secrets.LITEBANS_DB_PASSWORD }}
      HERALIBOT_LIEN_URL: ${{ secrets.HERALIBOT_LIEN_URL }}
      HERALIBOT_LIEN_CLE: ${{ secrets.HERALIBOT_LIEN_CLE }}
      # accès à la VM du site réglés (pack du launcher) ; les secrets eux-mêmes ne sont donnés qu'à l'étape du pack
      SITE_PRET: ${{ secrets.SITE_SSH_HOTE != '' && secrets.SITE_SSH_UTILISATEUR != '' && secrets.SITE_SSH_MDP != '' }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # chaque fichier reprend la date de son dernier changement dans Git (et non celle du téléchargement) : la mise en
      # ligne ne renvoie au Ptero que ce qui a vraiment changé
      - name: Dates des fichiers (celles de Git)
        run: |
          python - <<'EOF'
          import os, subprocess
          sortie = subprocess.run(["git", "-c", "core.quotepath=false", "log", "--name-only", "--no-renames", "--format=@%ct"],
                                  capture_output=True, text=True, encoding="utf-8", errors="replace").stdout
          date, vus = None, set()
          for l in sortie.splitlines():
              if l.startswith("@"):
                  date = int(l[1:])
              elif l and l not in vus:
                  vus.add(l)
                  if os.path.isfile(l):
                      os.utime(l, (date, date))
          print(len(vus), "fichiers datés")
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # caches : Gradle (Minecraft, Forge, bibliothèques) et jars déjà fabriqués (seuls les mods modifiés sont refaits)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mods/*/build.gradle', 'mods/*/gradle.properties') }}
          restore-keys: gradle-

      - uses: actions/cache@v4
        with:
          path: mods/*/build/libs
          key: jars-${{ github.sha }}
          restore-keys: jars-

      - name: Fabriquer les mods modifiés
        # Gradle et ses dépendances (code d'autres auteurs) ne voient aucun secret
        run: python outils/sans_secrets.py python outils/construire.py --si-change

      # liste des noms perso interdits (un par ligne), gardée dans un secret : jamais écrite dans le dépôt
      - name: Noms interdits
        if: env.NOMS_INTERDITS != ''
        run: printf '%s\n' "$NOMS_INTERDITS" > outils/noms_interdits.txt

      - name: Contrôles (GeckoLib, noms perso, langues)
        run: python outils/verifier.py --sans-split

      # copies à télécharger dans l'onglet Actions : un quota d'artefacts plein (« Artifact storage quota has been
      # hit ») ne doit pas bloquer la suite
      - name: Garder nos jars serveur
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: mods-serveur
          path: livraison/mods serveur/*-serveur.jar
          retention-days: 3

      - name: Garder nos jars joueurs
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: mods-client
          path: |
            livraison/mods client/*-client.jar
            livraison/mods client/heraliz_interface-*.jar
            livraison/mods client/dayzhotbar-*.jar
          retention-days: 3

      # clé des jetons de lancement du jeu : créée sur la VM du site (site/vm/theme.sh), qui signe les jetons pour le
      # compte connecté au launcher ; lue ici à chaque envoi pour que Spartan les vérifie. Jamais dans le dépôt, ni dans
      # un secret GitHub, ni dans le launcher.
      - name: Clé des jetons du launcher (site)
        if: env.SITE_PRET == 'true' && env.PTERO_SFTP_HOST != ''
        env:
          SITE_SSH_HOTE: ${{ secrets.SITE_SSH_HOTE }}
          SITE_SSH_PORT: ${{ secrets.SITE_SSH_PORT }}
          SITE_SSH_UTILISATEUR: ${{ secrets.SITE_SSH_UTILISATEUR }}
          SITE_SSH_MDP: ${{ secrets.SITE_SSH_MDP }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null
          export SSHPASS="$SITE_SSH_MDP"
          SSH=(ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o PubkeyAuthentication=no -p "${SITE_SSH_PORT:-22}")
          VM="$SITE_SSH_UTILISATEUR@$SITE_SSH_HOTE"
          CLE=/var/www/azuriom/storage/app/heraliz/jeton-jeu.cle
          if [ "$SITE_SSH_UTILISATEUR" = root ]; then
            cle=$(sshpass -e "${SSH[@]}" "$VM" "cat $CLE" < /dev/null 2> /dev/null || true)
          else
            cle=$(printf '%s\n' "$SITE_SSH_MDP" | sshpass -e "${SSH[@]}" "$VM" "sudo -S -p '' cat $CLE" 2> /dev/null || true)
          fi
          cle=$(printf '%s' "$cle" | tr -d '\r\n')
          if [ "${#cle}" -ge 32 ]; then
            echo "::add-mask::$cle"
            (umask 077 && printf '%s' "$cle" > "$RUNNER_TEMP/jeton-jeu.cle")
            echo "Clé des jetons de lancement : lue sur le site"
          else
            echo "::warning::Clé des jetons de lancement introuvable sur le site (lancer « Site HeraliZ » avec « theme ») : Spartan ne pourra vérifier aucun jeton."
          fi
          # clé des Points Boutique (/boutique et /trade en jeu, PbController de l'extension du site)
          PB=/var/www/azuriom/storage/app/heraliz/pb.cle
          if [ "$SITE_SSH_UTILISATEUR" = root ]; then
            cle=$(sshpass -e "${SSH[@]}" "$VM" "cat $PB 2> /dev/null" < /dev/null || true)
          else
            cle=$(printf '%s\n' "$SITE_SSH_MDP" | sshpass -e "${SSH[@]}" "$VM" "sudo -S -p '' cat $PB 2> /dev/null" || true)
          fi
          cle=$(printf '%s' "$cle" | tr -d '\r\n')
          if [ "${#cle}" -ge 40 ]; then
            echo "::add-mask::$cle"
            (umask 077 && printf '%s' "$cle" > "$RUNNER_TEMP/pb.cle")
            echo "Clé des Points Boutique : lue sur le site"
          else
            echo "::warning::Clé des Points Boutique introuvable sur le site (lancer « Site HeraliZ » avec « theme ») : /boutique et /trade sans PB."
          fi
          unset cle

      # secrets écrits dans les fichiers envoyés, jamais dans le dépôt : webhooks Discord et clé des jetons de Spartan ;
      # base de données de LiteBans (sans ses secrets : base locale H2, sans historique des sanctions) ; adresse et clé du
      # lien Discord <-> Minecraft avec HeraliBot (heraliz-grades ; sans elles, le lien est simplement désactivé)
      - name: Secrets (Spartan, LiteBans, lien Discord)
        if: env.PTERO_SFTP_HOST != ''
        run: |
          python - <<'EOF'
          import os, pathlib, re
          p = pathlib.Path("serveur/config/spartan-common.toml")
          s = p.read_text(encoding="utf-8")
          fichier_cle = pathlib.Path(os.environ.get("RUNNER_TEMP", "/tmp"), "jeton-jeu.cle")
          valeurs = {
              "SPARTAN_DISCORD_ALERTES": os.environ.get("SPARTAN_DISCORD_ALERTES", ""),
              "SPARTAN_DISCORD_SANCTIONS": os.environ.get("SPARTAN_DISCORD_SANCTIONS", ""),
              "SPARTAN_LAUNCHER_SECRET": fichier_cle.read_text(encoding="utf-8") if fichier_cle.exists() else "",
          }
          # sans clé, Spartan refuserait tous les joueurs si les jetons sont obligatoires : rien n'est envoyé
          if not valeurs["SPARTAN_LAUNCHER_SECRET"].strip() and re.search(r"(?m)^\s*tokenRequired\s*=\s*true", s):
              raise SystemExit("::error::tokenRequired = true sans clé des jetons (site injoignable ?) : tous les joueurs seraient refusés. Rien n'est envoyé.")
          for marque, valeur in valeurs.items():
              valeur = valeur.strip().replace("\\", "\\\\").replace('"', '\\"')
              s = s.replace("__%s__" % marque, valeur)
          p.write_text(s, encoding="utf-8")
          p = pathlib.Path("livraison/plugins/LiteBans/config.yml")
          s = p.read_text(encoding="utf-8")
          user, mdp = os.environ.get("LITEBANS_DB_USER", "").strip(), os.environ.get("LITEBANS_DB_PASSWORD", "").strip()
          if not (user and mdp):
              s = re.sub(r"(?m)^(\s*driver\s*:\s*).+$", lambda m: m.group(1) + "H2", s)
          for marque, valeur in (("LITEBANS_DB_USER", user), ("LITEBANS_DB_PASSWORD", mdp)):
              s = s.replace("__%s__" % marque, valeur.replace("'", "''"))
          p.write_text(s, encoding="utf-8")
          # lien Discord : secrets HERALIBOT_LIEN_* s'ils existent, sinon lus sur le Ptero avec la clé client du compte :
          # serveur nommé « HeraliBot », sa clé data/cle-lien.txt (créée par le bot) et son port (même machine que le panel).
          # La clé n'est jamais affichée (masquée dans les journaux) ; sans elle, le lien est simplement désactivé.
          url_lien = os.environ.get("HERALIBOT_LIEN_URL", "").strip()
          cle_lien = os.environ.get("HERALIBOT_LIEN_CLE", "").strip()
          if not (url_lien and cle_lien) and os.environ.get("PTERO_URL") and os.environ.get("PTERO_API_KEY"):
              import json, urllib.parse, urllib.request
              base = os.environ["PTERO_URL"].strip().rstrip("/")
              def api(chemin):
                  req = urllib.request.Request(base + chemin, headers={"Authorization": "Bearer " + os.environ["PTERO_API_KEY"], "Accept": "application/json"})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.read()
              try:
                  serveurs = json.loads(api("/api/client?per_page=100"))["data"]
                  bot = next((x["attributes"] for x in serveurs if x["attributes"]["name"].strip().lower() == "heralibot"), None)
                  if bot is None:
                      raise LookupError("serveur « HeraliBot » absent du compte")
                  if not cle_lien:
                      cle_lien = api("/api/client/servers/%s/files/contents?file=%s" % (bot["identifier"], urllib.parse.quote("/data/cle-lien.txt"))).decode("utf-8").strip()
                  if cle_lien:
                      print("::add-mask::" + cle_lien)
                  if not url_lien:
                      alloc = next(a["attributes"] for a in bot["relationships"]["allocations"]["data"] if a["attributes"]["is_default"])
                      url_lien = "http://%s:%d" % (urllib.parse.urlparse(base).hostname, alloc["port"])
                  print("Lien Discord : adresse et clé de HeraliBot lues sur le Ptero")
              except Exception as e:
                  print("::warning::Lien Discord (heraliz-grades) : réglages de HeraliBot illisibles sur le Ptero (%s) : lien désactivé" % type(e).__name__)
          # Points Boutique : adresse du site et clé de PbController (jamais dans le dépôt)
          fichier_pb = pathlib.Path(os.environ.get("RUNNER_TEMP", "/tmp"), "pb.cle")
          if fichier_pb.exists():
              import json as _json
              d = pathlib.Path("serveur/config/heraliz_grades"); d.mkdir(parents=True, exist_ok=True)
              (d / "boutique_site.json").write_text(_json.dumps({"url": "https://heraliz.fr", "cle": fichier_pb.read_text(encoding="utf-8").strip()}), encoding="utf-8")
          p = pathlib.Path("serveur/config/heraliz_grades/lien.json")
          if p.exists():
              s = p.read_text(encoding="utf-8")
              for marque, valeur in (("HERALIBOT_LIEN_URL", url_lien), ("HERALIBOT_LIEN_CLE", cle_lien)):
                  s = s.replace("__%s__" % marque, valeur.replace("\\", "\\\\").replace('"', '\\"'))
              p.write_text(s, encoding="utf-8")
          EOF

      # Spartan : les webhooks Discord existent-ils encore ? (Discord répond sur le webhook lui-même, sans rien poster ;
      # aucune adresse n'est affichée.) Message de test seulement avec la case « tester_discord ».
      - name: Spartan (Discord et launcher)
        if: env.PTERO_SFTP_HOST != ''
        env:
          TESTER_DISCORD: ${{ github.event_name == 'workflow_dispatch' && inputs.tester_discord }}
        run: |
          python - <<'EOF'
          import json, os, re, urllib.error, urllib.request
          lignes = ["### Spartan"]
          def webhook(nom, marque, tester):
              url = os.environ.get(marque, "").strip()
              if not url:
                  return f"- {nom} : **absent** (secret `{marque}`) : rien ne sera envoyé sur Discord"
              if not re.fullmatch(r"https://(canary\.|ptb\.)?discord(app)?\.com/api/webhooks/\d+/[\w-]+", url):
                  return f"- {nom} : le secret `{marque}` ne ressemble pas à une adresse de webhook Discord"
              requete = urllib.request.Request(url, headers={"User-Agent": "HeraliZ-mise-en-ligne"})
              try:
                  with urllib.request.urlopen(requete, timeout=20) as r:
                      info = json.load(r)
              except urllib.error.HTTPError as e:
                  return f"- {nom} : **refusé par Discord** (code {e.code} : webhook supprimé ?) : à recréer, puis mettre sa nouvelle adresse dans `{marque}`"
              except Exception as e:
                  return f"- {nom} : Discord injoignable ({type(e).__name__})"
              ligne = f"- {nom} : valide (webhook « {info.get('name', '?')} »)"
              if tester:
                  corps = {"username": "Spartan", "allowed_mentions": {"parse": []},
                           "content": "Test de la mise en ligne HeraliZ : ce salon reçoit bien les alertes de l'anticheat Spartan."}
                  def poster(donnees):
                      envoi = urllib.request.Request(url + "?wait=true", data=json.dumps(donnees).encode(), method="POST",
                                                     headers={"Content-Type": "application/json", "User-Agent": "HeraliZ-mise-en-ligne"})
                      with urllib.request.urlopen(envoi, timeout=20):
                          pass
                  try:
                      try:
                          poster(corps)
                          ligne += " ; message de test envoyé"
                      except urllib.error.HTTPError as e:
                          if e.code != 400:
                              raise
                          # Salon Forum : Discord exige le titre de la publication (Spartan 2.6.0, un fil par joueur).
                          poster(dict(corps, thread_name="Test de la mise en ligne"))
                          ligne += " ; salon Forum : message de test envoyé dans la publication « Test de la mise en ligne »"
                  except Exception as e:
                      ligne += f" ; message de test **refusé** ({getattr(e, 'code', type(e).__name__)})"
              return ligne
          tester = os.environ.get("TESTER_DISCORD") == "true"
          lignes.append(webhook("Alertes (salon privé du staff)", "SPARTAN_DISCORD_ALERTES", tester))
          lignes.append(webhook("Sanctions (salon public)", "SPARTAN_DISCORD_SANCTIONS", False))
          fichier_cle = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "jeton-jeu.cle")
          lignes.append("- Clé des jetons de lancement (signés par le site) : " + ("lue sur le site" if os.path.exists(fichier_cle) else "**absente** : Spartan ne peut vérifier aucun jeton"))
          texte = "\n".join(lignes)
          print(texte)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(texte + "\n")
          EOF

      # Adresse du SFTP nettoyée (« sftp:// » ou port collés par erreur) et testée AVANT tout envoi : un Ptero
      # injoignable fait échouer la mise en ligne en quelques secondes, avec un message clair (au lieu d'attendre 2 h).
      # AzLink (Azuriom) : relie la boutique du site au serveur (commandes des achats jouées par la console). Jar officiel
      # pris dans la dernière version publiée par Azuriom sur GitHub (jamais dans le dépôt) ; sa clé se règle une fois en
      # jeu par la console (« azlink setup … », donnée par l'administration du site) et reste dans plugins/AzLink/.
      - name: AzLink (boutique du site)
        if: env.PTERO_SFTP_HOST != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF'
          import hashlib, json, os, re, urllib.request
          def get(url, accept="application/vnd.github+json"):
              req = urllib.request.Request(url, headers={"Accept": accept, "Authorization": "Bearer " + os.environ["GH_TOKEN"], "User-Agent": "HeraliZ"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read()
          try:
              rel = json.loads(get("https://api.github.com/repos/Azuriom/AzLink/releases/latest"))
              asset = next(a for a in rel["assets"] if re.fullmatch(r"AzLink-[\d.]+\.jar", a["name"]))
              data = get(asset["browser_download_url"], "application/octet-stream")
              open("livraison/plugins/" + asset["name"], "wb").write(data)
              ligne = "- AzLink %s (sha256 %s)" % (rel["tag_name"], hashlib.sha256(data).hexdigest()[:16])
          except Exception as e:
              ligne = "- AzLink : **non téléchargé** (%s) ; la version déjà sur le Ptero est gardée" % type(e).__name__
              print("::warning::" + ligne)
          print(ligne)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("### Boutique\n" + ligne + "\n")
          EOF

      - name: Accès au Ptero
        if: env.PTERO_SFTP_HOST != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp netcat-openbsd
          HOTE="${PTERO_SFTP_HOST#sftp://}"
          HOTE="${HOTE%%/*}"
          PORT="${PTERO_SFTP_PORT:-}"
          case "$HOTE" in *:*) [ -z "$PORT" ] && PORT="${HOTE##*:}"; HOTE="${HOTE%%:*}";; esac
          PORT="${PORT:-2022}"
          echo "::add-mask::$HOTE"
          if ! timeout 20 nc -z -w 15 "$HOTE" "$PORT"; then
            echo "::error::Le SFTP du Ptero ne répond pas depuis GitHub (port $PORT). Vérifier PTERO_SFTP_HOST (adresse seule, sans sftp:// ni :port), PTERO_SFTP_PORT, et que le SFTP est ouvert sur internet."
            exit 1
          fi
          echo "SFTP du Ptero joignable (port $PORT)."
          echo "PTERO_HOTE=$HOTE" >> "$GITHUB_ENV"
          echo "PTERO_PORT=$PORT" >> "$GITHUB_ENV"
          echo "LFTP_REGLAGES=set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30; set net:reconnect-interval-base 5;" >> "$GITHUB_ENV"

      - name: Mettre à jour le Ptero (SFTP)
        if: env.PTERO_SFTP_HOST != ''
        timeout-minutes: 60
        run: |
          # plugins retirés du dépôt : on supprime leur JAR du Ptero, un par un (jamais leurs dossiers de données)
          lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "$LFTP_REGLAGES cls -1 /plugins/; bye" > plugins_ptero.txt
          python - <<'EOF'
          import pathlib
          garder = {p.name for p in pathlib.Path("livraison/plugins").glob("*.jar")}
          distants = [l.strip().rstrip("/").split("/")[-1] for l in open("plugins_ptero.txt", encoding="utf-8", errors="replace")]
          # AzLink non téléchargé cette fois : celui déjà sur le Ptero est gardé (la boutique continue de livrer)
          if not any(n.startswith("AzLink-") for n in garder):
              garder |= {n for n in distants if n.startswith("AzLink-") and n.endswith(".jar")}
          # pas deux versions d'AzLink à la fois
          if any(n.startswith("AzLink-") for n in garder):
              garder = {n for n in garder if not n.startswith("AzLink-")} | {max(n for n in garder if n.startswith("AzLink-"))}
          retirer = sorted(n for n in distants if n.lower().endswith(".jar") and n not in garder)
          with open("retirer.lftp", "w", encoding="utf-8") as f:
              for n in retirer:
                  f.write('rm -f "/plugins/%s"' % n.replace('"', '') + chr(10))
          print("plugins retirés du Ptero :", ", ".join(retirer) or "aucun")
          # gunpacks : fichiers retirés du dépôt, listés dans serveur/tacz_retires.txt, effacés de /tacz après la copie
          tacz = []
          for l in open("serveur/tacz_retires.txt", encoding="utf-8"):
              l = l.strip()
              if l and not l.startswith("#") and ".." not in l and not l.startswith("/") and '"' not in l:
                  tacz.append(l)
          with open("retirer_tacz.lftp", "w", encoding="utf-8") as f:
              for n in tacz:
                  f.write('rm -f "/tacz/%s"' % n + chr(10))
          print("fichiers de gunpacks retirés du Ptero (s'ils y sont encore) :", len(tacz))
          # configs : fichiers retirés du dépôt, listés dans serveur/config_retires.txt, effacés de /config après la copie
          conf = []
          for l in open("serveur/config_retires.txt", encoding="utf-8"):
              l = l.strip()
              if l and not l.startswith("#") and ".." not in l and not l.startswith("/") and '"' not in l:
                  conf.append(l)
          with open("retirer_config.lftp", "w", encoding="utf-8") as f:
              for n in conf:
                  f.write('rm -f "/config/%s"' % n + chr(10))
          print("fichiers de config retirés du Ptero (s'ils y sont encore) :", len(conf))
          EOF
          # le monde en service : level-name du server.properties du Ptero (celui du dépôt à défaut)
          MONDE=""
          if lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" \
              -e "$LFTP_REGLAGES set cmd:fail-exit yes; set xfer:clobber on; get /server.properties -o server_ptero_maj.properties; bye" < /dev/null; then
            MONDE=$(tr -d '\r' < server_ptero_maj.properties | sed -n 's/^level-name=//p' | head -n 1)
          fi
          case "$MONDE" in ""|.|..|*[!A-Za-z0-9_.-]*)
            MONDE=$(grep -E '^level-name=' serveur/server.properties | cut -d= -f2)
            echo "::warning::server.properties du Ptero illisible : réglages serverconfig copiés dans /$MONDE (nom du dépôt).";;
          esac
          echo "Monde du serveur : /$MONDE"
          echo "MONDE=$MONDE" >> "$GITHUB_ENV"
          lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "
            $LFTP_REGLAGES
            source retirer.lftp;
            mirror -R -P 8 --delete 'livraison/mods serveur' /mods;
            mirror -R -P 8 --exclude-glob *.jar --exclude-glob *.db --exclude-glob *.sqlite livraison/plugins /plugins;
            mput -O /plugins livraison/plugins/*.jar;
            mirror -R -P 8 serveur/config /config;
            source retirer_config.lftp;
            mkdir -p -f /config/spartan; put -O /config/spartan livraison/spartan/officiel.json;
            mirror -R -P 8 serveur/defaultconfigs /defaultconfigs;
            mkdir -p -f /$MONDE/serverconfig;
            mput -O /$MONDE/serverconfig serveur/defaultconfigs/*;
            mirror -R -P 8 serveur/tacz /tacz;
            source retirer_tacz.lftp;
            mirror -R -P 8 serveur/heralisz_matchs /heralisz_matchs;
            mirror -R -P 8 serveur/mohist-config /mohist-config;
            bye"
          echo "Mise à jour du Ptero terminée."

      # Première installation (ou serveur à remettre à neuf) : Mohist, pris dans la Release « base-serveur » et contrôlé
      # par serveur/mohist.sha256, + les fichiers de la racine. Le monde, ops.json et libraries/ ne sont jamais envoyés
      # (Mohist télécharge ses bibliothèques au premier démarrage).
      - name: Installation complète (Mohist et racine du serveur)
        if: env.PTERO_SFTP_HOST != '' && github.event_name == 'workflow_dispatch' && inputs.installation_complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download base-serveur --pattern "$(cut -d' ' -f3 serveur/mohist.sha256)" --dir serveur
          (cd serveur && sha256sum -c mohist.sha256)
          lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "
            $LFTP_REGLAGES
            mput -O / serveur/mohist-*.jar serveur/server.properties serveur/bukkit.yml serveur/spigot.yml serveur/commands.yml serveur/eula.txt serveur/server-icon.png;
            bye"

      # Nouvelle carte (case « deposer_carte ») : la carte de départ de monde/HeraliZ devient le monde du serveur.
      # 1. envoi de la carte À CÔTÉ (<monde>_nouvelle_<date>) pendant que le serveur tourne, reprise si la liaison coupe,
      #    contrôle fichier par fichier, réglages serverconfig du monde en service puis ceux du dépôt ;
      # 2. joueurs prévenus, arrêt propre ; 3. l'ancien monde prend le nom <monde>_ancien_<date> (jamais supprimé) et la
      #    carte prend sa place ; 4. redémarrage. Un échec avant la bascule ne touche ni au serveur ni à son monde.
      # Clans, hérals, tags, bunkers (reposés seuls), comptes AuthMe et bans sont hors du monde : rien n'est perdu.
      - name: Mettre la carte de départ en service
        if: github.event_name == 'workflow_dispatch' && inputs.deposer_carte
        timeout-minutes: 90
        run: |
          if [ -z "$PTERO_SFTP_HOST" ] || [ -z "$PTERO_URL" ] || [ -z "$PTERO_SERVER_ID" ] || [ -z "$PTERO_API_KEY" ]; then
            echo "::error::Il faut les secrets du SFTP et de l'API du Ptero : le serveur doit être arrêté pour changer de monde."
            exit 1
          fi
          API="${PTERO_URL%/}/api/client/servers/$PTERO_SERVER_ID"
          ptero() {
            curl -sS -f --retry 3 --retry-all-errors -H "Authorization: Bearer $PTERO_API_KEY" -H "Content-Type: application/json" \
              -H "Accept: Application/vnd.pterodactyl.v1+json" "$@"
          }
          etat() { ptero "$API/resources" | python -c 'import json, sys; print(json.load(sys.stdin)["attributes"]["current_state"])'; }
          sftp() { lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "$LFTP_REGLAGES set cmd:fail-exit yes; set xfer:clobber on; $1 bye" < /dev/null; }
          existe() { sftp "cls -d \"$1\";" > /dev/null 2>&1; }

          # le monde en service : level-name du server.properties DU PTERO, obligatoirement (le nom du dépôt peut être
          # différent : se tromper de nom poserait la carte à côté du monde que le serveur charge)
          MONDE=""
          if sftp "get /server.properties -o server_ptero_carte.properties;"; then
            MONDE=$(tr -d '\r' < server_ptero_carte.properties | sed -n 's/^level-name=//p' | head -n 1)
          fi
          case "$MONDE" in
            ""|.|..|*[!A-Za-z0-9_.-]*|mods|plugins|config|defaultconfigs|libraries|logs|tacz|heralisz_*|heraliz_*|mohist-config)
              echo "::error::Nom du monde illisible ou inattendu dans le server.properties du Ptero : « $MONDE ». Rien n'a été changé."
              exit 1;;
          esac
          DATE=$(date -u +%Y-%m-%d_%Hh%M)
          NOUVEAU="${MONDE}_nouvelle_$DATE"
          if ! sftp "cls -1 /;" > racine_brute.txt; then
            echo "::error::Les dossiers du Ptero ne se lisent pas. Rien n'a été changé."
            exit 1
          fi
          tr -d '\r' < racine_brute.txt | sed 's:/*$::; s:.*/::' > racine_ptero.txt
          echo "Monde du serveur : /$MONDE. Dossiers du Ptero : $(paste -sd ' ' racine_ptero.txt)"

          # 1. la carte à côté, serveur en marche ; une liaison coupée reprend là où elle s'est arrêtée (3 essais)
          for essai in 1 2 3; do
            if sftp "set net:timeout 120; set net:max-retries 10; set net:reconnect-interval-base 10; mirror -R -P 2 monde/HeraliZ \"/$NOUVEAU\";"; then
              break
            fi
            if [ "$essai" = 3 ]; then
              echo "::error::La carte n'a pas pu être envoyée (3 essais). Le serveur et son monde n'ont pas été touchés ; carte incomplète dans /$NOUVEAU (à supprimer depuis le panel)."
              exit 1
            fi
            echo "Envoi interrompu (essai $essai sur 3) : reprise là où il s'est arrêté."
          done
          # contrôle : chaque fichier présent avec la bonne taille (seule la ligne « mkdir -p » du dossier est attendue)
          sftp "mirror -R --dry-run --ignore-time --no-perms monde/HeraliZ \"/$NOUVEAU\";" > controle.txt 2>&1 || echo "contrôle impossible" >> controle.txt
          grep -v '^mkdir -p ' controle.txt | sed -E 's#//[^/@]*@#//#g' > ecarts.txt || true
          if [ -s ecarts.txt ] || ! grep -q '^mkdir -p ' controle.txt; then
            head -n 50 ecarts.txt
            echo "::error::Carte envoyée incomplète ($(wc -l < ecarts.txt) écarts). Le serveur et son monde n'ont pas été touchés ; carte incomplète dans /$NOUVEAU (à supprimer depuis le panel)."
            exit 1
          fi
          echo "Carte envoyée dans /$NOUVEAU et contrôlée : $(find monde/HeraliZ -type f | wc -l) fichiers."
          # réglages « serveur » des mods : ceux du monde en service, puis ceux du dépôt (ils font foi)
          if grep -Fxq "$MONDE" racine_ptero.txt && existe "/$MONDE/serverconfig"; then
            sftp "mirror \"/$MONDE/serverconfig\" ancien_serverconfig;" && sftp "mirror -R ancien_serverconfig \"/$NOUVEAU/serverconfig\";" \
              || echo "::warning::Réglages du monde en service non recopiés (Forge reprendra ceux de defaultconfigs)."
          fi
          sftp "mirror -R serveur/defaultconfigs \"/$NOUVEAU/serverconfig\";" || echo "::warning::defaultconfigs non recopié (Forge le fera au démarrage)."

          # 2. arrêt propre : le serveur sauvegarde l'ancien monde avant la bascule
          if ! E=$(etat); then
            echo "::error::L'API du Ptero ne répond pas : serveur et monde non touchés (carte prête dans /$NOUVEAU)."
            exit 1
          fi
          echo "Serveur : $E"
          if [ "$E" != "offline" ]; then
            if [ "$E" = "running" ]; then
              ptero -X POST "$API/command" -d '{"command":"say Nouvelle carte : redémarrage du serveur dans 1 minute."}' > /dev/null || true
              sleep 60
            fi
            if ! ptero -X POST "$API/power" -d '{"signal":"stop"}'; then
              echo "::error::Le panel refuse d'arrêter le serveur : monde non touché (carte prête dans /$NOUVEAU)."
              exit 1
            fi
            for _ in $(seq 90); do
              sleep 10
              E=$(etat || echo inconnu)
              [ "$E" = "offline" ] && break
            done
            if [ "$E" != "offline" ]; then
              echo "::error::Le serveur ne s'est pas arrêté en 15 minutes (état : $E) : monde non touché (carte prête dans /$NOUVEAU). Vérifier le serveur dans le panel."
              exit 1
            fi
          fi
          echo "Serveur arrêté."

          # 3. bascule : l'ancien monde (et ses dimensions à part, s'il y en a) garde ses fichiers sous un autre nom,
          #    la carte prend sa place. En cas d'échec, les anciens noms sont remis et le serveur redémarre dessus.
          DEPLACES=""
          retablir() {
            echo "::error::Échec pendant $1 : l'ancien monde est remis en place (carte laissée dans /$NOUVEAU)."
            for nom in $DEPLACES; do
              if ! sftp "mv \"/${nom}_ancien_$DATE\" \"/$nom\";"; then
                echo "::error::/${nom}_ancien_$DATE n'a pas pu reprendre le nom /$nom : serveur laissé arrêté, le renommer depuis le panel."
                return
              fi
            done
            ptero -X POST "$API/power" -d '{"signal":"start"}' || true
          }
          for nom in "$MONDE" "${MONDE}_nether" "${MONDE}_the_end"; do
            grep -Fxq "$nom" racine_ptero.txt || continue
            if ! sftp "mv \"/$nom\" \"/${nom}_ancien_$DATE\";"; then retablir "la mise de côté de /$nom"; exit 1; fi
            DEPLACES="$DEPLACES $nom"
            echo "/$nom gardé dans /${nom}_ancien_$DATE"
          done
          if existe "/$MONDE"; then retablir "la mise de côté de l'ancien monde (/$MONDE est toujours là)"; exit 1; fi
          if ! sftp "mv \"/$NOUVEAU\" \"/$MONDE\";"; then retablir "la mise en place de la carte"; exit 1; fi
          echo "La carte est maintenant /$MONDE."
          GARDE="aucun (pas de monde /$MONDE sur le Ptero)"
          case " $DEPLACES " in *" $MONDE "*) GARDE="/${MONDE}_ancien_$DATE";; esac

          # zones WorldGuard de l'ancien monde : elles restent rattachées au nom du monde, donc aux mêmes coordonnées
          ZONES=""
          if sftp "get \"/plugins/WorldGuard/worlds/$MONDE/regions.yml\" -o regions_ptero.yml;" 2> /dev/null; then
            ZONES=$(python - <<'EOF'
          import re
          zones, retrait, dedans = [], None, False
          for l in open("regions_ptero.yml", encoding="utf-8", errors="replace").read().splitlines():
              if not l.strip() or l.lstrip().startswith("#"):
                  continue
              if not dedans:
                  dedans = re.match(r"regions\s*:", l) is not None
                  continue
              r = len(l) - len(l.lstrip(" "))
              if r == 0:
                  break
              retrait = retrait or r
              m = re.match(r"([^ :#][^:]*):\s*$", l[r:]) if r == retrait else None
              if m and m.group(1).strip("'\"") != "__global__":
                  zones.append(m.group(1).strip("'\""))
          print(" ".join(zones))
          EOF
            ) || ZONES=""
            if [ -n "$ZONES" ]; then
              echo "::warning::Zones WorldGuard de l'ancienne carte toujours actives (mêmes coordonnées sur la nouvelle) : $ZONES"
            fi
          fi

          # 4. redémarrage sur la nouvelle carte
          if ! ptero -X POST "$API/power" -d '{"signal":"start"}'; then
            echo "::error::La carte est en place mais le serveur n'a pas pu être démarré : le démarrer depuis le panel."
            exit 1
          fi
          debut=$SECONDS
          E=""
          while [ $((SECONDS - debut)) -lt 900 ]; do
            sleep 15
            E=$(etat || echo inconnu)
            [ "$E" = "running" ] && break
            [ "$E" = "offline" ] && [ $((SECONDS - debut)) -gt 60 ] && break
          done
          {
            echo "### Nouvelle carte déposée sur le Ptero"
            echo "- monde du serveur : \`/$MONDE\` (carte de \`monde/HeraliZ\`, contrôlée fichier par fichier)"
            case "$GARDE" in
              /*) echo "- ancien monde gardé tel quel : \`$GARDE\` (à supprimer depuis le panel quand tout va bien)";;
              *) echo "- ancien monde : $GARDE";;
            esac
            if [ -n "$ZONES" ]; then echo "- zones WorldGuard de l'ancienne carte encore actives, aux mêmes coordonnées : $ZONES"; fi
            echo "- état du serveur après le démarrage : $E"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$E" in
            running) echo "Serveur démarré sur la nouvelle carte. Ancien monde gardé : $GARDE.";;
            offline) echo "::error::Le serveur s'est arrêté pendant son démarrage sur la nouvelle carte : voir la console du panel. Ancien monde gardé : $GARDE."
                     exit 1;;
            *) echo "::warning::Démarrage pas encore terminé après 15 minutes (état : $E) : voir la console du panel. Ancien monde gardé : $GARDE.";;
          esac

      # Monde du spawn (case « deposer_spawn ») : la grotte du spawn est déposée UNE fois dans dimensions/heralisz/spawn/
      # du monde en service. C'est monde/spawn/ du dépôt s'il existe (grotte du terminus + schematic du spawn composés par
      # le workflow « Schematic du spawn », ou grotte recopiée de l'ancienne carte par « Grotte du spawn »), sinon la grotte du terminus fabriquée par outils/monde_spawn.py grotte (toujours la même :
      # rien de tiré au hasard). Dossier
      # à part que HeraliZ Utils déclare (heralisz:spawn). Le monde de la carte n'est jamais touché : ni ses régions, ni
      # ses réglages. Refusé si ce dossier existe déjà (rien n'est jamais écrasé). Envoi dans un dossier temporaire,
      # contrôle fichier par fichier, puis renommage. Redémarrer ensuite (case « redemarrer ») pour être sûr que le
      # serveur le lit. Rendus de contrôle dans le paquet « monde-spawn » de l'exécution.
      - name: Déposer le monde du spawn
        if: github.event_name == 'workflow_dispatch' && inputs.deposer_spawn
        timeout-minutes: 20
        run: |
          if [ -z "$PTERO_SFTP_HOST" ]; then
            echo "::error::Il faut les secrets du SFTP du Ptero pour déposer le monde du spawn."
            exit 1
          fi
          python -m pip install --quiet numpy pillow
          if ls monde/spawn/region/*.mca > /dev/null 2>&1; then
            # grotte recopiée de l'ancienne carte (workflow « Grotte du spawn ») : envoyée telle quelle
            rm -rf spawn_monde && mkdir -p spawn_monde
            cp -r monde/spawn spawn_monde/spawn
            python outils/monde_spawn.py rendu spawn_monde/spawn --rendus spawn_rendus || echo "(rendus impossibles)"
            echo "Monde du spawn : monde/spawn du dépôt ($(find spawn_monde/spawn -name '*.mca' | wc -l) fichiers de régions)."
          else
            python outils/monde_spawn.py grotte --sortie spawn_monde --rendus spawn_rendus
          fi
          sftp() { lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "$LFTP_REGLAGES set cmd:fail-exit yes; set xfer:clobber off; $1 bye" < /dev/null; }
          existe() { sftp "cls -d \"$1\";" > /dev/null 2>&1; }
          # le monde en service : level-name du server.properties DU PTERO, obligatoirement
          MONDE=""
          if sftp "get /server.properties -o server_ptero_spawn.properties;"; then
            MONDE=$(tr -d '\r' < server_ptero_spawn.properties | sed -n 's/^level-name=//p' | head -n 1)
          fi
          case "$MONDE" in
            ""|.|..|*[!A-Za-z0-9_.-]*|mods|plugins|config|defaultconfigs|libraries|logs|tacz|heralisz_*|heraliz_*|mohist-config)
              echo "::error::Nom du monde illisible ou inattendu dans le server.properties du Ptero : « $MONDE ». Rien n'a été envoyé."
              exit 1;;
          esac
          if ! existe "/$MONDE/level.dat"; then
            echo "::error::/$MONDE/level.dat introuvable sur le Ptero : ce n'est pas le monde en service. Rien n'a été envoyé."
            exit 1
          fi
          CIBLE="/$MONDE/dimensions/heralisz/spawn"
          if existe "$CIBLE"; then
            N=$(sftp "find \"$CIBLE\";" 2> /dev/null | grep -c '\.mca$' || true)
            echo "::error::$CIBLE existe déjà ($N fichiers de régions) : rien n'est envoyé, rien n'est écrasé. Si c'est du vide créé par erreur (staff téléporté dans le monde du spawn avant le dépôt), supprimer ce dossier depuis le panel, serveur arrêté, puis relancer."
            exit 1
          fi
          DATE=$(date -u +%Y-%m-%d_%Hh%M)
          ENVOI="/$MONDE/dimensions/heralisz/spawn_envoi_$DATE"
          sftp "mkdir -p -f \"/$MONDE/dimensions/heralisz\"; mirror -R -P 2 spawn_monde/spawn \"$ENVOI\";"
          # contrôle : chaque fichier présent avec la bonne taille (seule la ligne « mkdir -p » du dossier est attendue)
          sftp "mirror -R --dry-run --ignore-time --no-perms spawn_monde/spawn \"$ENVOI\";" > controle_spawn.txt 2>&1 || echo "contrôle impossible" >> controle_spawn.txt
          grep -v '^mkdir -p ' controle_spawn.txt | sed -E 's#//[^/@]*@#//#g' > ecarts_spawn.txt || true
          if [ -s ecarts_spawn.txt ]; then
            head -n 30 ecarts_spawn.txt
            echo "::error::Monde du spawn envoyé incomplet : il reste dans $ENVOI (à supprimer depuis le panel). $CIBLE n'a pas été créé."
            exit 1
          fi
          if existe "$CIBLE"; then
            echo "::error::$CIBLE est apparu pendant l'envoi (quelqu'un est allé dans le monde du spawn ?) : rien n'est remplacé ; envoi laissé dans $ENVOI."
            exit 1
          fi
          sftp "mv \"$ENVOI\" \"$CIBLE\";"
          {
            echo "### Monde du spawn déposé"
            echo "- \`$CIBLE\` : $(find spawn_monde/spawn -name '*.mca' | wc -l) fichiers de régions, contrôlés"
            echo "- point de réveil, borne de départ : voir \`heraliz_spawn.json\` et les rendus du paquet « monde-spawn »"
            echo "- la carte (\`/$MONDE/region\`) n'a pas été touchée"
            echo "- à faire : redémarrer le serveur, puis en jeu \`/depart info\` (monde du spawn « prêt ») et poser les points d'arrivée (\`/depart point ajouter\`, \`/depart zone ajouter\`)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Monde du spawn déposé dans $CIBLE."

      - name: Garder les rendus du monde du spawn
        if: github.event_name == 'workflow_dispatch' && inputs.deposer_spawn && always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: monde-spawn
          path: |
            spawn_rendus/
            spawn_monde/spawn/heraliz_spawn.json
          retention-days: 7
          if-no-files-found: ignore

      # Monde des bases (case « reinitialiser_bases ») : Minecraft ne refait jamais un tronçon déjà créé ; pour que le
      # monde des bases (crac:bases) suive le nouveau terrain de CRac, son dossier <monde>/dimensions/crac/bases est mis
      # de côté (renommé bases_ancien_<date>, JAMAIS supprimé) et Minecraft en recrée un neuf au démarrage. Serveur
      # ARRÊTÉ avant (sinon il réécrirait les anciens tronçons chargés en mémoire), puis redémarré. Rien d'autre du monde
      # n'est touché : ni la carte, ni le spawn, ni data/crac_bases.dat (les données des joueurs de CRac) ni les claims.
      - name: Remettre à neuf le monde des bases
        if: github.event_name == 'workflow_dispatch' && inputs.reinitialiser_bases
        timeout-minutes: 40
        run: |
          if [ "${{ inputs.deposer_carte }}" = "true" ]; then
            echo "::warning::« reinitialiser_bases » ignoré : « deposer_carte » change déjà tout le monde (relancer seul ensuite si besoin)."
            exit 0
          fi
          if [ -z "$PTERO_SFTP_HOST" ] || [ -z "$PTERO_URL" ] || [ -z "$PTERO_SERVER_ID" ] || [ -z "$PTERO_API_KEY" ]; then
            echo "::error::Il faut les secrets du SFTP et de l'API du Ptero : le serveur doit être arrêté pour mettre le monde des bases de côté."
            exit 1
          fi
          API="${PTERO_URL%/}/api/client/servers/$PTERO_SERVER_ID"
          ptero() {
            curl -sS -f --retry 3 --retry-all-errors -H "Authorization: Bearer $PTERO_API_KEY" -H "Content-Type: application/json" \
              -H "Accept: Application/vnd.pterodactyl.v1+json" "$@"
          }
          etat() { ptero "$API/resources" | python -c 'import json, sys; print(json.load(sys.stdin)["attributes"]["current_state"])'; }
          sftp() { lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "$LFTP_REGLAGES set cmd:fail-exit yes; $1 bye" < /dev/null; }
          existe() { sftp "cls -d \"$1\";" > /dev/null 2>&1; }
          # le monde en service : level-name du server.properties DU PTERO, obligatoirement
          MONDE=""
          if sftp "get /server.properties -o server_ptero_bases.properties;"; then
            MONDE=$(tr -d '\r' < server_ptero_bases.properties | sed -n 's/^level-name=//p' | head -n 1)
          fi
          case "$MONDE" in
            ""|.|..|*[!A-Za-z0-9_.-]*|mods|plugins|config|defaultconfigs|libraries|logs|tacz|heralisz_*|heraliz_*|mohist-config)
              echo "::error::Nom du monde illisible ou inattendu dans le server.properties du Ptero : « $MONDE ». Rien n'a été changé."
              exit 1;;
          esac
          if ! existe "/$MONDE/level.dat"; then
            echo "::error::/$MONDE/level.dat introuvable sur le Ptero : ce n'est pas le monde en service. Rien n'a été changé."
            exit 1
          fi
          CIBLE="/$MONDE/dimensions/crac/bases"
          if ! existe "$CIBLE"; then
            echo "Pas de $CIBLE sur le Ptero : rien à mettre de côté (Minecraft créera le monde des bases neuf au prochain démarrage)."
            echo "### Monde des bases : rien à mettre de côté (\`$CIBLE\` absent)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          N=$(sftp "find \"$CIBLE\";" 2> /dev/null | grep -c '\.mca$' || true)
          DATE=$(date -u +%Y-%m-%d_%Hh%M)
          GARDE="/$MONDE/dimensions/crac/bases_ancien_$DATE"

          # 1. arrêt propre : le serveur enregistre tout avant
          if ! E=$(etat); then
            echo "::error::L'API du Ptero ne répond pas : rien n'a été changé."
            exit 1
          fi
          echo "Serveur : $E"
          if [ "$E" != "offline" ]; then
            if [ "$E" = "running" ]; then
              ptero -X POST "$API/command" -d '{"command":"say Monde des bases remis à neuf : redémarrage du serveur dans 1 minute."}' > /dev/null || true
              sleep 60
            fi
            if ! ptero -X POST "$API/power" -d '{"signal":"stop"}'; then
              echo "::error::Le panel refuse d'arrêter le serveur : rien n'a été changé."
              exit 1
            fi
            for _ in $(seq 90); do
              sleep 10
              E=$(etat || echo inconnu)
              [ "$E" = "offline" ] && break
            done
            if [ "$E" != "offline" ]; then
              echo "::error::Le serveur ne s'est pas arrêté en 15 minutes (état : $E) : rien n'a été changé. Vérifier le serveur dans le panel."
              exit 1
            fi
          fi
          echo "Serveur arrêté."

          # 2. mise de côté (renommage, rien n'est supprimé), puis redémarrage dans tous les cas
          RESULTAT="ok"
          if ! sftp "mv \"$CIBLE\" \"$GARDE\";" || existe "$CIBLE"; then
            RESULTAT="echec"
            echo "::error::$CIBLE n'a pas pu être renommé : le monde des bases est inchangé. Le serveur redémarre quand même."
          fi
          ptero -X POST "$API/power" -d '{"signal":"start"}' || echo "::error::Le serveur n'a pas pu être démarré : le démarrer depuis le panel."
          debut=$SECONDS
          E=""
          while [ $((SECONDS - debut)) -lt 900 ]; do
            sleep 15
            E=$(etat || echo inconnu)
            [ "$E" = "running" ] && break
            [ "$E" = "offline" ] && [ $((SECONDS - debut)) -gt 60 ] && break
          done
          {
            echo "### Monde des bases remis à neuf"
            if [ "$RESULTAT" = "ok" ]; then
              echo "- ancien monde des bases gardé tel quel : \`$GARDE\` ($N fichiers de régions ; à supprimer depuis le panel quand tout va bien)"
              echo "- Minecraft crée un monde des bases neuf, avec le terrain de CETTE version de CRac, au fil des visites"
              echo "- **perdu** (partis avec le dossier) : tout ce qui était construit dans le monde des bases (bases, Claim Blocks, coffres), les claims et les carrières déclarées (à recréer : \`/carriere creer\`)"
              echo "- **gardé** : \`data/crac_bases.dat\` du monde principal (étape du tutoriel, dernier /home, protections de base) et les groupes : un joueur qui avait fini le tutoriel ne reçoit pas de nouveau kit (\`/tuto rejouer <joueur>\`) ; \`/home\` l'envoie au hasard tant qu'il n'a pas reposé de base"
              echo "- un joueur déconnecté DANS le monde des bases revient à la même position, sur le terrain neuf (dans le sol ou hors de la bordure de 2 500 blocs possible) : le ramener au spawn"
            else
              echo "- **échec** du renommage de \`$CIBLE\` : monde des bases inchangé"
            fi
            echo "- la carte et le monde du spawn n'ont pas été touchés"
            echo "- état du serveur après le démarrage : $E"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$RESULTAT" = "ok" ] || exit 1
          [ "$E" = "running" ] || { echo "::warning::Serveur pas encore « running » (état : $E) : voir la console du panel."; }

      - name: Redémarrer le serveur
        if: env.PTERO_API_KEY != '' && github.event_name == 'workflow_dispatch' && inputs.redemarrer && !inputs.deposer_carte && !inputs.reinitialiser_bases
        # arrêt, réglages du monde recopiés serveur ÉTEINT (sinon le serveur réécrit ses anciens réglages en
        # s'arrêtant, et le monde gardait par exemple les anciens coûts de CRac), puis démarrage
        run: |
          api() { curl -sS -f -X "$1" "$PTERO_URL/api/client/servers/$PTERO_SERVER_ID/$2" \
            -H "Authorization: Bearer $PTERO_API_KEY" -H "Content-Type: application/json" \
            -H "Accept: Application/vnd.pterodactyl.v1+json" ${3:+-d "$3"}; }
          api POST power '{"signal":"stop"}'
          for i in $(seq 1 60); do
            sleep 5
            ETAT=$(api GET resources | python3 -c 'import json,sys; print(json.load(sys.stdin)["attributes"]["current_state"])' || echo "?")
            [ "$ETAT" = "offline" ] && break
          done
          echo "état du serveur : $ETAT"
          if [ "$ETAT" = "offline" ] && [ -n "${MONDE:-}" ]; then
            lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "
              $LFTP_REGLAGES
              mkdir -p -f /$MONDE/serverconfig;
              mput -O /$MONDE/serverconfig serveur/defaultconfigs/*;
              bye" < /dev/null && echo "réglages du monde recopiés serveur arrêté"
          else
            echo "::warning::serveur pas arrêté à temps (ou monde inconnu) : réglages du monde non recopiés"
          fi
          api POST power '{"signal":"start"}'

      # Pack du launcher (voir CLAUDE.md, section 8) : les jars joueurs de CETTE fabrication (ceux qui viennent d'aller
      # sur le Ptero : Spartan compare leurs empreintes) et le dossier tacz, mis en forme par Nebula (le générateur de
      # Helios, version figée), puis déposés sur la VM du site, là où le launcher les cherche (distributionUrl de
      # launcher/app/heraliz.json). Dernière étape : un échec ici ne retient ni la mise à jour du Ptero ni son redémarrage.
      - uses: actions/setup-node@v4
        if: env.SITE_PRET == 'true' && env.PTERO_SFTP_HOST != ''
        with:
          node-version: "22"

      - name: Pack du launcher (heraliz.fr/launcher)
        if: env.SITE_PRET == 'true' && env.PTERO_SFTP_HOST != ''
        timeout-minutes: 45
        env:
          NEBULA: 7ffc978727b95e03ae9d125688cf5cf132b78419
          # signature du pack (launcher/docs/HERALIZ-SIGNATURE.md) : clé privée, jamais sur la VM du site
          LAUNCHER_SIGN_KEY: ${{ secrets.LAUNCHER_SIGN_KEY }}
          SITE_SSH_HOTE: ${{ secrets.SITE_SSH_HOTE }}
          SITE_SSH_PORT: ${{ secrets.SITE_SSH_PORT }}
          SITE_SSH_UTILISATEUR: ${{ secrets.SITE_SSH_UTILISATEUR }}
          SITE_SSH_MDP: ${{ secrets.SITE_SSH_MDP }}
        run: |
          git init -q nebula
          git -C nebula fetch -q --depth 1 https://github.com/dscalzi/Nebula.git "$NEBULA"
          git -C nebula checkout -q FETCH_HEAD
          # Nebula et ses paquets npm (code d'autres auteurs) ne voient aucun secret (outils/sans_secrets.py)
          if ! (cd nebula && python ../outils/sans_secrets.py npm ci --no-audit --no-fund && python ../outils/sans_secrets.py npm run build) > nebula.log 2>&1; then tail -n 60 nebula.log; exit 1; fi
          # (Nebula affiche toute la distribution : seules les lignes de l'outil sont gardées, sauf en cas d'échec)
          if ! python outils/pack_launcher.py nebula pack --version "1.0.$GITHUB_RUN_NUMBER" > pack.log 2>&1; then tail -n 80 pack.log; exit 1; fi
          grep '^\[pack\]' pack.log

          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync > /dev/null
          export SSHPASS="$SITE_SSH_MDP"
          SSH=(ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15 -o PubkeyAuthentication=no -p "${SITE_SSH_PORT:-22}")
          VM="$SITE_SSH_UTILISATEUR@$SITE_SSH_HOTE"
          DOSSIER=/var/www/launcher
          if ! sshpass -e "${SSH[@]}" "$VM" true < /dev/null; then
            echo "::error::Connexion à la VM du site impossible : vérifier les secrets SITE_SSH_* (le workflow « Site HeraliZ », choix « verifier », aide à trouver)."
            exit 1
          fi
          if ! sshpass -e "${SSH[@]}" "$VM" "command -v rsync > /dev/null && [ -w $DOSSIER ]" < /dev/null; then
            echo "::error::La VM du site n'est pas prête pour le pack (rsync ou dossier $DOSSIER) : lancer le workflow « Site HeraliZ » avec « installer », puis relancer cette mise en ligne."
            exit 1
          fi
          # 1. fichiers nouveaux ou changés, mis en place tous ensemble à la fin ; 2. distribution.json et sa signature
          # (distribution.sig), ensemble ; 3. retrait des anciens fichiers : un joueur qui lance le launcher pendant
          # l'envoi ne tombe jamais sur un fichier manquant
          RS=(rsync -r --perms --checksum --chmod=D755 --chmod=F644 -e "sshpass -e ${SSH[*]}")
          "${RS[@]}" --delay-updates --exclude=/distribution.json --exclude=/distribution.sig pack/envoi/ "$VM:$DOSSIER/"
          DISTRO=(pack/envoi/distribution.json)
          [ -f pack/envoi/distribution.sig ] && DISTRO+=(pack/envoi/distribution.sig)
          "${RS[@]}" --delay-updates "${DISTRO[@]}" "$VM:$DOSSIER/"
          "${RS[@]}" --delete pack/envoi/ "$VM:$DOSSIER/"

          # clé du pack (site/vm/theme.sh) : le pack réservé aux comptes ne s'ouvre qu'avec un lien signé par le site ;
          # la vérification signe ses liens comme le site le fait pour un compte connecté
          CLE_PACK=/var/www/azuriom/storage/app/heraliz/pack.cle
          if [ "$SITE_SSH_UTILISATEUR" = root ]; then
            cle=$(sshpass -e "${SSH[@]}" "$VM" "cat $CLE_PACK 2> /dev/null" < /dev/null || true)
          else
            cle=$(printf '%s\n' "$SITE_SSH_MDP" | sshpass -e "${SSH[@]}" "$VM" "sudo -S -p '' cat $CLE_PACK 2> /dev/null" || true)
          fi
          cle=$(printf '%s' "$cle" | tr -d '\r\n')
          if [ "${#cle}" -ge 32 ]; then
            echo "::add-mask::$cle"
            (umask 077 && printf '%s' "$cle" > "$RUNNER_TEMP/pack.cle")
          fi
          unset cle

          # vu d'internet : la distribution servie est celle envoyée, et quelques fichiers ont la bonne taille
          python - <<'EOF'
          import base64, hashlib, json, os, pathlib, sys, time, urllib.error, urllib.parse, urllib.request
          envoi = json.load(open("pack/envoi/distribution.json", encoding="utf-8"))
          r = json.load(open("pack/resume.json", encoding="utf-8"))
          base = r["distribution"].rsplit("/", 1)[0] + "/"
          fichier_cle = pathlib.Path(os.environ["RUNNER_TEMP"], "pack.cle")
          cle = fichier_cle.read_text(encoding="utf-8").strip() if fichier_cle.exists() else ""
          def signer(url):
              # même calcul que le site (PackController) et nginx (secure_link) : MD5 de « <expiration><chemin> <clé> »
              morceaux = urllib.parse.urlsplit(url)
              if not cle or not morceaux.path.startswith("/launcher/") or morceaux.query:
                  return url
              e = int(time.time()) + 600
              h = hashlib.md5(str(e).encode() + urllib.parse.unquote_to_bytes(morceaux.path) + b" " + cle.encode()).digest()
              return f"{url}?e={e}&s=" + base64.urlsafe_b64encode(h).decode().rstrip("=")
          def ouvrir(url, methode="GET"):
              return urllib.request.urlopen(urllib.request.Request(url, method=methode, headers={"Cache-Control": "no-cache"}), timeout=60)
          def echec(message):
              print("::error::" + message)
              sys.exit(1)
          # pack réservé aux comptes : sans lien signé, même la distribution est refusée (403)
          try:
              with ouvrir(r["distribution"], "HEAD") as rep:
                  libre = rep.status
          except urllib.error.HTTPError as e:
              libre = e.code
          except Exception as e:
              echec(f"{r['distribution']} injoignable ({e}).")
          reserve = libre == 403
          if reserve and not cle:
              print("::warning::Pack du launcher réservé aux comptes, mais sa clé n'a pas pu être lue sur le site : pack envoyé, non vérifié depuis internet.")
              sys.exit(0)
          try:
              with ouvrir(signer(r["distribution"])) as rep:
                  servie = json.loads(rep.read())
          except Exception as e:
              echec(f"{r['distribution']} illisible ({e}) : lancer le workflow « Site HeraliZ » avec « installer » (accès /launcher/ du site).")
          if servie != envoi:
              echec(f"{r['distribution']} ne donne pas le pack envoyé.")
          # signature du pack : celle envoyée doit être en ligne à côté (le site la joint au pack de chaque compte)
          sig_locale = pathlib.Path("pack/envoi/distribution.sig")
          signe = sig_locale.is_file()
          if signe:
              url_sig = base + "distribution.sig"
              try:
                  with ouvrir(signer(url_sig)) as rep:
                      sig_servie = rep.read().decode().strip()
              except Exception as e:
                  echec(f"{url_sig} illisible ({e}) : les launchers refuseraient le pack.")
              if sig_servie != sig_locale.read_text(encoding="utf-8").strip():
                  echec(f"{url_sig} ne donne pas la signature envoyée : les launchers refuseraient le pack.")
          mods = [m for s in envoi["servers"] for m in s["modules"]]
          fichiers = [m for m in mods if m["type"] == "File"]
          choix = [m for m in mods if m["type"] in ("ForgeHosted", "ForgeMod")][:2] + fichiers[:1] + fichiers[len(fichiers) // 2:][:1] + fichiers[-1:]
          for m in choix:
              a = m["artifact"]
              if not a["url"].startswith(base):
                  continue
              try:
                  with ouvrir(signer(a["url"]), "HEAD") as rep:
                      taille = rep.headers.get("Content-Length")
              except Exception as e:
                  echec(f"{a['url']} illisible ({e}).")
              if taille != str(a["size"]):
                  echec(f"{a['url']} : taille {taille} au lieu de {a['size']}.")
          acces = "réservé aux comptes HeraliZ (liens signés par le site)" if reserve else "ouvert à tous (verrou posé par « Site HeraliZ », choix « theme », une fois le launcher 1.7.0 publié)"
          print(f"Pack du launcher en ligne : {r['distribution']} ({r['mods']} mods, {r['fichiers']} fichiers, {r['octets'] / 1048576:.0f} Mo) ; {acces}.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Pack du launcher\n"
                      f"- {r['mods']} mods joueurs, {r['fichiers']} fichiers, {r['octets'] / 1048576:.0f} Mo (version {r['version']})\n"
                      f"- en ligne : {r['distribution']}, {acces}\n"
                      + ("- ✅ pack **signé** (distribution.sig) : un mod ajouté ou remplacé sur le site serait refusé par le launcher\n" if signe
                         else "- ⚠️ pack **NON signé** (secret `LAUNCHER_SIGN_KEY` absent)\n"))
          EOF
          rm -f "$RUNNER_TEMP/pack.cle"
