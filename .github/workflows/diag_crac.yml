# Diagnostic en LECTURE SEULE (20/10) : réglages de CRac vraiment lus par le serveur, jars de CRac et de Quêtes en place,
# lignes du journal du serveur sur CRac. Rien n'est envoyé ni changé sur le Ptero.
name: Diagnostic CRac
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [.github/workflows/diag_crac.yml]
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      PTERO_SFTP_HOST: ${{ secrets.PTERO_SFTP_HOST }}
      PTERO_SFTP_PORT: ${{ secrets.PTERO_SFTP_PORT }}
      PTERO_SFTP_USER: ${{ secrets.PTERO_SFTP_USER }}
      PTERO_SFTP_PASSWORD: ${{ secrets.PTERO_SFTP_PASSWORD }}
    steps:
      - name: Lire le Ptero
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          HOTE="${PTERO_SFTP_HOST#sftp://}"; HOTE="${HOTE%%/*}"; PORT="${PTERO_SFTP_PORT:-}"
          case "$HOTE" in *:*) [ -z "$PORT" ] && PORT="${HOTE##*:}"; HOTE="${HOTE%%:*}";; esac
          PORT="${PORT:-2022}"; echo "::add-mask::$HOTE"
          L="set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30; set xfer:clobber on;"
          lf() { lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PORT" "sftp://$HOTE" -e "$L $1; bye" < /dev/null; }
          lf "get /server.properties -o sp.txt" || true
          MONDE=$(tr -d '\r' < sp.txt | sed -n 's/^level-name=//p' | head -n1); echo "monde : $MONDE"
          echo "=== jars"; lf "cls -l /mods/" | grep -i -E "crac|quetes|composants" || true
          echo "=== serverconfig du monde"; lf "cls -l /$MONDE/serverconfig/" | grep -i crac || true
          lf "get /$MONDE/serverconfig/crac-building.toml -o monde.toml" || echo "pas de fichier dans le monde"
          lf "get /defaultconfigs/crac-building.toml -o defaut.toml" || echo "pas de fichier defaultconfigs"
          lf "get /$MONDE/serverconfig/crac-server.toml -o monde_srv.toml" || true
          for f in monde.toml defaut.toml; do echo "=== $f"; [ -f $f ] && grep -n -E "stick|planks|cobble|iron|brindilles|planches|clou|wood =|stone =|metal =|armored =|twig =" $f; done
          echo "=== crac-server (entretien)"; [ -f monde_srv.toml ] && grep -n -E "item(Wood|Stone|Metal|Armored)|perPiece|upgradeItem" monde_srv.toml
          echo "=== journal"; lf "get /logs/latest.log -o latest.log" || true
          [ -f latest.log ] && grep -i -E "crac|crac-building|correct|config" latest.log | head -60
