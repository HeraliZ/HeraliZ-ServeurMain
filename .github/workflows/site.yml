# Site HeraliZ (Azuriom) sur sa VM, à part du Ptero (voir CLAUDE.md, section 8 bis). « Run workflow » :
# - verifier : regarde la VM et les adresses heraliz.fr sans rien changer ;
# - installer : installe ou met à jour nginx, PHP, MariaDB, l'installeur d'Azuriom, le HTTPS et les tâches planifiées
#   (site/vm/installer.sh) ;
# - theme : met le site aux couleurs HeraliZ (site/theme/heraliz), installe la Boutique et les Votes d'Azuriom et fait
#   les réglages de départ une seule fois (site/vm/theme.sh, site/vm/reglages.php). Lancé tout seul à chaque envoi sur
#   main qui touche le thème.
# Les accès sont dans les secrets SITE_* : jamais dans un fichier.
name: Site HeraliZ

on:
  push:
    branches: [main]
    paths:
      - "site/theme/**"
      - "site/vm/theme.sh"
      - "site/vm/reglages.php"
  workflow_dispatch:
    inputs:
      action:
        description: "verifier : regarder la VM sans rien changer ; installer : installer ou mettre à jour le serveur web ; theme : mettre le site HeraliZ à jour (thème, boutique, votes)"
        type: choice
        options: [verifier, installer, theme]
        default: verifier

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SITE_SSH_HOTE: ${{ secrets.SITE_SSH_HOTE }}
      SITE_SSH_PORT: ${{ secrets.SITE_SSH_PORT }}
      SITE_SSH_UTILISATEUR: ${{ secrets.SITE_SSH_UTILISATEUR }}
      SITE_SSH_MDP: ${{ secrets.SITE_SSH_MDP }}
      SITE_BDD_MDP: ${{ secrets.SITE_BDD_MDP }}
      ACTION: ${{ inputs.action || 'theme' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets du site
        run: |
          requis="SITE_SSH_HOTE SITE_SSH_UTILISATEUR SITE_SSH_MDP"
          [ "$ACTION" = installer ] && requis="$requis SITE_BDD_MDP"
          manque=""
          for s in $requis; do
            if [ -n "${!s}" ]; then echo "$s : présent"; else echo "$s : MANQUANT"; manque="$manque $s"; fi
          done
          if [ -n "$SITE_SSH_PORT" ]; then echo "SITE_SSH_PORT : présent"; else echo "SITE_SSH_PORT : absent (port 22)"; fi
          if [ -n "$manque" ]; then
            echo "::error::Secrets manquants :$manque (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "SSH_PORT=${SITE_SSH_PORT:-22}" >> "$GITHUB_ENV"
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass dnsutils > /dev/null

      # adresses vues d'internet : quels noms mènent à la VM (HTTPS seulement pour ceux-là) ; aucune IP affichée
      - name: Adresses heraliz.fr
        run: |
          IP_VM=$(getent ahostsv4 "$SITE_SSH_HOTE" | awk 'NR == 1 {print $1}')
          if [ -z "$IP_VM" ]; then echo "::warning::L'adresse de SITE_SSH_HOTE ne se résout pas : comparaison des noms impossible."; fi
          DOMAINES=""
          for d in heraliz.fr www.heraliz.fr play.heraliz.fr; do
            ips=$(dig +short A "$d" | grep -E '^[0-9.]+$' || true)
            if [ -z "$ips" ]; then echo "$d : aucune adresse"
            elif [ -n "$IP_VM" ] && grep -Fxq "$IP_VM" <<< "$ips"; then
              echo "$d : mène à la VM du site"
              [ "$d" != play.heraliz.fr ] && DOMAINES="$DOMAINES $d"
            else echo "$d : mène à une autre machine"
            fi
          done
          for n in _minecraft._tcp.play.heraliz.fr _minecraft._tcp.heraliz.fr; do
            srv=$(dig +short SRV "$n" | awk '{print $4 " port " $3}' | paste -sd ',' -)
            echo "$n : ${srv:-aucun renvoi (SRV)}"
          done
          if [ -n "$DOMAINES" ]; then HTTPS=oui; else HTTPS=non; DOMAINES=" heraliz.fr www.heraliz.fr"; fi
          echo "DOMAINES=${DOMAINES# }" >> "$GITHUB_ENV"
          echo "HTTPS=$HTTPS" >> "$GITHUB_ENV"

      - name: Connexion à la VM
        run: |
          export SSHPASS="$SITE_SSH_MDP"
          if ! sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o PubkeyAuthentication=no \
              -p "$SSH_PORT" "$SITE_SSH_UTILISATEUR@$SITE_SSH_HOTE" true < /dev/null; then
            echo "::error::Connexion à la VM impossible : vérifier SITE_SSH_HOTE, SITE_SSH_UTILISATEUR, SITE_SSH_MDP (et SITE_SSH_PORT), et que la VM accepte la connexion par mot de passe."
            exit 1
          fi
          echo "Connexion à la VM : OK"

      # installeur officiel d'Azuriom : dernière version publiée ; pour « verifier », son contenu et la doc d'installation
      - name: Azuriom
        if: env.ACTION != 'theme'
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/Azuriom/AzuriomInstaller/releases/latest -o installeur.json || true
          # le bon fichier est « AzuriomInstaller.zip » (« -old » est l'ancien installeur, pour les vieilles versions de PHP)
          URL=$(python - <<'EOF' || true
          import json
          zips = [a for a in json.load(open("installeur.json"))["assets"] if a["name"].endswith(".zip")]
          print("fichiers de la version :", ", ".join(a["name"] for a in zips), file=__import__("sys").stderr)
          bons = [a for a in zips if a["name"] == "AzuriomInstaller.zip"] or [a for a in zips if "old" not in a["name"].lower()]
          print(bons[0]["browser_download_url"])
          EOF
          )
          URL=${URL:-https://github.com/Azuriom/AzuriomInstaller/releases/latest/download/AzuriomInstaller.zip}
          echo "Installeur d'Azuriom : $URL"
          echo "URL_INSTALLEUR=$URL" >> "$GITHUB_ENV"
          if [ "$ACTION" = verifier ]; then
            if curl -fsSL -o installeur.zip "$URL"; then unzip -l installeur.zip | head -n 40; else echo "::warning::Installeur introuvable à cette adresse."; fi
            if curl -fsSL -o doc.html https://azuriom.com/en/docs/installation; then
              python - <<'EOF'
          import html, re
          t = open("doc.html", encoding="utf-8", errors="replace").read()
          t = re.sub(r"(?s)<(script|style|nav|header|footer)\b.*?</\1>", " ", t)
          t = re.sub(r"<(br|/p|/li|/h\d|/pre|/tr)[^>]*>", "\n", t)
          t = html.unescape(re.sub(r"<[^>]+>", "", t))
          lignes = [l.strip() for l in t.splitlines() if l.strip()]
          print("\n".join("doc | " + l for l in lignes[:400]))
          EOF
            else
              echo "::warning::Documentation d'Azuriom injoignable."
            fi
          fi

      # thème, réglages et images des premières actualités (celles du launcher), envoyés en une archive
      - name: Thème du site
        if: env.ACTION == 'theme'
        run: |
          mkdir -p envoi/vm envoi/contenu/actus
          cp -r site/theme envoi/theme
          cp site/vm/reglages.php envoi/vm/
          cp launcher/app/assets/images/nouveautes/*.jpg envoi/contenu/actus/
          tar -czf theme.tgz -C envoi .
          echo "Archive du thème : $(du -h theme.tgz | cut -f1), $(find envoi -type f | wc -l) fichiers"
          export SSHPASS="$SITE_SSH_MDP"
          ARCHIVE="/tmp/heraliz_theme_$GITHUB_RUN_ID.tgz"
          sshpass -e scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o PubkeyAuthentication=no -P "$SSH_PORT" \
            theme.tgz "$SITE_SSH_UTILISATEUR@$SITE_SSH_HOTE:$ARCHIVE" < /dev/null
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Sur la VM
        run: |
          umask 077
          {
            echo "exec < /dev/null"
            if [ "$ACTION" = installer ]; then
              printf 'BDD_MDP=%q\nDOMAINES=%q\nHTTPS=%q\nURL_INSTALLEUR=%q\n' "$SITE_BDD_MDP" "$DOMAINES" "$HTTPS" "$URL_INSTALLEUR"
            fi
            if [ "$ACTION" = theme ]; then
              printf 'ARCHIVE=%q\n' "$ARCHIVE"
            fi
            cat "site/vm/$ACTION.sh"
          } > script_vm.sh
          export SSHPASS="$SITE_SSH_MDP"
          OPTS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15 -o PubkeyAuthentication=no)
          DISTANT="/tmp/heraliz_site_$GITHUB_RUN_ID.sh"
          sshpass -e scp "${OPTS[@]}" -P "$SSH_PORT" script_vm.sh "$SITE_SSH_UTILISATEUR@$SITE_SSH_HOTE:$DISTANT" < /dev/null
          rm -f script_vm.sh
          # en root (sudo si l'utilisateur n'est pas root : son mot de passe passe par l'entrée, jamais en clair dans une commande)
          if [ "$SITE_SSH_UTILISATEUR" = root ] || [ "$ACTION" = verifier ]; then
            sshpass -e ssh "${OPTS[@]}" -p "$SSH_PORT" "$SITE_SSH_UTILISATEUR@$SITE_SSH_HOTE" \
              "bash $DISTANT; r=\$?; rm -f $DISTANT; exit \$r" < /dev/null
          else
            printf '%s\n' "$SITE_SSH_MDP" | sshpass -e ssh "${OPTS[@]}" -p "$SSH_PORT" "$SITE_SSH_UTILISATEUR@$SITE_SSH_HOTE" \
              "sudo -S -p '' bash $DISTANT; r=\$?; rm -f $DISTANT; exit \$r"
          fi

      - name: Résumé du site
        if: success() && env.ACTION == 'theme'
        run: |
          {
            echo "### Site HeraliZ mis à jour"
            echo "- thème HeraliZ actif sur **https://heraliz.fr**, avec la Boutique et les Votes d'Azuriom"
            echo "- réglages de départ (menu, Règlement, grades, premières actualités) faits une seule fois : ensuite l'administration du site fait foi"
            echo "- reste à faire dans l'administration : moyens de paiement (Boutique → Paiements), articles et prix, sites de vote"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Résumé
        if: success() && env.ACTION == 'installer'
        run: |
          {
            echo "### Site HeraliZ installé sur la VM"
            if [ "$HTTPS" = oui ]; then echo "- ouvrir **https://${DOMAINES%% *}** pour terminer l'installation d'Azuriom"
            else echo "- HTTPS pas encore possible (heraliz.fr ne mène pas à la VM) : relancer « installer » une fois le DNS à jour"; fi
            echo "- base de données : hôte \`127.0.0.1\`, port \`3306\`, base \`azuriom\`, utilisateur \`azuriom\`, mot de passe = le secret \`SITE_BDD_MDP\`"
            echo "- jeu : Minecraft Java ; compte administrateur : celui que tu choisis"
          } >> "$GITHUB_STEP_SUMMARY"
