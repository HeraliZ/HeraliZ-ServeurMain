# Envoyer un lot de commandes à la console du serveur (17/11 : drapeaux des villes et zones d'extraction de la carte en
# île, points de quête de l'ancienne carte). Ne part QUE par « Run workflow » : aucun envoi, aucune heure, aucun autre
# workflow ne le lance.
# Un lot = un fichier du dépôt, serveur/commandes/<lot>.txt (une commande par ligne) : on choisit son nom, jamais les
# commandes elles-mêmes dans le formulaire. Seules les commandes de jeu et de nos mods sont permises (outils/commandes_serveur.py).
# Par défaut : ESSAI À BLANC (le lot est lu et montré, rien n'est envoyé). Vraie exécution : case « executer » cochée ET
# phrase « ENVOYER LES COMMANDES » tapée exactement, depuis main, serveur en marche. Le résumé recopie les réponses du
# serveur (adresses IP masquées).
name: Commandes du serveur

on:
  workflow_dispatch:
    inputs:
      lot:
        description: "Nom du lot : fichier serveur/commandes/<lot>.txt du dépôt (sans .txt)"
        type: string
        default: ""
      executer:
        description: "VRAIE exécution (sinon essai à blanc : rien n'est envoyé). Il faut AUSSI taper la phrase ci-dessous."
        type: boolean
        default: false
      confirmation:
        description: "Phrase à taper pour la vraie exécution : ENVOYER LES COMMANDES"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: serveur-commandes
  cancel-in-progress: false

jobs:
  commandes:
    runs-on: ubuntu-latest
    # Secrets de mise en ligne : environnement GitHub « production », réservé à main (docs/MISE_EN_LIGNE_GITHUB.md, section 7)
    environment: production
    timeout-minutes: 30
    env:
      PTERO_SFTP_HOST: ${{ secrets.PTERO_SFTP_HOST }}
      PTERO_SFTP_PORT: ${{ secrets.PTERO_SFTP_PORT }}
      PTERO_SFTP_USER: ${{ secrets.PTERO_SFTP_USER }}
      PTERO_SFTP_PASSWORD: ${{ secrets.PTERO_SFTP_PASSWORD }}
      PTERO_URL: ${{ secrets.PTERO_URL }}
      PTERO_SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
      PTERO_API_KEY: ${{ secrets.PTERO_API_KEY }}
      PTERO_SFTP_EMPREINTE: ${{ vars.PTERO_SFTP_EMPREINTE || secrets.PTERO_SFTP_EMPREINTE }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Outils SFTP
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          HOTE="${PTERO_SFTP_HOST#sftp://}"
          HOTE="${HOTE%%/*}"
          PORT="${PTERO_SFTP_PORT:-}"
          case "$HOTE" in *:*) [ -z "$PORT" ] && PORT="${HOTE##*:}"; HOTE="${HOTE%%:*}";; esac
          PORT="${PORT:-2022}"
          echo "::add-mask::$HOTE"
          if bash outils/hote_connu.sh "$HOTE" "$PORT" "$RUNNER_TEMP/hotes_ptero" PTERO_SFTP_EMPREINTE <<< "${PTERO_SFTP_EMPREINTE:-}"; then
            echo "LFTP_SSH=set sftp:connect-program $RUNNER_TEMP/hotes_ptero.ssh;" >> "$GITHUB_ENV"
            echo "SFTP du Ptero : machine vérifiée par son empreinte."
          else
            echo "LFTP_SSH=set sftp:auto-confirm yes;" >> "$GITHUB_ENV"
            echo "::warning::SFTP du Ptero : machine non vérifiée (variable PTERO_SFTP_EMPREINTE absente)."
          fi

      # les choix passent par l'environnement (jamais collés dans le script) ; le programme refuse la vraie exécution
      # sans la case ET la phrase exacte, ou hors de main
      - name: Envoyer le lot (essai à blanc par défaut)
        env:
          LOT: ${{ inputs.lot }}
          EXECUTER: ${{ inputs.executer }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: python outils/commandes_serveur.py
