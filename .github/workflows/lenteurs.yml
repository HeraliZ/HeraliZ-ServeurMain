# Lenteurs du serveur : LECTURE SEULE. Rapatrie dans le journal de cette tâche ce qu'il faut pour trouver les montées de
# ms : les rapports du diagnostic du noyau (dossier diag/ à la racine du serveur : profils façon spark, un rapport par
# blocage, avec le mod, le fichier et la ligne en cause), les lignes « Can't keep up » et ce qui les précède dans les
# journaux, les rapports de plantage et quelques réglages qui jouent sur les perfs. Noms des
# méthodes de Minecraft et chemins de nos fichiers rendus lisibles (outils/diag_noms.py). Adresses IP et pseudos masqués, rien n'est
# écrit, renommé ni supprimé sur le Ptero (jamais « get -E », qui efface le fichier lu).
# Case « profil » (jamais cochée par défaut) : AVANT de lire, lance « diag profil <secondes> <intervalle> » par la console
# du panel (API client Pterodactyl, comme le redémarrage de serveur.yml), attend la fin du profil et son rapport ; c'est la
# seule action possible sur le serveur, et seulement quand on la demande. Part d'une branche de travail quand ce fichier
# ou l'outil change (sans profil), ou par « Run workflow ».
name: Lenteurs du serveur

on:
  workflow_dispatch:
    inputs:
      profil:
        description: "Lancer d'abord un profil du serveur (/diag profil, par la console du panel ; serveur démarré)"
        type: boolean
        default: false
      secondes:
        description: "Durée du profil en secondes (10 à 600)"
        type: number
        default: 60
      intervalle:
        description: "Relevé de la pile toutes les … ms (4 à 10 ; 5 conseillé)"
        type: number
        default: 5
  push:
    branches-ignore: [main]
    paths: [".github/workflows/lenteurs.yml", "outils/diag_noms.py"]

permissions:
  contents: read

jobs:
  lenteurs:
    runs-on: ubuntu-latest
    # Depuis main : environnement « production » ; depuis une branche de travail : environnement « lecture », qui
    # n'a qu'un accès en lecture au Ptero (sous-utilisateur sans écriture ni console ; docs/MISE_EN_LIGNE_GITHUB.md,
    # section 7). Sans environnement réglé, GitHub les crée vides et les secrets du dépôt servent comme avant.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'lecture' }}
    timeout-minutes: 40
    env:
      PTERO_SFTP_HOST: ${{ secrets.PTERO_SFTP_HOST }}
      PTERO_SFTP_PORT: ${{ secrets.PTERO_SFTP_PORT }}
      PTERO_SFTP_USER: ${{ secrets.PTERO_SFTP_USER }}
      PTERO_SFTP_PASSWORD: ${{ secrets.PTERO_SFTP_PASSWORD }}
      PTERO_SFTP_EMPREINTE: ${{ vars.PTERO_SFTP_EMPREINTE || secrets.PTERO_SFTP_EMPREINTE }}
      PYTHONIOENCODING: utf-8
    steps:
      # seulement l'outil des noms et nos sources Java (pour donner le vrai chemin de chaque fichier dans les rapports)
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            outils/diag_noms.py
            outils/hote_connu.sh
            outils/chemins.py
            outils/sans_secrets.py
            outils/pseudos_a_masquer.py
            modules/*/src/*/java/
          sparse-checkout-cone-mode: false

      - name: Accès au Ptero
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          HOTE="${PTERO_SFTP_HOST#sftp://}"
          HOTE="${HOTE%%/*}"
          PORT="${PTERO_SFTP_PORT:-}"
          case "$HOTE" in *:*) [ -z "$PORT" ] && PORT="${HOTE##*:}"; HOTE="${HOTE%%:*}";; esac
          PORT="${PORT:-2022}"
          echo "::add-mask::$HOTE"
          echo "PTERO_HOTE=$HOTE" >> "$GITHUB_ENV"
          echo "PTERO_PORT=$PORT" >> "$GITHUB_ENV"
          if bash outils/hote_connu.sh "$HOTE" "$PORT" "$RUNNER_TEMP/hotes_ptero" PTERO_SFTP_EMPREINTE <<< "${PTERO_SFTP_EMPREINTE:-}"; then
            echo "LFTP_SSH=set sftp:connect-program $RUNNER_TEMP/hotes_ptero.ssh;" >> "$GITHUB_ENV"
            echo "SFTP du Ptero : machine vérifiée par son empreinte."
          else
            echo "LFTP_SSH=set sftp:auto-confirm yes;" >> "$GITHUB_ENV"
            echo "::warning::SFTP du Ptero : machine non vérifiée (variable PTERO_SFTP_EMPREINTE absente : voir le résumé)."
          fi

      # Profil : seulement si la case est cochée (« Run workflow »), jamais à l'envoi d'une branche
      - name: Profil du serveur (console du panel)
        if: github.event_name == 'workflow_dispatch' && inputs.profil
        env:
          PTERO_URL: ${{ secrets.PTERO_URL }}
          PTERO_SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
          PTERO_API_KEY: ${{ secrets.PTERO_API_KEY }}
          SECONDES: ${{ inputs.secondes }}
          INTERVALLE: ${{ inputs.intervalle }}
        run: |
          if [ -z "$PTERO_URL" ] || [ -z "$PTERO_SERVER_ID" ] || [ -z "$PTERO_API_KEY" ]; then
            echo "::warning::Secrets de l'API du panel absents : pas de profil, seulement les rapports déjà là."
            exit 0
          fi
          S=$(printf '%s' "$SECONDES" | tr -cd '0-9'); S=${S:-60}; [ "$S" -lt 10 ] && S=10; [ "$S" -gt 600 ] && S=600
          I=$(printf '%s' "$INTERVALLE" | tr -cd '0-9'); I=${I:-5}; [ "$I" -lt 4 ] && I=4; [ "$I" -gt 10 ] && I=10
          API="${PTERO_URL%/}/api/client/servers/$PTERO_SERVER_ID"
          ptero() { curl -sS --retry 3 --retry-all-errors -H "Authorization: Bearer $PTERO_API_KEY" -H "Content-Type: application/json" \
            -H "Accept: Application/vnd.pterodactyl.v1+json" "$@"; }
          ETAT=$(ptero "$API/resources" | python3 -c 'import json,sys; print(json.load(sys.stdin)["attributes"]["current_state"])' 2>/dev/null || echo inconnu)
          echo "État du serveur : $ETAT"
          if [ "$ETAT" != "running" ]; then
            echo "::warning::Serveur non démarré (état : $ETAT) : pas de profil, seulement les rapports déjà là."
            exit 0
          fi
          R="$LFTP_SSH set net:max-retries 3; set net:timeout 30;"
          l() { lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "$R $1; bye" < /dev/null; }
          profils() { l "cls -1 /diag/" 2>/dev/null | sed 's#.*/##' | tr -d '\r' | grep '^profil-' | sort || true; }
          profils > avant.txt
          CODE=$(ptero -o /dev/null -w '%{http_code}' -X POST "$API/command" -d "{\"command\":\"diag profil $S $I\"}" || echo erreur)
          echo "> diag profil $S $I (réponse du panel : $CODE)"
          if [ "$CODE" != "204" ] && [ "$CODE" != "200" ]; then
            echo "::warning::Commande refusée par le panel ($CODE) : pas de profil."
            exit 0
          fi
          sleep $((S + 10))
          # le rapport est fait sur un fil à part du serveur, puis écrit : on l'attend jusqu'à 3 min
          NOUVEAU=""
          for _ in $(seq 36); do
            profils > apres.txt
            NOUVEAU=$(comm -13 avant.txt apres.txt | tail -1)
            [ -n "$NOUVEAU" ] && break
            sleep 5
          done
          if [ -n "$NOUVEAU" ]; then
            echo "Rapport du profil : diag/$NOUVEAU"
            echo "PROFIL_NOUVEAU=$NOUVEAU" >> "$GITHUB_ENV"
          else
            echo "::warning::Pas de nouveau rapport de profil après 3 min (voir la console du panel)."
          fi

      - name: Rapatrier (lecture seule)
        run: |
          R="$LFTP_SSH set net:max-retries 3; set net:timeout 30;"
          l() { lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "$R $1; bye"; }
          # « cls -1 /dossier/ » rend des chemins complets (/diag/x.txt) : on ne garde que le nom (sinon « get /diag//diag/x »)
          noms() { l "cls -1 $1" 2>/dev/null | sed 's#.*/##' | tr -d '\r'; }
          mkdir -p diag j c conf
          # rapports du diagnostic du noyau (le serveur en garde 60 au plus) : une seule connexion
          l "lcd diag; mget /diag/*.txt" || true
          # journaux : le courant, le journal détaillé (debug.log, tout depuis le dernier démarrage) et les 6 derniers
          # journaux tournés datés (.log.gz ou .log.zip selon le serveur ; les plus récents par le nom)
          l "lcd j; get /logs/latest.log; get /logs/debug.log" || true
          for f in $(noms /logs/ | grep -E '^20[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]+\.log\.(gz|zip)$' | sort -V -r | head -6); do l "lcd j; get /logs/$f" || true; done
          for f in $(noms /crash-reports/ | grep -E '^crash-' | sort -r | head -4); do l "lcd c; get /crash-reports/$f" || true; done
          for f in server.properties spigot.yml bukkit.yml commands.yml; do l "lcd conf; get /$f" || true; done
          l "cls -l /diag/" > liste_diag.txt 2>/dev/null || true
          l "cls -l /logs/" > liste_logs.txt 2>/dev/null || true
          # correspondances des noms de Minecraft que le serveur peut lire lui-même (installation de Forge ou de Mohist)
          l "find /libraries/net/minecraft/server/; find /libraries/de/oceanlabs/mcp/" > liste_noms.txt 2>/dev/null || true
          ls -la diag j c conf

      # 20/11 (dépôt public) : les motifs de « masque » laissaient passer des pseudos dans d'autres formes de lignes
      # (« [GRADE X: Set own game mode…] », « Rejecting … from X », lignes de nos mods et de l'anticheat). Liste des pseudos
      # connus du serveur (caches de noms de Minecraft et de Forge, journaux rapatriés), JAMAIS affichée : chaque pseudo est
      # remplacé par *** partout, en plus des motifs.
      - name: Pseudos à masquer (jamais affichés)
        run: |
          R="$LFTP_SSH set net:max-retries 3; set net:timeout 30;"
          l() { lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "$R $1; bye"; }
          mkdir -p caches_noms
          l "lcd caches_noms; get /usercache.json; get /usernamecache.json" > /dev/null 2>&1 || true
          python3 -I outils/pseudos_a_masquer.py pseudos.sed caches_noms j
          rm -rf caches_noms

      - name: Noms lisibles (méthodes de Minecraft, fichiers du dépôt)
        run: |
          ls diag/*.txt > /dev/null 2>&1 || { echo "aucun rapport"; exit 0; }
          # sans les secrets du Ptero dans son environnement (il télécharge les correspondances de Mojang et de Forge)
          python3 outils/sans_secrets.py python3 outils/diag_noms.py diag/*.txt --cache "$RUNNER_TEMP/noms" || true

      - name: Contenu (journal de la tâche)
        run: |
          # adresses IP, mots de passe et clés, pseudos et identifiants des joueurs masqués (dépôt public : ce journal se lit
          # par tous ; mêmes règles pour les pseudos que « Journaux du serveur »)
          masque() { sed -E -e 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/x.x.x.x/g' \
            -e 's/([0-9a-fA-F]{1,4}:){4,7}[0-9a-fA-F]{1,4}/x:x:x:x/g' \
            -e 's/[0-9a-fA-F]{1,4}(:[0-9a-fA-F]{1,4})+::([0-9a-fA-F]{1,4}(:[0-9a-fA-F]{1,4})*)?/x:x::x/g' \
            -e 's/(password|passwd|secret|token|key)([=: ]+)[^ ]+/\1\2***/Ig' \
            -e "s/(ServerPlayer|Player)\['[^']*'/\1['***'/g" -e 's/name=[A-Za-z0-9_]{2,16}/name=***/g' \
            -e 's/(UUID of player )[A-Za-z0-9_]{2,16}/\1***/g' -e 's/<[A-Za-z0-9_]{2,16}>/<***>/g' \
            -e 's/[A-Za-z0-9_]{2,16}( joined the game| left the game| lost connection|\[\/x\.x\.x\.x|\[\/x:x:x:x|\[\/x:x::x)/***\1/g' \
            -e 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/uuid/g' | pseudos; }
          # pseudos connus du serveur (étape « Pseudos à masquer ») : remplacés partout
          pseudos() { if [ -s pseudos.sed ]; then sed -E -f pseudos.sed; else cat; fi; }
          echo "===== LISTE diag/ ====="; masque < liste_diag.txt | tail -80
          echo "===== LISTE logs/ ====="; masque < liste_logs.txt | tail -40
          echo "===== CORRESPONDANCES DES NOMS (libraries/ du serveur) ====="; grep -E 'mappings|mcp_config.*\.zip|\.tsrg' liste_noms.txt 2>/dev/null | head -20 || echo "aucune"
          # fichiers de la racine en entier (02/11) : pour aligner ceux du dépôt avant une « installation complète », qui les
          # remplace ; mots de passe, clés et adresses masqués
          for f in server.properties spigot.yml bukkit.yml commands.yml; do
            echo "===== FICHIER $f ====="; [ -f "conf/$f" ] && masque < "conf/$f" | grep -v -E '^\s*#' | head -400
          done
          echo "===== REGLAGES ====="
          grep -E '^(view-distance|simulation-distance|max-players|sync-chunk-writes|network-compression-threshold|entity-broadcast-range-percentage|max-tick-time|level-name)=' conf/server.properties 2>/dev/null
          grep -A12 -E '^\s*(entity-activation-range|entity-tracking-range):' conf/spigot.yml 2>/dev/null | head -40
          grep -A12 -E '^(spawn-limits|ticks-per):' conf/bukkit.yml 2>/dev/null | head -30
          # le dernier profil en entier (le nouveau si la case « profil » était cochée), puis les blocages (un rapport par
          # montée de ms), puis le reste : autres profils, fuites, mesures, bancs de charge (plus courts)
          DERNIER="${PROFIL_NOUVEAU:+diag/$PROFIL_NOUVEAU}"
          [ -f "$DERNIER" ] || DERNIER=$(ls diag/profil-*.txt 2>/dev/null | sort | tail -1)
          if [ -n "$DERNIER" ] && [ -f "$DERNIER" ]; then
            echo "===== DERNIER PROFIL $(basename "$DERNIER") ====="; masque < "$DERNIER" | head -4000
            {
              echo "## Dernier profil du serveur : $(basename "$DERNIER")"
              echo '```'
              masque < "$DERNIER" | sed -n '1,/^== 2 bis\./p' | head -150
              echo '```'
              echo "Rapport complet (arbre des appels, temps par système, pires ticks) : journal de l'étape « Contenu »."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          for f in $(ls diag/blocage-*.txt 2>/dev/null) $(ls diag/*.txt 2>/dev/null | grep -v '/blocage-'); do [ -f "$f" ] || continue
            [ "$f" = "$DERNIER" ] && continue
            case "$(basename "$f")" in blocage-*) n=400;; profil-*) n=150;; *) n=120;; esac
            echo "===== DIAG $(basename "$f") ====="; masque < "$f" | head -$n
          done
          # après le démarrage seulement (« Done (...) ») ; un journal tourné à minuit, sans démarrage, est gardé en entier
          apres_demarrage() { if printf '%s\n' "$txt" 2>/dev/null | grep -q '\]: Done ('; then printf '%s\n' "$txt" | awk 'f; /\]: Done \(/{f=1}'; else printf '%s\n' "$txt"; fi; }
          for f in j/*; do [ -f "$f" ] || continue
            case "$f" in *.gz) txt=$(zcat "$f");; *.zip) txt=$(unzip -p "$f");; *) txt=$(cat "$f");; esac
            echo "===== JOURNAL $(basename "$f") : $(printf '%s\n' "$txt" | wc -l) lignes, du $(printf '%s\n' "$txt" | head -1 | cut -c1-40) au $(printf '%s\n' "$txt" | tail -1 | cut -c1-40) ====="
            echo "===== JOURNAL $(basename "$f") : Can't keep up ====="
            printf '%s\n' "$txt" | grep -F "Can't keep up" | masque | tail -150
            echo "===== JOURNAL $(basename "$f") : diag / moniteur ====="
            printf '%s\n' "$txt" | grep -E '\[(diag|moniteur)\]|Tick #|lasted' | grep -v -E 'password|login|register' | masque | tail -200
            echo "===== JOURNAL $(basename "$f") : commandes jouées (heure et nom, les 300 dernières) ====="
            # seulement l'heure et le mot de la commande (ni pseudo, ni arguments : pas de mot de passe ni de message privé) ;
            # 21/11 (audit de validation) : seulement les commandes vues au moins 3 fois dans ce journal (un mot de passe tapé
            # une fois par erreur comme une commande, « /motdepasse », n'apparaît jamais dans ce journal public)
            printf '%s\n' "$txt" | grep -E 'issued server command' | sed -E 's/^\[([^]]*)\].*issued server command: *(\/[^ ]*).*/\1 \2/' | grep -E ' /[^ ]*$' > commandes.txt || true
            awk 'NR==FNR { n[tolower($2)]++; next } n[tolower($2)] >= 3' commandes.txt commandes.txt | tail -300
            echo "===== JOURNAL $(basename "$f") : 30 lignes avant chaque retard de 2 s et plus ====="
            printf '%s\n' "$txt" | grep -v -E '/DEBUG\]|\[DEBUG\]' | grep -E -B30 "Can't keep up.*Running ([2-9][0-9]{3}|[0-9]{5,})ms" | grep -v -E 'password|login|register' | grep -v -i -E '\[chat\]|issued server command|: <[^>]+> |\] <[^>]+> ' | masque | tail -400
            echo "===== JOURNAL $(basename "$f") : erreurs ====="
            apres_demarrage | grep -v -E '/DEBUG\]|\[DEBUG\]' | grep -E -B1 -A12 'Exception|Error:|\bat fr\.heral|\bat com\.(heraliz|Spartan|caracrea)' \
              | grep -v -E 'password|login|register' | grep -v -i -E '\[chat\]|issued server command|: <[^>]+> |\] <[^>]+> ' | masque | grep -v -E '^\s+at (java\.|jdk\.|net\.minecraftforge\.eventbus|cpw\.)' | head -400
            echo "===== JOURNAL $(basename "$f") : avertissements les plus fréquents ====="
            apres_demarrage | grep -E '/WARN\]|\[WARN\]|/ERROR\]|\[ERROR\]' | sed -E 's/^\[[^]]*\] *//; s/[0-9]+/N/g' | sort | uniq -c | sort -rn | masque | head -60
          done
          for f in c/*; do [ -f "$f" ] || continue
            echo "===== PLANTAGE $(basename "$f") ====="; grep -m1 -A40 -E '^Description:' "$f" | masque | head -60
          done
          echo "Rien n'a été modifié sur le Ptero."

      # 20/11 (audit réseau, mémoire et disque) : LECTURE SEULE, comme le reste. Le journal du ramasse-miettes (gc.log à la
      # racine, écrit par l'option -Xlog:gc* de la ligne Java de l'hébergeur ; aucun joueur dedans) est résumé : pauses par
      # sorte, mémoire vivante (après les passages qui vident aussi la vieille mémoire), vitesse d'allocation. Puis la place
      # prise sur le disque par dossier (tailles seulement ; dépôt public : jamais de nom de fichier, et seuls les noms de
      # dossiers connus de la racine sont écrits, un dossier peut porter le nom d'une personne ; « du » de tout le serveur
      # par le SFTP : plus de 15 min, libraries/ n'est pas compté) et le nombre de fichiers de joueurs du monde (un par
      # joueur venu au moins une fois).
      - name: Mémoire (ramasse-miettes) et disque (lecture seule)
        run: |
          R="$LFTP_SSH set net:max-retries 3; set net:timeout 30;"
          l() { lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "$R $1; bye"; }
          masque() { sed -E -e 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/x.x.x.x/g' \
            -e 's/([0-9a-fA-F]{1,4}:){4,7}[0-9a-fA-F]{1,4}/x:x:x:x/g' \
            -e 's/[0-9a-fA-F]{1,4}(:[0-9a-fA-F]{1,4})+::([0-9a-fA-F]{1,4}(:[0-9a-fA-F]{1,4})*)?/x:x::x/g' \
            -e 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/uuid/g' | pseudos; }
          pseudos() { if [ -s pseudos.sed ]; then sed -E -f pseudos.sed; else cat; fi; }
          mkdir -p gc
          l "lcd gc; get /gc.log" > /dev/null 2>&1 || true
          MONDE=$(sed -n 's/^level-name=//p' conf/server.properties 2>/dev/null | tr -d '\r' | tr -cd 'A-Za-z0-9_.-')
          MONDE=${MONDE:-dayz_map}
          l "cls -l /" > racine_tout.txt 2>/dev/null || true
          grep -v '^d' racine_tout.txt > racine.txt || true
          # dossiers de la racine (noms seulement), puis « du » dossier par dossier, chacun dans sa propre connexion et avec sa
          # propre limite (lftp ne rend sa sortie qu'à la fin : un seul « du » arrêté en cours ne donnait rien) ; le monde
          # d'abord ; libraries/ et le monde entier jamais (trop de dossiers par le SFTP) ; 12 min au plus en tout
          DOSSIERS=$(grep '^d' racine_tout.txt | tr -d '\r' | sed -e 's#/$##' -e 's#.*/##' | grep -v -x -E "libraries|\.cache|cache|\.|\.\.|$MONDE" | tr -cd 'A-Za-z0-9_.\n-' | sort)
          # noms qu'on peut écrire (monde, nos mods, Minecraft, Forge, plugins) ; les autres : « autre dossier n° k »
          CONNUS='^(dayz_map[A-Za-z0-9_-]*|heral[a-z_]*|crac|config|defaultconfigs|mods|plugins|logs|diag|crash-reports|screenshots|tacz[a-z_]*|mohist-config|dynmap|databases|generated_datapacks|limitless_vehicle[a-z_]*|modernfix|emotes|world[a-z_]*|sources|\.[a-z]+)$'
          k=0; : > noms.txt
          for d in $DOSSIERS; do
            if printf '%s' "$d" | grep -q -E "$CONNUS"; then printf '%s\t%s\n' "$d" "$d" >> noms.txt; else k=$((k+1)); printf '%s\tautre dossier n° %s\n' "$d" "$k" >> noms.txt; fi
          done
          # nos dossiers d'abord (petits, et ce sont nos données), puis les autres
          DOSSIERS="$(printf '%s\n' $DOSSIERS | grep -E '^heral') $(printf '%s\n' $DOSSIERS | grep -v -E '^heral')"
          fin=$(( $(date +%s) + 720 ))
          : > disque.txt
          for d in "$MONDE/region" "$MONDE/entities" "$MONDE/poi" "$MONDE/data" "$MONDE/playerdata" "$MONDE/dimensions" $DOSSIERS; do
            [ "$(date +%s)" -lt "$fin" ] || { printf '?\t/%s (pas mesuré : temps écoulé)\n' "$d" >> disque.txt; continue; }
            prof="-s"; [ "$d" = "$MONDE/dimensions" ] && prof="-d 2"
            timeout 240 lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "$R du -k $prof /$d; bye" > du1.txt 2>/dev/null \
              && cat du1.txt >> disque.txt || printf '?\t/%s (trop long, plus de 4 min)\n' "$d" >> disque.txt
          done
          # chemins écrits : le premier dossier remplacé par son nom affichable (noms.txt), rien d'autre
          awk -F '\t' 'NR==FNR { nom[$1]=$2; next } { split($2, p, "/"); r=p[2]; sub(/ .*/, "", r); if (r in nom) { sub("^/" r, "/" nom[r], $2) } else if (r != "'"$MONDE"'") { $2="/(dossier)" } print $1 "\t" $2 }' \
            noms.txt disque.txt > disque_affiche.txt 2>/dev/null || true
          # nos données : nombre et taille des fichiers du premier niveau de chaque dossier de mod (aucun nom de fichier)
          for d in $(printf '%s\n' $DOSSIERS | grep -E '^heral'); do
            l "cls -l /$d/" 2>/dev/null | grep -v '^d' | awk -v d="$d" '{n++; t+=$5; if ($5>m) m=$5} END {printf "%d\t/%s : %d fichiers, le plus gros %d octets\n", t, d, n, m}' >> fichiers_mods.txt || true
          done
          JOUEURS=$(l "cls -1 /$MONDE/playerdata/" 2>/dev/null | grep -c '\.dat$' || true)
          {
            echo "===== RAMASSE-MIETTES (gc.log du serveur, depuis son dernier démarrage) ====="
            if [ -s gc/gc.log ]; then
              echo "gc.log : $(du -h gc/gc.log | cut -f1)"
              python3 -I - gc/gc.log <<'PY' || true
          import re, sys, statistics
          PAUSE = re.compile(r"\]\[(?P<up>[\d.]+)s\]\[\w+\s*\]\[(?P<tags>[^\]]*)\]\s+GC\((?P<n>\d+)\) (?P<sorte>Pause [A-Za-z]+(?: \([^)]*\))*?)"
                             r"(?: \([^)]*\))? (?P<av>\d+)M->(?P<ap>\d+)M\((?P<tot>\d+)M\) (?P<ms>[\d.]+)ms")
          CYCLE = re.compile(r"\]\[(?P<up>[\d.]+)s\].*GC\(\d+\) Concurrent Mark Cycle (?P<ms>[\d.]+)ms")
          GEANTS = re.compile(r"Humongous regions: \d+->(\d+)")
          pauses, cycles, init = [], [], []
          geants = epuise = 0
          with open(sys.argv[1], encoding="utf-8", errors="replace") as f:
              for l in f:
                  if "[gc,init" in l and len(init) < 20:
                      init.append(l.split("] ", 1)[-1].strip())
                  m = PAUSE.search(l)
                  if m:
                      pauses.append((float(m["up"]), m["sorte"], int(m["av"]), int(m["ap"]), int(m["tot"]), float(m["ms"])))
                      continue
                  m = CYCLE.search(l)
                  if m:
                      cycles.append(float(m["ms"]))
                      continue
                  m = GEANTS.search(l)
                  if m:
                      geants = max(geants, int(m.group(1)))
                  if "To-space exhausted" in l or "Evacuation Failure" in l:
                      epuise += 1
          if not pauses:
              print("aucune pause trouvée (gc.log vide ou d'un autre format)")
              sys.exit(0)
          def q(v, p):
              v = sorted(v)
              return v[min(len(v) - 1, int(round(p / 100 * (len(v) - 1))))]
          debut, fin = pauses[0][0], pauses[-1][0]
          duree = max(1.0, fin - debut)
          print("Réglages lus au démarrage :")
          for l in init:
              print("  " + l)
          print("Période : %.1f h de fonctionnement (de %.0f s à %.0f s après le démarrage), %d pauses" % (duree / 3600, debut, fin, len(pauses)))
          sortes = {}
          for p in pauses:
              sortes.setdefault(re.sub(r" \((G1|System|Metadata|GCLocker|Allocation|WhiteBox)[^)]*\)", "", p[1]), []).append(p[5])
          print("  %-36s %7s %9s %9s %9s %9s %10s" % ("sorte", "nombre", "moyenne", "médiane", "95 %", "pire", "total (s)"))
          for cle, v in sorted(sortes.items(), key=lambda x: -sum(x[1])):
              print("  %-36s %7d %7.1f ms %7.1f ms %7.1f ms %7.0f ms %10.1f" % (cle[:36], len(v), statistics.mean(v), q(v, 50), q(v, 95), max(v), sum(v) / 1000))
          total = sum(p[5] for p in pauses) / 1000
          print("Temps en pause : %.1f s sur %.1f h (%.2f %% du temps)" % (total, duree / 3600, 100 * total / duree))
          apres = [p[3] for p in pauses if p[1].startswith("Pause Young") or "Full" in p[1]]
          if apres:
              print("Après un passage jeune (Mo, sur %d Mo ; la vieille mémoire comprise, qui ne baisse qu'aux passages mixtes) : plus petite %d, médiane %d, plus grande %d" % (pauses[-1][4], min(apres), q(apres, 50), max(apres)))
              print("  les 12 dernières : %s" % ", ".join(str(a) for a in apres[-12:]))
          vivante = [(p[0], p[3]) for p in pauses if "Mixed" in p[1] or "Full" in p[1]]
          if vivante:
              print("Mémoire vivante (après les passages mixtes ou complets, %d) : plus petite %d Mo, plus grande %d Mo ; les dernières : %s"
                    % (len(vivante), min(v for _, v in vivante), max(v for _, v in vivante), ", ".join("%d Mo à %.1f h" % (v, t / 3600) for t, v in vivante[-6:])))
              print("  (une fuite : ces valeurs montent d'heure en heure avec le même nombre de joueurs)")
          else:
              print("Mémoire vivante : aucun passage mixte (la vieille mémoire n'a pas encore atteint le seuil de 20 % du tas)")
          jeunes = [p for p in pauses if p[1].startswith("Pause Young")]
          alloue, temps, pire = 0, 0.0, 0.0
          for a, b in zip(jeunes, jeunes[1:]):
              dt = b[0] - a[0]
              if dt <= 0 or b[2] < a[3]:
                  continue
              alloue += b[2] - a[3]
              temps += dt
              pire = max(pire, (b[2] - a[3]) / dt)
          if temps > 0:
              print("Allocation : %.0f Mo/s en moyenne, %.0f Mo/s au plus (entre deux passages) ; un passage jeune toutes les %.1f s"
                    % (alloue / temps, pire, duree / max(1, len(jeunes))))
          longues = [p for p in pauses if p[5] >= 100]
          print("Pauses de 100 ms et plus : %d" % len(longues))
          for p in longues[-15:]:
              print("  %8.0f s  %-60s %6.0f ms  (%d -> %d Mo)" % (p[0], p[1][:60], p[5], p[2], p[3]))
          if cycles:
              print("Marquages concurrents (à côté du jeu, sans pause) : %d, %.0f ms en moyenne" % (len(cycles), statistics.mean(cycles)))
          print("Pauses complètes (Full GC) : %d ; évacuations ratées (To-space exhausted) : %d ; régions géantes au plus : %d"
                % (sum(1 for p in pauses if "Full" in p[1]), epuise, geants))
          PY
            else
              echo "gc.log absent à la racine du serveur (ligne Java sans -Xlog:gc*:file=gc.log)"
            fi
            echo "===== DISQUE : place prise par dossier (Ko, les plus gros d'abord) ====="
            sort -t "$(printf '\t')" -k1,1nr disque_affiche.txt 2>/dev/null | masque | head -70
            echo "===== DISQUE : fichiers du premier niveau des dossiers de nos mods (octets en tout) ====="
            sort -t "$(printf '\t')" -k1,1nr fichiers_mods.txt 2>/dev/null | masque | head -40
            # 21/11 (validation v9, audit a9 n° 4, choix du propriétaire) : dépôt public, un fichier peut porter le nom d'une
            # personne : seuls les noms connus (Minecraft, Mohist, plugins) sont écrits, les autres seulement comptés
            echo "===== DISQUE : fichiers de la racine (sans les dossiers ; noms connus seulement, les autres comptés) ====="
            tr -d '\r' < racine.txt | awk '
              BEGIN { split("server.properties eula.txt gc.log bukkit.yml spigot.yml commands.yml help.yml permissions.yml wepif.yml ops.json whitelist.json banned-players.json banned-ips.json usercache.json usernamecache.json user_jvm_args.txt run.sh start.sh", c, " "); for (i in c) connu[c[i]] = 1 }
              NF >= 9 { n = $9; for (i = 10; i <= NF; i++) n = n " " $i
                if ((n in connu) || n ~ /^mohist-[0-9.]+-[0-9]+-server\.jar$/ || n ~ /^hs_err_pid[0-9]+\.log$/) printf "%s\t%s\n", $5, n
                else { k++; t += $5 } }
              END { printf "%d autre(s) fichier(s), %d octets en tout (noms pas écrits)\n", k, t }' | head -40
            echo "Fichiers de joueurs du monde (playerdata) : ${JOUEURS:-?}"
          } > memoire_disque.txt
          cat memoire_disque.txt
          {
            echo "## Mémoire et disque du serveur"
            echo '```'
            sed -n '/===== RAMASSE-MIETTES/,/===== DISQUE : fichiers/p' memoire_disque.txt | head -90
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Rien n'a été modifié sur le Ptero."
