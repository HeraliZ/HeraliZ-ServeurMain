# Journaux du serveur : LECTURE SEULE. Montre dans le résumé les erreurs Java du journal du serveur (logs/latest.log et
# les deux journaux précédents) et la liste des rapports de plantage récents, avec leur cause. Les adresses IP sont
# masquées. Rien n'est écrit ni supprimé sur le Ptero. Part d'une branche de travail quand ce fichier change, ou par
# « Run workflow » (filtre facultatif : un mot à chercher, ex. « duel »).
name: Journaux du serveur

on:
  workflow_dispatch:
    inputs:
      filtre:
        description: "Mot à chercher en plus des erreurs (facultatif)"
        type: string
        default: ""
  push:
    branches-ignore: [main]
    paths: [".github/workflows/journaux.yml"]

permissions:
  contents: read

jobs:
  journaux:
    runs-on: ubuntu-latest
    # Depuis main : environnement « production » ; depuis une branche de travail : environnement « lecture », qui
    # n'a qu'un accès en lecture au Ptero (sous-utilisateur sans écriture ni console ; docs/MISE_EN_LIGNE_GITHUB.md,
    # section 7). Sans environnement réglé, GitHub les crée vides et les secrets du dépôt servent comme avant.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'lecture' }}
    timeout-minutes: 15
    env:
      PTERO_SFTP_HOST: ${{ secrets.PTERO_SFTP_HOST }}
      PTERO_SFTP_PORT: ${{ secrets.PTERO_SFTP_PORT }}
      PTERO_SFTP_USER: ${{ secrets.PTERO_SFTP_USER }}
      PTERO_SFTP_PASSWORD: ${{ secrets.PTERO_SFTP_PASSWORD }}
      FILTRE: ${{ inputs.filtre || 'matchs' }}
      PTERO_SFTP_EMPREINTE: ${{ vars.PTERO_SFTP_EMPREINTE || secrets.PTERO_SFTP_EMPREINTE }}
    steps:
      # seulement l'outil de l'empreinte du Ptero
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: outils/hote_connu.sh
          sparse-checkout-cone-mode: false

      - name: Accès au Ptero
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          HOTE="${PTERO_SFTP_HOST#sftp://}"
          HOTE="${HOTE%%/*}"
          PORT="${PTERO_SFTP_PORT:-}"
          case "$HOTE" in *:*) [ -z "$PORT" ] && PORT="${HOTE##*:}"; HOTE="${HOTE%%:*}";; esac
          PORT="${PORT:-2022}"
          echo "::add-mask::$HOTE"
          echo "PTERO_HOTE=$HOTE" >> "$GITHUB_ENV"
          echo "PTERO_PORT=$PORT" >> "$GITHUB_ENV"
          if bash outils/hote_connu.sh "$HOTE" "$PORT" "$RUNNER_TEMP/hotes_ptero" PTERO_SFTP_EMPREINTE <<< "${PTERO_SFTP_EMPREINTE:-}"; then
            echo "LFTP_SSH=set sftp:connect-program $RUNNER_TEMP/hotes_ptero.ssh;" >> "$GITHUB_ENV"
            echo "SFTP du Ptero : machine vérifiée par son empreinte."
          else
            echo "LFTP_SSH=set sftp:auto-confirm yes;" >> "$GITHUB_ENV"
            echo "::warning::SFTP du Ptero : machine non vérifiée (variable PTERO_SFTP_EMPREINTE absente : voir le résumé)."
          fi

      - name: Erreurs et plantages (lecture seule)
        run: |
          R="$LFTP_SSH set net:max-retries 3; set net:timeout 30;"
          l() { lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "$R $1; bye"; }
          mkdir -p j c
          # LECTURE SEULE : jamais « get -E » (lftp efface alors le fichier du serveur après la copie : chaque passage
          # effaçait le journal en cours du Ptero, corrigé une première fois le 24/10 dans l'ancien dépôt)
          l "lcd j; get /logs/latest.log" || true
          # journaux tournés : les plus récents par le nom daté (l'heure des fichiers du Ptero trompe)
          # (« cls -1 » rend des chemins complets : on ne garde que le nom ; le Ptero tourne ses journaux en .log.zip)
          noms() { l "cls -1 $1" 2>/dev/null | sed 's#.*/##' | tr -d '\r'; }
          for f in $(noms /logs/ | grep -E '^20[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]+\.log\.(gz|zip)$' | sort -V -r | head -3); do l "lcd j; get /logs/$f" || true; done
          for f in $(noms /crash-reports/ | grep -E '^crash-' | sort -r | head -4); do l "lcd c; get /crash-reports/$f" || true; done
          masque() { sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/x.x.x.x/g'; }
          {
            echo "## Rapports de plantage récents"
            for f in c/*; do [ -f "$f" ] || continue
              echo "### $(basename "$f")"; echo '```'
              grep -m1 -A40 -E '^Description:' "$f" | masque | head -60
              echo '```'
            done
            # après le démarrage seulement (« Done (...) ») ; un journal tourné à minuit, sans démarrage, est gardé en entier
            apres_demarrage() { if printf '%s\n' "$txt" 2>/dev/null | grep -q '\]: Done ('; then printf '%s\n' "$txt" | awk 'f; /\]: Done \(/{f=1}'; else printf '%s\n' "$txt"; fi; }
            for f in j/*; do [ -f "$f" ] || continue
              case "$f" in *.gz) txt=$(zcat "$f");; *.zip) txt=$(unzip -p "$f");; *) txt=$(cat "$f");; esac
              # seulement après le démarrage (« Done (... ) ») : les avertissements du chargement des mods noient le reste
              txt=$(apres_demarrage)
              echo "## Erreurs Java dans $(basename "$f")"; echo '```'
              printf '%s\n' "$txt" | grep -E -B2 -A25 'Exception|Error:|\bat fr\.|\bat com\.(heraliz|Spartan|caracrea)' \
                | grep -v -E 'password|login|register' | masque | grep -v -E '^\s+at (java\.|jdk\.|net\.minecraftforge\.eventbus|cpw\.)' | head -500
              echo '```'
              if [ -n "$FILTRE" ]; then
                echo "### Lignes avec « $FILTRE »"; echo '```'
                printf '%s\n' "$txt" | grep -i -F -- "$FILTRE" | grep -v -E 'password|login|register' | masque | tail -100
                echo '```'
              fi
            done
            echo; echo "Rien n'a été modifié sur le Ptero."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
