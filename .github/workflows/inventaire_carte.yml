# Inventaire de la carte : quels blocs de nos mods (décors, meubles de l'onglet HeraliZ, bases, utils…) sont posés
# sur la carte du serveur, et lesquels ne sont posés nulle part. LECTURE SEULE : les fichiers de régions du monde en
# service sont COPIÉS sur la machine de GitHub (téléchargement SFTP), puis lus ; rien n'est jamais écrit ni supprimé
# sur le Ptero. Le résultat s'affiche dans le résumé de l'exécution. « Run workflow » ; peut aussi partir d'une
# branche de travail quand ce fichier change. Fabrique aussi, depuis les mêmes régions, le fond de la carte du monde
# (outils/carte_monde.py : vues satellite et relief), gardé dans le paquet « fond-carte ». Case « installer_fond »
# (« Run workflow » sur une branche de travail, jamais main) : le fond est aussi mis dans le mod HeraliZ Utils et
# enregistré sur cette branche (utile quand le quota des paquets de GitHub est plein ; ~3 Mo de plus dans le dépôt à
# chaque fois : à faire rarement). Le monde du Ptero n'est jamais modifié.
# Case « props » : analyse des props et des conteneurs de loot (outils/props_carte.py : pièces, doublons, props
# d'extérieur à l'intérieur, paliers absents...), plan de diversification et rendus avant / après, depuis la même copie
# (plus les zones de loot du pack de données et trois petits fichiers data/, copiés eux aussi en lecture seule). Le plan
# est enregistré sur la branche de travail (props_carte/) ; on le joue ensuite avec le workflow « Props de la carte ».
name: Inventaire de la carte

on:
  workflow_dispatch:
    inputs:
      installer_fond:
        description: "Mettre le fond de la carte du monde dans le mod (branche de travail seulement, jamais main)"
        type: boolean
        default: false
      props:
        description: "Props et conteneurs de loot : analyse, plan de diversification et rendus (lecture seule ; plan enregistré sur la branche de travail)"
        type: boolean
        default: false
      props_options:
        description: "Options du plan des props (ex. « --ajouts », « --max-changements 2000 », « --graine 2 »)"
        type: string
        default: ""
  push:
    branches-ignore: [main]
    paths: [".github/workflows/inventaire_carte.yml", "outils/carte_monde.py"]

permissions:
  contents: write   # seulement pour « installer_fond » (enregistrer le fond sur la branche de travail)

concurrency:
  group: inventaire-carte
  cancel-in-progress: false

jobs:
  inventaire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PTERO_SFTP_HOST: ${{ secrets.PTERO_SFTP_HOST }}
      PTERO_SFTP_PORT: ${{ secrets.PTERO_SFTP_PORT }}
      PTERO_SFTP_USER: ${{ secrets.PTERO_SFTP_USER }}
      PTERO_SFTP_PASSWORD: ${{ secrets.PTERO_SFTP_PASSWORD }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Accès au Ptero
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          HOTE="${PTERO_SFTP_HOST#sftp://}"
          HOTE="${HOTE%%/*}"
          PORT="${PTERO_SFTP_PORT:-}"
          case "$HOTE" in *:*) [ -z "$PORT" ] && PORT="${HOTE##*:}"; HOTE="${HOTE%%:*}";; esac
          PORT="${PORT:-2022}"
          echo "::add-mask::$HOTE"
          echo "PTERO_HOTE=$HOTE" >> "$GITHUB_ENV"
          echo "PTERO_PORT=$PORT" >> "$GITHUB_ENV"
          echo "LFTP_REGLAGES=set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; set net:reconnect-interval-base 5; set net:limit-total-rate 15M;" >> "$GITHUB_ENV"

      - name: Copie des régions du monde en service (lecture seule)
        run: |
          lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" \
            -e "$LFTP_REGLAGES set cmd:fail-exit yes; set xfer:clobber on; get /server.properties -o server_ptero.properties; bye" < /dev/null
          MONDE=$(tr -d '\r' < server_ptero.properties | sed -n 's/^level-name=//p' | head -n 1)
          case "$MONDE" in ""|.|..|*[!A-Za-z0-9_.-]*) echo "::error::Nom du monde illisible dans le server.properties du Ptero."; exit 1;; esac
          echo "Monde en service : $MONDE"
          echo "MONDE=$MONDE" >> "$GITHUB_ENV"
          mkdir -p copie
          for D in "$MONDE" "${MONDE}_nether" "${MONDE}_the_end"; do
            # seulement les fichiers de régions de blocs (*.mca des dossiers region/) : ni entités, ni joueurs, ni réglages
            lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" \
              -e "$LFTP_REGLAGES mirror --parallel=2 --include-glob '*.mca' --exclude-glob 'entities/' --exclude-glob 'poi/' --exclude-glob 'playerdata/' /$D copie/$D; bye" < /dev/null \
              || echo "(pas de dossier /$D)"
          done
          du -sh copie/* 2>/dev/null || true
          find copie -name '*.mca' | wc -l

      # Pour l'analyse des props : zones de loot du pack de données de la carte, chunks forcés, données de HeraliZ Loot
      # (parts d'actifs réglées en jeu, points T7). Petits fichiers, COPIÉS en lecture seule ; rien n'est écrit sur le Ptero.
      - name: Copie des zones de loot et des données de HeraliZ Loot (lecture seule)
        if: ${{ inputs.props }}
        run: |
          mkdir -p "copie/$MONDE/data" "copie/$MONDE/datapacks/heraliz_carte/data/heraliz_loot/zones"
          lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" \
            -e "$LFTP_REGLAGES mirror --parallel=2 --include-glob '*.json' /$MONDE/datapacks/heraliz_carte/data/heraliz_loot/zones copie/$MONDE/datapacks/heraliz_carte/data/heraliz_loot/zones; bye" < /dev/null \
            || echo "::warning::Zones de loot du pack de données introuvables : l'analyse se fera sans les lieux."
          for F in chunks.dat heraliz_loot_rotation.dat heraliz_loot_points_t7.dat; do
            lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" \
              -e "$LFTP_REGLAGES set xfer:clobber on; get /$MONDE/data/$F -o copie/$MONDE/data/$F; bye" < /dev/null || echo "(pas de data/$F)"
          done
          find "copie/$MONDE/datapacks" -name '*.json' | wc -l

      - name: Inventaire
        run: |
          python outils/inventaire_carte.py copie/* --sortie inventaire.md
          cat inventaire.md >> "$GITHUB_STEP_SUMMARY"

      # Fond de la carte du monde (touche M, HeraliZ Utils) : vue de dessus satellite et relief, refaite depuis les MÊMES
      # régions copiées (rien n'est écrit sur le Ptero). Gardée 7 jours dans le paquet « fond-carte » ; pour la mettre
      # dans le jeu : la poser dans mods/heralisz-utils/src/client/resources/assets/heraliz_carte/carte/ (ou relancer
      # outils/carte_monde.py --installer sur une copie du monde), puis fabriquer heralisz-utils. Un échec ici ne retient
      # pas l'inventaire.
      - name: Fond de la carte du monde
        continue-on-error: true
        run: |
          python -m pip install --quiet numpy pillow
          python outils/carte_monde.py "copie/$MONDE" --sortie fond_carte --stats 2>&1 | tee fond_carte.log
          {
            echo "## Fond de la carte du monde"
            echo
            echo '```'
            grep '^\[carte\]' fond_carte.log || true
            echo '```'
            echo
            echo "Images dans le paquet « fond-carte » de cette exécution (7 jours), avec deux aperçus. Pour les mettre dans le jeu :"
            echo "les poser dans le mod HeraliZ Utils (assets/heraliz_carte/carte/), puis fabriquer heralisz-utils et l'envoyer."
          } >> "$GITHUB_STEP_SUMMARY"

      # Props et conteneurs de loot (outils/props_carte.py) : analyse des pièces et des incohérences, plan de
      # diversification (lots de commandes conditionnelles + annulation), rendus avant / après. Rien n'est envoyé au
      # serveur ici : on joue le plan, après validation du propriétaire, avec le workflow « Props de la carte ».
      - name: Props et conteneurs (analyse, plan, rendus)
        if: ${{ inputs.props }}
        env:
          PROPS_OPTIONS: ${{ inputs.props_options }}
        run: |
          python -m pip install --quiet numpy pillow scipy
          python outils/props_carte.py analyser "copie/$MONDE" --sortie props > props_analyse.log 2>&1 || { tail -n 40 props_analyse.log; exit 1; }
          OPTS="$(printf '%s' "$PROPS_OPTIONS" | tr -cd 'A-Za-z0-9 ,_-')"
          python outils/props_carte.py plan props $OPTS > props_plan.log 2>&1 || { tail -n 40 props_plan.log; exit 1; }
          python outils/props_carte.py rendus "copie/$MONDE" props > props_rendus.log 2>&1 || { tail -n 20 props_rendus.log; echo "::warning::Rendus impossibles."; }
          python outils/props_catalogue.py --sortie props/catalogue.md
          {
            cat props/rapport.md
            echo
            cat props/plan/plan.md
            echo
            echo "Rendus avant / après, lots de commandes et annulations : paquet « props-carte » de cette exécution (7 jours)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Garder l'analyse des props
        if: ${{ inputs.props }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: props-carte
          path: props/
          retention-days: 7
          if-no-files-found: warn

      # Le plan validé par le propriétaire doit être EXACTEMENT celui qu'on jouera : il est enregistré sur la branche
      # de travail (props_carte/plan.tar.gz : lots, annulations, plan.json ; ~0,5 Mo), avec le rapport, le plan lisible
      # et les rendus. Un plan déjà en partie joué (journal) n'est pas écrasé sans être archivé.
      - name: Enregistrer le plan des props (branche de travail)
        if: ${{ inputs.props && github.ref_name != 'main' }}
        run: |
          test -s props/plan/plan.json || { echo "::error::Plan des props absent : rien n'est enregistré."; exit 1; }
          mkdir -p props_carte/rendus props_carte/archives
          if [ -s props_carte/journal.txt ]; then
            D=$(date -u +%Y%m%d_%H%M)
            { echo "# journal du plan précédent (commit $(git rev-parse --short HEAD)), archivé le $D"; cat props_carte/journal.txt; } > "props_carte/archives/journal_$D.txt"
            git rm -q props_carte/journal.txt
            echo "::warning::Un plan précédent avait déjà été joué : son journal est archivé (props_carte/archives/journal_$D.txt) ; pour l'annuler, repartir du commit $(git rev-parse --short HEAD)."
          fi
          rm -f props_carte/rendus/*.png
          cp props/rapport.md props/rapport_complet.md props/plan/plan.md props_carte/
          cp props/rendus/*.png props_carte/rendus/ 2>/dev/null || true
          tar czf props_carte/plan.tar.gz -C props/plan lots annulation plan.json
          git config user.name "HeraliZ"
          git config user.email "heraliz@users.noreply.github.com"
          git add -A props_carte
          if git diff --cached --quiet; then echo "Plan inchangé : rien à enregistrer."; exit 0; fi
          git commit -q -m "Props de la carte : analyse et plan refaits depuis le monde du serveur ($MONDE, lecture seule)"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "Plan des props enregistré sur la branche ${GITHUB_REF_NAME} (props_carte/) : à valider, puis workflow « Props de la carte »." >> "$GITHUB_STEP_SUMMARY"

      - name: Garder le fond de la carte
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: fond-carte
          path: fond_carte/
          retention-days: 7
          if-no-files-found: warn

      - name: Mettre le fond dans le mod (branche de travail)
        if: ${{ inputs.installer_fond && github.ref_name != 'main' }}
        run: |
          D=mods/heralisz-utils/src/client/resources/assets/heraliz_carte/carte
          test -s fond_carte/carte.json || { echo "::error::Fond de la carte absent : rien n'est enregistré."; exit 1; }
          mkdir -p "$D"
          rm -f "$D"/satellite_*.png "$D"/relief_*.png "$D"/carte.json
          cp fond_carte/satellite_*.png fond_carte/relief_*.png fond_carte/carte.json "$D"/
          git config user.name "HeraliZ"
          git config user.email "heraliz@users.noreply.github.com"
          git add -A "$D"
          if git diff --cached --quiet; then echo "Fond inchangé : rien à enregistrer."; exit 0; fi
          git commit -q -m "Carte du monde : fond refait depuis le monde du serveur ($MONDE, lecture seule)"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "Fond de la carte enregistré sur la branche ${GITHUB_REF_NAME} : fabriquer heralisz-utils et l'envoyer." >> "$GITHUB_STEP_SUMMARY"
