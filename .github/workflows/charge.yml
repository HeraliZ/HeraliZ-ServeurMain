# Test de charge du serveur : lance des bots de HeraliZ Utils (/bots, vrais joueurs du serveur qui courent, tirent,
# lancent des grenades, se soignent, fouillent) dans un monde À PART (par défaut le monde du tutoriel des bases
# `crac:bases`, jamais la carte), mesure le serveur avec spark pendant N minutes, retire les bots, puis affiche dans le
# résumé : TPS et temps par tick relevés chaque minute, état des bots, lien du profil de spark (ce qui coûte le plus),
# erreurs du journal. Rien d'autre n'est changé ; les bots sont retirés même si le test est annulé.
# « Run workflow » seulement (serveur démarré).
name: Test de charge

on:
  workflow_dispatch:
    inputs:
      bots:
        description: "Nombre de bots (1 à 200)"
        type: number
        default: 50
      minutes:
        description: "Durée du test en minutes (1 à 20)"
        type: number
        default: 5
      monde:
        description: "Monde où poser les bots (jamais la carte en construction)"
        type: string
        default: "crac:bases"
      rayon:
        description: "Rayon de jeu des bots autour du point 0 0 (blocs)"
        type: number
        default: 64
      frappes:
        description: "Frappes aériennes et largages des bots"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: charge
  cancel-in-progress: false

jobs:
  charge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PTERO_SFTP_HOST: ${{ secrets.PTERO_SFTP_HOST }}
      PTERO_SFTP_PORT: ${{ secrets.PTERO_SFTP_PORT }}
      PTERO_SFTP_USER: ${{ secrets.PTERO_SFTP_USER }}
      PTERO_SFTP_PASSWORD: ${{ secrets.PTERO_SFTP_PASSWORD }}
      PTERO_URL: ${{ secrets.PTERO_URL }}
      PTERO_SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
      PTERO_API_KEY: ${{ secrets.PTERO_API_KEY }}
      BOTS: ${{ inputs.bots }}
      MINUTES: ${{ inputs.minutes }}
      MONDE: ${{ inputs.monde }}
      RAYON: ${{ inputs.rayon }}
      FRAPPES: ${{ inputs.frappes }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Réglages du test
        run: |
          B=$(printf '%s' "$BOTS" | tr -cd '0-9'); B=${B:-50}; [ "$B" -lt 1 ] && B=1; [ "$B" -gt 200 ] && B=200
          M=$(printf '%s' "$MINUTES" | tr -cd '0-9'); M=${M:-5}; [ "$M" -lt 1 ] && M=1; [ "$M" -gt 20 ] && M=20
          R=$(printf '%s' "$RAYON" | tr -cd '0-9'); R=${R:-64}; [ "$R" -lt 8 ] && R=8; [ "$R" -gt 2000 ] && R=2000
          W=$(printf '%s' "$MONDE" | tr -cd 'a-z0-9_:/.-'); W=${W:-crac:bases}
          case "$W" in minecraft:overworld|overworld) echo "::error::Jamais sur la carte (monde en construction)."; exit 1;; esac
          F=false; [ "$FRAPPES" = "true" ] && F=true
          { echo "NB=$B"; echo "DUREE=$M"; echo "R=$R"; echo "W=$W"; echo "F=$F"; } >> "$GITHUB_ENV"
          echo "$B bots, $M min, monde $W, rayon $R, frappes $F"

      - name: Accès au Ptero
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          HOTE="${PTERO_SFTP_HOST#sftp://}"
          HOTE="${HOTE%%/*}"
          PORT="${PTERO_SFTP_PORT:-}"
          case "$HOTE" in *:*) [ -z "$PORT" ] && PORT="${HOTE##*:}"; HOTE="${HOTE%%:*}";; esac
          PORT="${PORT:-2022}"
          echo "::add-mask::$HOTE"
          echo "PTERO_HOTE=$HOTE" >> "$GITHUB_ENV"
          echo "PTERO_PORT=$PORT" >> "$GITHUB_ENV"
          API="${PTERO_URL%/}/api/client/servers/$PTERO_SERVER_ID"
          echo "API=$API" >> "$GITHUB_ENV"
          ETAT=$(curl -sS "$API/resources" -H "Authorization: Bearer $PTERO_API_KEY" -H "Accept: Application/vnd.pterodactyl.v1+json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["attributes"]["current_state"])' 2>/dev/null || echo inconnu)
          echo "État du serveur : $ETAT"
          if [ "$ETAT" != "running" ]; then echo "::error::Le serveur n'est pas démarré."; exit 1; fi

      - name: Lancement des bots et de spark
        run: |
          cmd() {
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$API/command" \
              -H "Authorization: Bearer $PTERO_API_KEY" -H "Content-Type: application/json" \
              -H "Accept: Application/vnd.pterodactyl.v1+json" -d "{\"command\":\"$1\"}")
            echo "> $1 ($CODE)"
            sleep 2
          }
          date -u +%H:%M:%S > debut.txt
          cmd "bots joueurs false"
          cmd "bots action frappes $F"
          cmd "bots action largages $F"
          cmd "spark health"
          cmd "spark profiler start --timeout $((DUREE * 60))"
          cmd "execute in $W positioned 0 120 0 run bots lancer $NB $R"

      - name: Mesures pendant le test
        run: |
          cmd() {
            curl -sS -o /dev/null -X POST "$API/command" -H "Authorization: Bearer $PTERO_API_KEY" -H "Content-Type: application/json" \
              -H "Accept: Application/vnd.pterodactyl.v1+json" -d "{\"command\":\"$1\"}"
            sleep 2
          }
          for i in $(seq 1 "$DUREE"); do
            sleep 56
            cmd "bots etat"
            cmd "spark tps"
            echo "minute $i"
          done

      - name: Retrait des bots
        if: always()
        run: |
          [ -n "${API:-}" ] || exit 0
          curl -sS -o /dev/null -X POST "$API/command" -H "Authorization: Bearer $PTERO_API_KEY" -H "Content-Type: application/json" \
            -H "Accept: Application/vnd.pterodactyl.v1+json" -d '{"command":"bots retirer"}' || true
          # spark envoie son profil à la fin du délai : le temps qu'il apparaisse dans le journal
          sleep 45

      - name: Résultats
        if: always()
        run: |
          [ -n "${PTERO_HOTE:-}" ] || exit 0
          lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" \
            -e "set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30; get /logs/latest.log -o latest.log; bye" || true
          python3 - <<'EOF'
          import os, re
          debut = open("debut.txt").read().strip() if os.path.exists("debut.txt") else "00:00:00"
          try:
              lignes = open("latest.log", encoding="utf-8", errors="replace").read().splitlines()
          except OSError:
              lignes = []
          ip = re.compile(r"\b\d{1,3}(\.\d{1,3}){3}\b")
          garder = re.compile(r"\[bots\]|TPS|MSPT|tick|spark\.lucko\.me|Can't keep up|Exception|ERROR|CPU|Memory|mémoire|heap", re.I)
          vues = []
          for l in lignes:
              m = re.match(r"\[(\d\d:\d\d:\d\d)", l)
              if m and m.group(1) < debut:
                  continue
              if garder.search(l):
                  vues.append(ip.sub("x.x.x.x", l)[:400])
          liens = sorted({u for l in vues for u in re.findall(r"https://spark\.lucko\.me/\S+", l)})
          out = ["## Test de charge", "",
                 f"{os.environ.get('NB')} bots, {os.environ.get('DUREE')} min, monde `{os.environ.get('W')}`, frappes {os.environ.get('F')}", ""]
          out.append("**Profil spark** : " + (", ".join(liens) if liens else "pas trouvé dans le journal (relancer, ou `spark profiler open` en jeu)"))
          out += ["", "```"] + vues[-400:] + ["```"]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write("\n".join(out) + "\n")
          print("\n".join(out))
          EOF
