# Launcher des joueurs (launcher/, voir CLAUDE.md section 8 ter) : tests, puis installateur Windows gardé 7 jours dans
# l'onglet Actions (paquet « launcher-windows », si le quota d'artefacts du dépôt le permet). « Run workflow » avec
# « publier » : l'installateur est aussi mis en ligne sur https://heraliz.fr/telecharger/HeraliZ-Launcher-Setup.exe
# (VM du site, dossier /var/www/telecharger), envoyé directement par la machine qui l'a fabriqué.
name: Launcher HeraliZ

on:
  push:
    branches: [main]
    paths: ["launcher/**", ".github/workflows/launcher.yml"]
  workflow_dispatch:
    inputs:
      publier:
        description: "Mettre l'installateur en ligne sur heraliz.fr/telecharger (sinon : seulement dans l'onglet Actions)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: launcher
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      - name: Tests et relecture du code
        run: npm test && npm run lint

      # la clé des jetons Spartan entre dans le launcher seulement ici (jamais dans Git) ; sans elle, pas de jeton
      - name: Installateur Windows
        env:
          SPARTAN_LAUNCHER_SECRET: ${{ secrets.SPARTAN_LAUNCHER_SECRET }}
        run: |
          npm run dist:win
          ls -l dist/*.exe
          # adresse de la mise à jour automatique, lue par le launcher installé (mise-a-jour.js)
          if ! grep -q "url: https://heraliz.fr/telecharger/" dist/win-unpacked/resources/app-update.yml; then
            echo "::error::app-update.yml absent ou sans l'adresse heraliz.fr/telecharger : le launcher ne pourrait pas se mettre à jour."
            exit 1
          fi

      # gardé 7 jours dans l'onglet Actions ; un quota d'artefacts plein ne bloque ni la fabrication ni la mise en ligne
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: launcher-windows
          path: launcher/dist/*.exe
          retention-days: 7

      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' && inputs.publier
        with:
          python-version: "3.12"

      # envoyé directement depuis cette machine (pas d'artefact entre deux tâches : il en dépendrait) ; nom fixe : le lien
      # du site ne change jamais. Puis latest.yml (version, empreinte, taille), lu par les launchers installés pour se
      # mettre à jour seuls. Mot de passe par variable d'environnement seulement, jamais dans une commande.
      - name: Mise en ligne sur heraliz.fr/telecharger
        if: github.event_name == 'workflow_dispatch' && inputs.publier
        env:
          SITE_SSH_HOTE: ${{ secrets.SITE_SSH_HOTE }}
          SITE_SSH_PORT: ${{ secrets.SITE_SSH_PORT }}
          SITE_SSH_UTILISATEUR: ${{ secrets.SITE_SSH_UTILISATEUR }}
          SITE_SSH_MDP: ${{ secrets.SITE_SSH_MDP }}
          PYTHONUTF8: "1"
        run: |
          if [ -z "$SITE_SSH_HOTE" ] || [ -z "$SITE_SSH_UTILISATEUR" ] || [ -z "$SITE_SSH_MDP" ]; then
            echo "::error::Secrets SITE_SSH_* manquants (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          shopt -s nullglob
          exe=(dist/*.exe)
          if [ "${#exe[@]}" -ne 1 ]; then echo "::error::Un seul installateur attendu, ${#exe[@]} trouvé(s)."; exit 1; fi
          python -m pip install --quiet --disable-pip-version-check paramiko==5.0.0
          INSTALLATEUR="${exe[0]}" python - <<'PY'
          import base64
          import datetime
          import hashlib
          import json
          import os
          import sys

          import paramiko

          DOSSIER = "/var/www/telecharger"
          NOM = "HeraliZ-Launcher-Setup.exe"
          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          try:
              client.connect(os.environ["SITE_SSH_HOTE"], port=int(os.environ.get("SITE_SSH_PORT") or 22),
                             username=os.environ["SITE_SSH_UTILISATEUR"], password=os.environ["SITE_SSH_MDP"],
                             timeout=20, banner_timeout=30, auth_timeout=30, allow_agent=False, look_for_keys=False)
          except Exception as erreur:
              print(f"::error::Connexion à la VM du site impossible : {type(erreur).__name__}")
              sys.exit(1)
          sftp = client.open_sftp()
          try:
              sftp.stat(DOSSIER)
          except OSError:
              print(f"::error::La VM du site n'est pas prête (dossier {DOSSIER}) : lancer le workflow « Site HeraliZ » avec « installer », puis relancer celui-ci.")
              sys.exit(1)
          # chaque fichier est envoyé sous un nom provisoire puis renommé d'un coup : jamais un fichier à moitié envoyé ;
          # l'installateur d'abord, latest.yml ensuite (il ne désigne jamais un installateur absent)
          def deposer(local, nom):
              provisoire = f"{DOSSIER}/.{nom}.envoi"
              sftp.put(local, provisoire, confirm=True)
              sftp.chmod(provisoire, 0o644)
              sftp.posix_rename(provisoire, f"{DOSSIER}/{nom}")

          installateur = os.environ["INSTALLATEUR"]
          with open(installateur, "rb") as f:
              empreinte = base64.b64encode(hashlib.sha512(f.read()).digest()).decode()
          taille = os.path.getsize(installateur)
          with open("package.json", encoding="utf-8") as f:
              version = json.load(f)["version"]
          date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.000Z")
          with open("latest.yml", "w", encoding="utf-8", newline="\n") as f:
              f.write(f"version: {version}\nfiles:\n  - url: {NOM}\n    sha512: {empreinte}\n    size: {taille}\n"
                      f"path: {NOM}\nsha512: {empreinte}\nreleaseDate: '{date}'\n")
          deposer(installateur, NOM)
          deposer("latest.yml", "latest.yml")
          sftp.close()
          client.close()
          print(f"Launcher {version} déposé dans {DOSSIER} ({NOM} et latest.yml)")
          PY
          URL=https://heraliz.fr/telecharger/HeraliZ-Launcher-Setup.exe
          taille=$(curl -fsSI --max-time 60 "$URL" | tr -d '\r' | awk 'tolower($1) == "content-length:" {print $2}')
          if [ "$taille" != "$(stat -c %s "${exe[0]}")" ]; then
            echo "::error::$URL ne donne pas l'installateur envoyé (taille ${taille:-inconnue})."
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          if ! curl -fsS --max-time 60 https://heraliz.fr/telecharger/latest.yml | grep -qx "version: $VERSION"; then
            echo "::error::https://heraliz.fr/telecharger/latest.yml n'annonce pas la version $VERSION : les launchers installés ne se mettront pas à jour."
            exit 1
          fi
          {
            echo "### Launcher $VERSION en ligne"
            echo "- $URL ($(( taille / 1048576 )) Mo)"
            echo "- les launchers déjà installés (1.6.0 et plus) se mettent à jour seuls à leur prochain démarrage"
          } >> "$GITHUB_STEP_SUMMARY"
