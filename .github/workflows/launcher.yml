# Launcher des joueurs (launcher/, voir CLAUDE.md section 8 ter), pour Windows, Mac et Linux.
# - À chaque changement de launcher/ sur main : tests, installateur Windows (gardé 7 jours dans l'onglet Actions, paquet
#   « launcher-windows », si le quota d'artefacts du dépôt le permet) et paquets Linux (fabriqués pour vérifier).
# - « Run workflow » : en plus, l'application Mac (lancée seulement à la main : sur un dépôt privé, une minute de machine
#   macOS en compte 10) ; les fichiers Mac et Linux sont gardés 3 jours dans l'onglet Actions (« launcher-mac »,
#   « launcher-linux »). Avec « publier », chaque machine met ses fichiers en ligne sur https://heraliz.fr/telecharger/
#   (VM du site, dossier /var/www/telecharger), avec le fichier de version lu par les launchers installés :
#     Windows : HeraliZ-Launcher-Setup.exe + latest.yml
#     Mac     : HeraliZ-Launcher.dmg et HeraliZ-Launcher-mac.zip + latest-mac.yml
#     Linux   : HeraliZ-Launcher.AppImage et HeraliZ-Launcher.deb + latest-linux.yml
#   Envoi direct depuis la machine qui a fabriqué les fichiers (launcher/ci/publier.py, pas d'artefact entre deux
#   tâches : il en dépendrait). Une plateforme en échec n'empêche pas les autres d'être mises en ligne.
name: Launcher HeraliZ

on:
  push:
    branches: [main]
    paths: ["launcher/**", ".github/workflows/launcher.yml"]
  workflow_dispatch:
    inputs:
      publier:
        description: "Mettre le launcher (Windows, Mac, Linux) en ligne sur heraliz.fr/telecharger (sinon : seulement dans l'onglet Actions)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: launcher
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      - name: Tests et relecture du code
        run: npm test && npm run lint

      # aucune clé dans le launcher : les jetons de lancement de Spartan sont signés par le site (mode B)
      - name: Installateur Windows
        run: |
          rm -f app/assets/js/spartan-cle.json
          npm run dist:win
          ls -l dist/*.exe
          # adresse de la mise à jour automatique, lue par le launcher installé (mise-a-jour.js)
          if ! grep -q "url: https://heraliz.fr/telecharger/" dist/win-unpacked/resources/app-update.yml; then
            echo "::error::app-update.yml absent ou sans l'adresse heraliz.fr/telecharger : le launcher ne pourrait pas se mettre à jour."
            exit 1
          fi

      # gardé 7 jours dans l'onglet Actions ; un quota d'artefacts plein ne bloque ni la fabrication ni la mise en ligne
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: launcher-windows
          path: launcher/dist/*.exe
          retention-days: 7

      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' && inputs.publier
        with:
          python-version: "3.12"

      # nom fixe : le lien du site ne change jamais. Puis latest.yml (version, empreinte, taille), lu par les launchers
      # installés pour se mettre à jour seuls. Mot de passe par variable d'environnement seulement, jamais dans une commande.
      - name: Mise en ligne sur heraliz.fr/telecharger
        if: github.event_name == 'workflow_dispatch' && inputs.publier
        env:
          SITE_SSH_HOTE: ${{ secrets.SITE_SSH_HOTE }}
          SITE_SSH_PORT: ${{ secrets.SITE_SSH_PORT }}
          SITE_SSH_UTILISATEUR: ${{ secrets.SITE_SSH_UTILISATEUR }}
          SITE_SSH_MDP: ${{ secrets.SITE_SSH_MDP }}
          LAUNCHER_SIGN_KEY: ${{ secrets.LAUNCHER_SIGN_KEY }}
          PYTHONUTF8: "1"
        run: |
          shopt -s nullglob
          exe=(dist/*.exe)
          if [ "${#exe[@]}" -ne 1 ]; then echo "::error::Un seul installateur attendu, ${#exe[@]} trouvé(s)."; exit 1; fi
          python -m pip install --quiet --disable-pip-version-check paramiko==5.0.0
          python ci/publier.py latest.yml "HeraliZ-Launcher-Setup.exe=${exe[0]}"

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: AppImage et paquet .deb
        run: |
          rm -f app/assets/js/spartan-cle.json
          npm run dist:linux
          ls -l dist/HeraliZ-Launcher.AppImage dist/HeraliZ-Launcher.deb
          if ! grep -q "url: https://heraliz.fr/telecharger/" dist/linux-unpacked/resources/app-update.yml; then
            echo "::error::app-update.yml absent ou sans l'adresse heraliz.fr/telecharger : le launcher ne pourrait pas se mettre à jour."
            exit 1
          fi

      # gardés 3 jours, seulement sur « Run workflow » (place des artefacts du dépôt, partagée avec les mods du serveur)
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          name: launcher-linux
          path: |
            launcher/dist/HeraliZ-Launcher.AppImage
            launcher/dist/HeraliZ-Launcher.deb
          retention-days: 3

      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' && inputs.publier
        with:
          python-version: "3.12"

      - name: Mise en ligne sur heraliz.fr/telecharger
        if: github.event_name == 'workflow_dispatch' && inputs.publier
        env:
          SITE_SSH_HOTE: ${{ secrets.SITE_SSH_HOTE }}
          SITE_SSH_PORT: ${{ secrets.SITE_SSH_PORT }}
          SITE_SSH_UTILISATEUR: ${{ secrets.SITE_SSH_UTILISATEUR }}
          SITE_SSH_MDP: ${{ secrets.SITE_SSH_MDP }}
          LAUNCHER_SIGN_KEY: ${{ secrets.LAUNCHER_SIGN_KEY }}
          PYTHONUTF8: "1"
        run: |
          python -m pip install --quiet --disable-pip-version-check paramiko==5.0.0
          python ci/publier.py latest-linux.yml \
            HeraliZ-Launcher.AppImage=dist/HeraliZ-Launcher.AppImage \
            HeraliZ-Launcher.deb=dist/HeraliZ-Launcher.deb

  mac:
    # seulement à la main (« Run workflow ») : voir en tête
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm test

      # application universelle (Mac Intel et Apple Silicon), signée « ad hoc » (pas de certificat Apple) :
      # macOS demande une autorisation au premier lancement (launcher/README.md)
      - name: Application Mac
        run: |
          rm -f app/assets/js/spartan-cle.json
          npm run dist:mac
          ls -l dist/HeraliZ-Launcher.dmg dist/HeraliZ-Launcher-mac.zip
          APP="dist/mac-universal/HeraliZ Launcher.app"
          if ! grep -q "url: https://heraliz.fr/telecharger/" "$APP/Contents/Resources/app-update.yml"; then
            echo "::error::app-update.yml absent ou sans l'adresse heraliz.fr/telecharger : le launcher ne verrait pas les nouvelles versions."
            exit 1
          fi
          archs=$(lipo -archs "$APP/Contents/MacOS/HeraliZ Launcher")
          case "$archs" in
            *x86_64*arm64*|*arm64*x86_64*) echo "Architectures : $archs" ;;
            *) echo "::error::Application non universelle ($archs)."; exit 1 ;;
          esac
          # sans signature valide, un Mac Apple Silicon refuse de lancer l'application
          codesign --verify --deep "$APP"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: launcher-mac
          path: launcher/dist/HeraliZ-Launcher.dmg
          retention-days: 3

      - uses: actions/setup-python@v5
        if: inputs.publier
        with:
          python-version: "3.12"

      # zip d'abord (fichier principal de latest-mac.yml, comme electron-builder), puis l'image disque à installer
      - name: Mise en ligne sur heraliz.fr/telecharger
        if: inputs.publier
        env:
          SITE_SSH_HOTE: ${{ secrets.SITE_SSH_HOTE }}
          SITE_SSH_PORT: ${{ secrets.SITE_SSH_PORT }}
          SITE_SSH_UTILISATEUR: ${{ secrets.SITE_SSH_UTILISATEUR }}
          SITE_SSH_MDP: ${{ secrets.SITE_SSH_MDP }}
          LAUNCHER_SIGN_KEY: ${{ secrets.LAUNCHER_SIGN_KEY }}
          PYTHONUTF8: "1"
        run: |
          python -m pip install --quiet --disable-pip-version-check paramiko==5.0.0
          python ci/publier.py latest-mac.yml \
            HeraliZ-Launcher-mac.zip=dist/HeraliZ-Launcher-mac.zip \
            HeraliZ-Launcher.dmg=dist/HeraliZ-Launcher.dmg
