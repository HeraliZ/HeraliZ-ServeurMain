# Contrôle des branches de travail (toutes sauf main) : fabrique les mods modifiés et lance les contrôles possibles sans
# Minecraft, exactement comme la mise en ligne, mais N'ENVOIE RIEN au Ptero (aucun secret du Ptero ici).
# Les jars fabriqués sont gardés 3 jours dans l'onglet Actions (paquets « test-mods-serveur » et « test-mods-client ») :
# le propriétaire peut les essayer en jeu avant de faire passer la branche sur main.
name: Contrôle de branche

on:
  push:
    branches-ignore: [main]
    paths: ["modules/**", "serveur/**", "client/**", "outils/**", "libs/**", "gradle/**", "settings.gradle", "build.gradle", "gradle.properties", ".github/workflows/**"]

permissions:
  contents: read

concurrency:
  group: branche-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fabrication SANS AUCUN secret (21/11, audit : comme le job « fabriquer » de serveur.yml) : avant, le secret
  # NOMS_INTERDITS était dans l'environnement de tout ce job, donc de Gradle et de ses dépendances (code d'autres auteurs),
  # et son fichier était écrit pendant que le démon Gradle tournait encore (il ne s'arrête qu'à la fin du job). Les jars
  # passent au job « controles » par le cache jars-<commit>.
  fabrication:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # caches de la mise en ligne (main) : seuls les mods modifiés sur la branche sont refabriqués
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('settings.gradle', 'build.gradle', 'gradle.properties', 'gradle/*.gradle', 'modules/*/build.gradle') }}
          restore-keys: gradle-

      - uses: actions/cache@v4
        with:
          path: modules/*/build/libs
          key: jars-${{ github.sha }}
          restore-keys: jars-

      - name: Fabriquer les mods modifiés
        run: python outils/sans_secrets.py python outils/construire.py --si-change

      # copies à télécharger dans l'onglet Actions : un quota d'artefacts plein (« Artifact storage quota has been
      # hit ») ne doit pas bloquer la suite
      - name: Garder les jars serveur de la branche
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: test-mods-serveur
          path: livraison/mods serveur/*-serveur.jar
          retention-days: 3

      - name: Garder les jars joueurs de la branche
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: test-mods-client
          path: |
            livraison/mods client/*-client.jar
            livraison/mods client/heraliz_interface-*.jar
          retention-days: 3

  # Contrôles (GeckoLib, noms perso, langues, économie...) sur les jars de « fabrication », dans une machine neuve où
  # Gradle n'a jamais tourné (21/11, audit) : le seul secret de ce workflow (NOMS_INTERDITS, liste des noms perso) n'arrive
  # que dans l'étape qui écrit son fichier. Même ordre que la mise en ligne (job « serveur » de serveur.yml).
  controles:
    needs: fabrication
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # javac : essais hors du jeu de certains contrôles (conteneurs allégés, listes envoyées par différences), comme avant
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Jars fabriqués (cache du job « fabrication »)
        uses: actions/cache/restore@v4
        with:
          path: modules/*/build/libs
          key: jars-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Ranger les jars fabriqués
        run: python outils/construire.py --sans-build

      # JOML (bibliothèque d'un autre auteur, lancée par modules/loot/outils/lod_props.py, qui la prend par JOML_JAR au lieu
      # de la télécharger lui-même) : téléchargée ici depuis Maven Central et refusée si son empreinte SHA-256 n'est pas
      # celle-ci (21/11, validation : elle tourne pendant que le fichier des noms perso est sur le disque). Même étape dans
      # le job « controles » de serveur.yml.
      - name: JOML (empreinte vérifiée)
        run: |
          mkdir -p "$RUNNER_TEMP/joml"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/joml/joml-1.10.5.jar" https://repo1.maven.org/maven2/org/joml/joml/1.10.5/joml-1.10.5.jar
          echo "cac9f22f83a7aa33eebda73c16ff5261e3cb4911b6bafcf4c79ea486099d0c9a  $RUNNER_TEMP/joml/joml-1.10.5.jar" | sha256sum -c -

      - name: Noms interdits
        env:
          NOMS_INTERDITS: ${{ secrets.NOMS_INTERDITS }}
        run: |
          if [ -n "$NOMS_INTERDITS" ]; then
            printf '%s\n' "$NOMS_INTERDITS" > outils/noms_interdits.txt
          else
            echo "::warning::Secret NOMS_INTERDITS absent : contrôle des noms perso sauté (docs/MISE_EN_LIGNE_GITHUB.md, section 7)."
          fi

      - name: Contrôles (GeckoLib, noms perso, langues)
        env:
          JOML_JAR: ${{ runner.temp }}/joml/joml-1.10.5.jar
        run: python outils/verifier.py --sans-split

  # Contrôles d'images (21/11, choix du propriétaire) : logos des icônes, icônes des accessoires, chargeurs 3D,
  # accessoires tenus en main, placement des accessoires sur les armes. Ils lisent les images avec numpy et Pillow (code
  # d'autres auteurs) : installés ici, dans un job À PART sans aucun secret, versions et empreintes figées
  # (outils/requis_images.txt, roues seulement). En même temps que la fabrication : aucune attente de plus.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: numpy et Pillow (versions figées)
        run: |
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r outils/requis_images.txt

      - name: Contrôles d'images
        run: python outils/verifier.py --images
