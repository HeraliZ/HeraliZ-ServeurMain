# Extractions de la carte : liste des zones d'extraction fixes posées en jeu (/extraction create), carte de leur
# répartition, couverture de la carte et points proposés pour combler les trous (outils/extractions_carte.py).
# LECTURE SEULE sur le Ptero : server.properties (nom du monde), level.dat, data/heraliz_extraction_zones.dat (registre
# des zones du mod HeraliZ Extraction), config/heraliz_extraction-common.toml et, si « hauteurs » est coché, les
# fichiers de régions du monde principal (*.mca de region/, pour les hauteurs) sont COPIÉS sur la machine de GitHub ;
# rien n'est jamais écrit, renommé ni supprimé sur le Ptero. Le monde n'est pas touché (CLAUDE.md, règle 10).
# Le compte rendu (rapport.md, zones.json, carte_extractions.png, couverture.png) est enregistré dans
# monde/extractions/ sur la BRANCHE DE TRAVAIL seulement (jamais main). Part d'une branche de travail quand ce fichier
# ou l'outil change, ou par « Run workflow ».
name: Extractions de la carte

on:
  workflow_dispatch:
    inputs:
      hauteurs:
        description: "Copier les régions du monde (lourd, environ 260 Mo) : points proposés sur sol à sec, à ciel ouvert, avec leur hauteur"
        type: boolean
        default: true
      trou:
        description: "Endroit mal couvert : à plus de tant de blocs de toute extraction"
        default: "600"
      propositions:
        description: "Nombre de points proposés au plus"
        default: "10"
      marge:
        description: "Pas de point proposé à moins de tant de blocs du bord de la carte"
        default: "200"
  push:
    branches-ignore: [main]
    paths: [".github/workflows/extractions.yml", "outils/extractions_carte.py"]

permissions:
  contents: write   # seulement pour enregistrer le compte rendu sur la branche de travail

concurrency:
  group: extractions-carte
  cancel-in-progress: false

jobs:
  extractions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PTERO_SFTP_HOST: ${{ secrets.PTERO_SFTP_HOST }}
      PTERO_SFTP_PORT: ${{ secrets.PTERO_SFTP_PORT }}
      PTERO_SFTP_USER: ${{ secrets.PTERO_SFTP_USER }}
      PTERO_SFTP_PASSWORD: ${{ secrets.PTERO_SFTP_PASSWORD }}
      PYTHONIOENCODING: utf-8
      HAUTEURS: ${{ github.event_name == 'push' || inputs.hauteurs }}
      TROU: ${{ inputs.trou || '600' }}
      PROPOSITIONS: ${{ inputs.propositions || '10' }}
      MARGE: ${{ inputs.marge || '200' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          python -m pip install --quiet numpy pillow
          for v in "$TROU" "$PROPOSITIONS" "$MARGE"; do
            case "$v" in ""|*[!0-9]*) echo "::error::Nombre refusé : « $v »"; exit 1;; esac
          done

      - name: Accès au Ptero
        run: |
          if [ -z "$PTERO_SFTP_HOST" ]; then echo "::error::Secrets du SFTP du Ptero absents."; exit 1; fi
          HOTE="${PTERO_SFTP_HOST#sftp://}"
          HOTE="${HOTE%%/*}"
          PORT="${PTERO_SFTP_PORT:-}"
          case "$HOTE" in *:*) [ -z "$PORT" ] && PORT="${HOTE##*:}"; HOTE="${HOTE%%:*}";; esac
          PORT="${PORT:-2022}"
          echo "::add-mask::$HOTE"
          echo "PTERO_HOTE=$HOTE" >> "$GITHUB_ENV"
          echo "PTERO_PORT=$PORT" >> "$GITHUB_ENV"
          echo "LFTP_REGLAGES=set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; set net:reconnect-interval-base 5; set net:limit-total-rate 15M; set xfer:clobber on;" >> "$GITHUB_ENV"

      # Petits fichiers, COPIÉS en lecture seule ; le nom du monde vient du server.properties du Ptero (dayz_map)
      - name: Zones d'extraction et réglages du monde en service (lecture seule)
        run: |
          l() { lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "$LFTP_REGLAGES $1 bye" < /dev/null; }
          l "set cmd:fail-exit yes; get /server.properties -o server_ptero.properties;"
          MONDE=$(tr -d '\r' < server_ptero.properties | sed -n 's/^level-name=//p' | head -n 1)
          case "$MONDE" in ""|.|..|*[!A-Za-z0-9_.-]*) echo "::error::Nom du monde illisible dans le server.properties du Ptero."; exit 1;; esac
          echo "Monde en service : $MONDE"
          echo "MONDE=$MONDE" >> "$GITHUB_ENV"
          mkdir -p "copie/$MONDE/data" copie/config
          l "get /$MONDE/level.dat -o copie/$MONDE/level.dat;" > /dev/null 2>&1 || echo "(pas de level.dat : zones ouvertes inconnues)"
          l "get /config/heraliz_extraction-common.toml -o copie/config/heraliz_extraction-common.toml;" > /dev/null 2>&1 \
            || echo "(pas de config/heraliz_extraction-common.toml sur le Ptero : réglages du mod par défaut)"
          if l "get /$MONDE/data/heraliz_extraction_zones.dat -o copie/$MONDE/data/heraliz_extraction_zones.dat;" > /dev/null 2>&1; then
            echo "ZONES=copie/$MONDE/data/heraliz_extraction_zones.dat" >> "$GITHUB_ENV"
          else
            echo "::warning::Aucune zone d'extraction posée dans $MONDE (pas de data/heraliz_extraction_zones.dat) : les points proposés couvrent toute la carte."
            echo '{"zones": []}' > copie/zones_vides.json
            echo "ZONES=copie/zones_vides.json" >> "$GITHUB_ENV"
          fi
          ls -la "copie/$MONDE" "copie/$MONDE/data" copie/config

      # Seulement les fichiers de régions de blocs du monde principal (*.mca de region/) : ni entités, ni joueurs
      - name: Régions du monde (lecture seule, pour les hauteurs)
        if: env.HAUTEURS == 'true'
        continue-on-error: true
        run: |
          lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" \
            -e "$LFTP_REGLAGES mirror --parallel=2 --include-glob '*.mca' /$MONDE/region copie/$MONDE/region; bye" < /dev/null
          find "copie/$MONDE/region" -name '*.mca' | wc -l
          du -sh "copie/$MONDE/region" || true

      - name: Liste, carte et points proposés
        run: |
          ARGS="--sortie extractions --config copie/config/heraliz_extraction-common.toml --level copie/$MONDE/level.dat"
          ARGS="$ARGS --trou $TROU --propositions $PROPOSITIONS --marge $MARGE"
          if [ -n "$(find "copie/$MONDE/region" -name '*.mca' 2>/dev/null | head -n 1)" ]; then
            ARGS="$ARGS --monde copie/$MONDE"
          fi
          python outils/extractions_carte.py "$ZONES" $ARGS
          ls -la extractions

      - name: Résumé
        if: always()
        run: |
          if [ -f extractions/rapport.md ]; then
            # les images ne s'affichent pas dans le résumé : elles sont dans le paquet et sur la branche
            sed 's#^!\[.*\](.*)$#(image dans le paquet « extractions-carte » et dans monde/extractions/ de la branche)#' extractions/rapport.md >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Rien n'a été modifié sur le Ptero." >> "$GITHUB_STEP_SUMMARY"

      - name: Garder le compte rendu
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: extractions-carte
          path: extractions/
          retention-days: 7
          if-no-files-found: ignore

      - name: Enregistrer sur la branche de travail
        if: github.ref_name != 'main' && hashFiles('extractions/rapport.md') != ''
        run: |
          R=monde/extractions
          rm -rf "$R" && mkdir -p "$R"
          cp extractions/rapport.md extractions/zones.json "$R/"
          find extractions -maxdepth 1 -name '*.png' -size -2M -exec cp {} "$R/" \;
          git config user.name "HeraliZ"
          git config user.email "heraliz@users.noreply.github.com"
          git add -A "$R"
          if git diff --cached --quiet; then echo "Rien de nouveau à enregistrer."; exit 0; fi
          git commit -q -m "Extractions de la carte : liste, carte et points proposés (lecture seule du monde en service)"
          for i in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:refs/heads/$GITHUB_REF_NAME" && break
            sleep 5
          done
          echo "Enregistré sur la branche $GITHUB_REF_NAME : $R/" >> "$GITHUB_STEP_SUMMARY"
