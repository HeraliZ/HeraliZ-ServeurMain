# Grotte du spawn : retrouve, dans l'ancienne grande carte mise de côté sur le Ptero le 11/10, la grotte du spawn (celle
# de la cinématique : voie, lanternes, épave du train) et la recopie dans le monde du spawn (heralisz:spawn).
# LECTURE SEULE sur le Ptero : level.dat, quelques fichiers de data/ et seulement les régions utiles sont COPIÉS sur la
# machine de GitHub (débit limité) ; rien n'est jamais écrit, renommé ni supprimé sur le Ptero.
#   1. indices : point d'apparition, réglages de la cinématique gardés dans le monde (data/heraliz_cinematique.dat),
#      réveil par défaut du mod (-61 265 2), dimensions ;
#   2. analyse des régions autour de chaque point (outils/recherche_grotte.py) : cavités fermées, voie, lanternes,
#      barrières de l'épave, rendus (vue de dessus, coupes) ;
#   3. si la grotte n'est pas trouvée sûrement : balayage de TOUT le premier monde (régions copiées par paquets, lues
#      puis effacées), amas d'indices, puis analyse des meilleurs amas ;
#   4. grotte trouvée sûrement (ou zone donnée à la main) : copie de la zone par outils/monde_spawn.py copier, décalée
#      pour que le réveil de la cinématique tombe en -61 265 2, dans monde/spawn/ (dossier que prend la case
#      « deposer_spawn » du workflow « Serveur HeraliZ »).
# Le compte rendu (rapport.md et petites images) est enregistré dans monde/spawn_recherche/, avec monde/spawn/ s'il a été
# fait, sur la BRANCHE DE TRAVAIL seulement (jamais main). Part d'une branche de travail quand ce fichier ou
# l'outil change, ou par « Run workflow » (sur une branche de travail).
name: Grotte du spawn

on:
  workflow_dispatch:
    inputs:
      mondes:
        description: "Dossiers de la racine du Ptero où chercher (espaces entre eux ; le premier est balayé en entier si besoin)"
        default: "dayz_map_ancien_2026-10-11_00h46 HeraliZ_ancien_2026-10-11_00h26"
      balayage:
        description: "Balayer tout le premier monde même si la grotte est trouvée"
        type: boolean
        default: false
      zone:
        description: "Copie forcée : zone « X0 Y0 Z0 X1 Y1 Z1 » du premier monde (vide = automatique)"
        default: ""
      decalage:
        description: "Avec la zone forcée : décalage « DX DY DZ » (vide = 0 0 0)"
        default: ""
      reveil:
        description: "Avec la zone forcée : point de réveil dans la copie, APRÈS décalage (vide = -61 265 2)"
        default: ""
      dimension:
        description: "Avec la zone forcée : dimension du premier monde"
        default: "minecraft:overworld"
  push:
    branches-ignore: [main]
    paths: [".github/workflows/grotte_spawn.yml", "outils/recherche_grotte.py"]

permissions:
  contents: write   # seulement pour enregistrer le compte rendu et la grotte sur la branche de travail

concurrency:
  group: grotte-spawn
  cancel-in-progress: false

jobs:
  grotte:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PTERO_SFTP_HOST: ${{ secrets.PTERO_SFTP_HOST }}
      PTERO_SFTP_PORT: ${{ secrets.PTERO_SFTP_PORT }}
      PTERO_SFTP_USER: ${{ secrets.PTERO_SFTP_USER }}
      PTERO_SFTP_PASSWORD: ${{ secrets.PTERO_SFTP_PASSWORD }}
      PYTHONIOENCODING: utf-8
      MONDES: ${{ inputs.mondes || 'dayz_map_ancien_2026-10-11_00h46 HeraliZ_ancien_2026-10-11_00h26' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          python -m pip install --quiet numpy scipy pillow

      - name: Accès au Ptero
        run: |
          if [ -z "$PTERO_SFTP_HOST" ]; then echo "::error::Secrets du SFTP du Ptero absents."; exit 1; fi
          HOTE="${PTERO_SFTP_HOST#sftp://}"
          HOTE="${HOTE%%/*}"
          PORT="${PTERO_SFTP_PORT:-}"
          case "$HOTE" in *:*) [ -z "$PORT" ] && PORT="${HOTE##*:}"; HOTE="${HOTE%%:*}";; esac
          PORT="${PORT:-2022}"
          echo "::add-mask::$HOTE"
          echo "PTERO_HOTE=$HOTE" >> "$GITHUB_ENV"
          echo "PTERO_PORT=$PORT" >> "$GITHUB_ENV"
          echo "LFTP_REGLAGES=set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; set net:reconnect-interval-base 5; set net:limit-total-rate 15M; set xfer:clobber on;" >> "$GITHUB_ENV"
          for M in $MONDES; do
            case "$M" in ""|.|..|*[!A-Za-z0-9_.-]*) echo "::error::Nom de monde refusé : « $M »"; exit 1;; esac
          done

      # level.dat, listes (data/, régions, dimensions) et les fichiers de data/ qui nous concernent ; rien d'autre
      - name: Petits fichiers des mondes (lecture seule)
        run: |
          l() { lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" -e "$LFTP_REGLAGES $1 bye" < /dev/null; }
          for M in $MONDES; do
            D="copie/$M"
            mkdir -p "$D/data"
            l "get /$M/level.dat -o $D/level.dat;" > /dev/null 2>&1 || echo "($M : pas de level.dat)"
            l "cls -1 /$M/data/;" 2> /dev/null | sed 's#.*/##' > "$D/_liste_data.txt" || true
            l "mirror --no-empty-dirs -I 'heral*' -I 'idcounts.dat' /$M/data $D/data;" > /dev/null 2>&1 || true
            l "cls -1 -s --block-size=1 /$M/region/;" > "$D/_liste_regions.txt" 2> /dev/null || true
            grep -q '\.mca' "$D/_liste_regions.txt" || l "cls -1 /$M/region/;" > "$D/_liste_regions.txt" 2> /dev/null || true
            : > "$D/_liste_dimensions.txt"
            for ns in $(l "cls -1 /$M/dimensions/;" 2> /dev/null | sed 's#/$##; s#.*/##'); do
              for nom in $(l "cls -1 /$M/dimensions/$ns/;" 2> /dev/null | sed 's#/$##; s#.*/##'); do
                echo "$ns/$nom" >> "$D/_liste_dimensions.txt"
              done
            done
            echo "$M : $(grep -c '\.mca' "$D/_liste_regions.txt" || true) régions, data : $(wc -l < "$D/_liste_data.txt") fichiers, dimensions : $(tr '\n' ' ' < "$D/_liste_dimensions.txt")"
          done
          du -sh copie/* || true

      - name: Indices
        run: |
          ARGS=""
          for M in $MONDES; do ARGS="$ARGS copie/$M"; done
          python outils/recherche_grotte.py indices $ARGS --sortie recherche --prefixe /
          cat recherche/cibles.lftp

      - name: Régions autour des points (lecture seule)
        run: |
          lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" \
            -e "$LFTP_REGLAGES source recherche/cibles.lftp; bye" < /dev/null || echo "(certaines régions manquent sur le Ptero)"
          find copie -name '*.mca' | wc -l
          du -sh copie/* || true

      - name: Analyse autour des points
        run: |
          python outils/recherche_grotte.py analyser --candidats recherche/candidats.json --sortie recherche
          cat recherche/copie.env

      # Balayage de tout le premier monde, par paquets de 30 régions (copiées, lues, effacées) : seulement si la grotte
      # n'a pas été trouvée sûrement autour des points, ou sur demande. Un échec ici ne retient pas le compte rendu.
      - name: Balayage du premier monde
        id: balayage
        continue-on-error: true
        timeout-minutes: 200
        run: |
          . recherche/copie.env
          if [ "$TROUVEE" = "oui" ] && [ "${{ inputs.balayage }}" != "true" ]; then
            echo "Grotte trouvée autour des points : pas de balayage."
            exit 0
          fi
          M="${MONDES%% *}"
          grep -o 'r\.-\?[0-9]*\.-\?[0-9]*\.mca' "copie/$M/_liste_regions.txt" | sort -u > a_balayer.txt || true
          N=$(wc -l < a_balayer.txt)
          echo "$M : $N régions à balayer"
          [ "$N" -gt 0 ] || { echo "::warning::Liste des régions de $M vide : pas de balayage."; exit 0; }
          split -l 30 a_balayer.txt paquet_
          DEBUT=$(date +%s); FAIT=0
          for P in paquet_*; do
            rm -rf balai && mkdir balai
            FILTRES=$(sed "s/.*/-I '&'/" "$P" | tr '\n' ' ')
            lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" \
              -e "$LFTP_REGLAGES mirror -P 3 --no-empty-dirs $FILTRES /$M/region balai; bye" < /dev/null || echo "(paquet $P incomplet)"
            python outils/recherche_grotte.py balayer balai --etat recherche/balayage.jsonl
            FAIT=$((FAIT + $(wc -l < "$P")))
            echo "[balayage] $FAIT / $N régions, $(( $(date +%s) - DEBUT )) s"
          done
          rm -rf balai paquet_*
          python outils/recherche_grotte.py synthese --etat recherche/balayage.jsonl --monde "copie/$M" --prefixe "/$M" \
            --sortie recherche --nombre 4
          lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" \
            -e "$LFTP_REGLAGES source recherche/cibles_balayage.lftp; bye" < /dev/null || true
          python outils/recherche_grotte.py analyser --candidats recherche/candidats_balayage.json --sortie recherche
          cat recherche/copie.env

      - name: Copie de la grotte dans le monde du spawn
        id: copie
        env:
          ZONE_FORCEE: ${{ inputs.zone }}
          DECALAGE_FORCE: ${{ inputs.decalage }}
          REVEIL_FORCE: ${{ inputs.reveil }}
          DIM_FORCEE: ${{ inputs.dimension || 'minecraft:overworld' }}
        run: |
          . recherche/copie.env
          M="${MONDES%% *}"
          if [ -n "$ZONE_FORCEE" ]; then
            ZONE="$ZONE_FORCEE"; DECALAGE="${DECALAGE_FORCE:-0 0 0}"; REVEIL="${REVEIL_FORCE:--61 265 2}"
            MONDE_SOURCE="copie/$M"; DIM_SOURCE="$DIM_FORCEE"; CONFIANCE="zone donnée à la main"
            for v in $ZONE $DECALAGE $REVEIL; do case "$v" in ""|*[!0-9-]*) echo "::error::Nombre refusé : « $v »"; exit 1;; esac; done
            python outils/recherche_grotte.py cibles --monde "copie/$M" --prefixe "/$M" --dimension "$DIM_SOURCE" --zone $ZONE --sortie zone.lftp
            lftp -u "$PTERO_SFTP_USER,$PTERO_SFTP_PASSWORD" -p "$PTERO_PORT" "sftp://$PTERO_HOTE" \
              -e "$LFTP_REGLAGES source zone.lftp; bye" < /dev/null || true
          elif [ "$TROUVEE" != "oui" ]; then
            {
              echo "## Pas de copie"
              echo
              if [ "$TROUVEE" = "faible" ]; then
                echo "Une cavité ressemble à la grotte (\`$CHOIX\`, zone \`$ZONE\`), sans certitude : regarder les rendus, puis relancer avec « Run workflow », zone \`$ZONE\`, décalage \`$DECALAGE\`, réveil \`$REVEIL\` (ou d'autres valeurs)."
              else
                echo "Grotte non trouvée : voir les indices et les rendus ci-dessus. Une zone se donne à la main par « Run workflow » (zone, décalage, réveil)."
              fi
            } >> recherche/rapport.md
            exit 0
          fi
          python outils/monde_spawn.py copier "$MONDE_SOURCE" --zone $ZONE --dimension "$DIM_SOURCE" --decalage $DECALAGE \
            --reveil $REVEIL --sortie spawn_copie --rendus recherche/rendus_spawn | tee copie.log
          test -n "$(find spawn_copie/spawn/region -name '*.mca' 2>/dev/null)" || { echo "::error::Copie vide : rien n'est enregistré."; exit 1; }
          rm -rf monde/spawn
          mkdir -p monde
          cp -r spawn_copie/spawn monde/spawn
          {
            echo "## Copie dans le monde du spawn"
            echo
            echo "Source : \`$MONDE_SOURCE\` (\`$DIM_SOURCE\`), zone \`$ZONE\`, décalage \`$DECALAGE\`, réveil \`$REVEIL\` ($CONFIANCE)."
            echo
            echo '```'
            grep '^\[spawn\]' copie.log || true
            echo '```'
            echo
            echo "Fichiers dans \`monde/spawn/\` ($(find monde/spawn -name '*.mca' | wc -l) fichiers de régions, $(du -sk monde/spawn | cut -f1) Ko) : c'est ce que dépose la case « deposer_spawn » du workflow « Serveur HeraliZ » une fois la branche sur main. Rendus : \`rendus_spawn/\`."
          } >> recherche/rapport.md
          echo "copie=oui" >> "$GITHUB_OUTPUT"

      - name: Résumé
        if: always()
        run: |
          [ -f recherche/rapport.md ] && cat recherche/rapport.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Rien n'a été modifié sur le Ptero." >> "$GITHUB_STEP_SUMMARY"

      - name: Garder tout le compte rendu
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: grotte-spawn
          path: |
            recherche/
            spawn_copie/
          retention-days: 7
          if-no-files-found: ignore

      # Compte rendu (rapport.md, résultat, petites images) et grotte copiée : enregistrés sur la branche de travail.
      - name: Enregistrer sur la branche de travail
        if: always() && github.ref_name != 'main' && hashFiles('recherche/rapport.md') != ''
        run: |
          R=monde/spawn_recherche
          rm -rf "$R" && mkdir -p "$R/rendus"
          cp recherche/rapport.md "$R/"
          [ -f recherche/resultat.json ] && cp recherche/resultat.json "$R/"
          find recherche/rendus recherche/rendus_spawn -name '*.png' -size -600k -exec cp {} "$R/rendus/" \; 2> /dev/null || true
          sed -i 's#`rendus_spawn/#`rendus/#g' "$R/rapport.md"
          git config user.name "HeraliZ"
          git config user.email "heraliz@users.noreply.github.com"
          git add -A "$R"
          [ -d monde/spawn ] && git add -A monde/spawn
          if git diff --cached --quiet; then echo "Rien de nouveau à enregistrer."; exit 0; fi
          if [ "${{ steps.copie.outputs.copie }}" = "oui" ]; then
            MSG="Monde du spawn : grotte recopiée de l'ancienne carte (lecture seule), compte rendu de la recherche"
          else
            MSG="Grotte du spawn : compte rendu de la recherche dans l'ancienne carte (lecture seule)"
          fi
          git commit -q -m "$MSG"
          for i in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:refs/heads/$GITHUB_REF_NAME" && break
            sleep 5
          done
          echo "Enregistré sur la branche $GITHUB_REF_NAME : $R/$( [ -d monde/spawn ] && echo ' et monde/spawn/')" >> "$GITHUB_STEP_SUMMARY"
