// Spartan AntiCheat (HeraliZ), coupé client / serveur (méthode : docs/METHODE_CLIENT_SERVEUR.md).
//   commun  (sourceSets.main, src/commun)  : le @Mod, les paquets réseau, le format des rapports, l'empreinte ;
//   client  (src/client)                   : ce qui tourne chez le joueur (envoi des infos, contrôle d'intégrité) ;
//   serveur (src/serveur)                  : TOUTES les détections, l'anti-ESP, les bans, la config, les Mixins.
// Trois jars réobfusqués :
//   -client  (commun + client)            pour les joueurs : aucune détection serveur dedans (rien à étudier) ;
//   -serveur (commun + serveur)           pour le Ptero, avec une COPIE du jar -client (META-INF/spartan/client.bin) :
//                                         le serveur calcule sur elle les réponses attendues au défi d'intégrité ;
//   -complet (tout)                       pour le solo.
// Le jar joueur et le jar serveur doivent venir de la MÊME fabrication (sinon le défi échoue pour tout le monde).
// Mixins : uniquement côté serveur, table de correspondance écrite à la main (src/serveur/resources/spartan.refmap.json,
// noms SRG), donc pas de MixinGradle.
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = jar_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    // Aucune configuration de lancement : le propriétaire teste lui-même en jeu.
}

// ------------------------------------------------------------------ les ensembles de sources
sourceSets {
    main {                                   // = « commun »
        java.srcDirs = ['src/commun/java']
        resources.srcDirs = ['src/commun/resources']
    }
    client {
        java.srcDirs = ['src/client/java']
        resources.srcDirs = ['src/client/resources']
        compileClasspath += main.output + main.compileClasspath
    }
    serveur {
        java.srcDirs = ['src/serveur/java']
        resources.srcDirs = ['src/serveur/resources']
        compileClasspath += main.output + main.compileClasspath
    }
    test {
        java.srcDirs = ['src/test/java']
        compileClasspath += main.output + client.output + serveur.output + main.compileClasspath
        runtimeClasspath += main.output + client.output + serveur.output + main.runtimeClasspath
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var props = [minecraft_version_range: minecraft_version_range, forge_version_range: forge_version_range,
                 loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
                 mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
                 mod_description: mod_description]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:-removal', '-Xlint:-deprecation', '-Xmaxerrs', '1000']
}

// Jars identiques d'une fabrication à l'autre (mêmes sources = mêmes octets) : ordre et dates fixes.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// ------------------------------------------------------------------ les trois jars
def manifeste = [
        'Specification-Title'   : jar_name,
        'Specification-Vendor'  : mod_authors,
        'Specification-Version' : '1',
        'Implementation-Title'  : project.name,
        'Implementation-Version': mod_version,
        'Implementation-Vendor' : mod_authors,
]
def manifesteMixins = manifeste + ['MixinConfigs': 'spartan.mixins.json']

// -client : commun + client (pour les joueurs), sans Mixins ni table de correspondance
tasks.register('clientJar', Jar) {
    group = 'build'
    archiveClassifier = 'client'
    from sourceSets.main.output
    from sourceSets.client.output
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest { attributes(manifeste) }
    finalizedBy 'reobfClientJar'
}

// -serveur : commun + serveur + la copie du jar -client réobfusqué (défi d'intégrité)
tasks.register('serveurJar', Jar) {
    group = 'build'
    archiveClassifier = 'serveur'
    dependsOn 'reobfClientJar'
    from sourceSets.main.output
    from sourceSets.serveur.output
    from(tasks.named('clientJar').flatMap { it.archiveFile }) {
        into 'META-INF/spartan'
        rename { 'client.bin' }
    }
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest { attributes(manifesteMixins) }
    finalizedBy 'reobfServeurJar'
}

// -complet : tout (solo, profil de test) ; le serveur intégré calcule le défi sur ses propres classes
tasks.named('jar', Jar).configure {
    archiveClassifier = 'complet'
    from sourceSets.client.output
    from sourceSets.serveur.output
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest { attributes(manifesteMixins) }
    finalizedBy 'reobfJar'
}

reobf {
    create('clientJar')
    create('serveurJar')
}

tasks.named('build').configure { dependsOn 'clientJar', 'serveurJar' }
