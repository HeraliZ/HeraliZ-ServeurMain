// HeraliZ Utils 2.0.0 : UN projet, UN jar fusionné (5 mods, chacun garde son modId : heralisz_utils, le porteur, +
// heraliz_ping, heraliz_corps, heraliz_usure, heraliz_vehicules), coupé en trois ensembles de sources
// (docs/METHODE_CLIENT_SERVEUR.md) :
//   commun  (sourceSets.main, src/commun)  : registres, blocs (formes, collisions), entités réduites à l'état synchronisé,
//                                             paquets, horaire et réseau ferré, configs, pont et onglet commun ;
//   client  (src/client)                   : ciel, brouillard, tempête, rendus, maillages, cinématique jouée, roue de ping,
//                                             HUD, écrans, sons, touches, assets/ ;
//   serveur (src/serveur)                  : train (montée, descentes, heurts), cinématique déclenchée, ascenseur, corps,
//                                             usure, véhicules, pings reçus, commandes, data/.
// client et serveur voient commun, jamais l'un l'autre ; commun ne voit ni l'un ni l'autre (le compilateur l'interdit).
// Trois jars réobfusqués : -client (commun + client), -serveur (commun + serveur), -complet (tout, pour le solo).
// Construire : PYTHONIOENCODING=utf-8 python outils/lancer.py build mods/heralisz-utils build livrer
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = jar_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    // Aucune configuration de lancement : pas de client ni de serveur de dev, le propriétaire teste lui-même en jeu.
}

// ------------------------------------------------------------------ les trois ensembles de sources
sourceSets {
    main {                                   // = « commun »
        java.srcDirs = ['src/commun/java']
        resources.srcDirs = ['src/commun/resources']
    }
    client {
        java.srcDirs = ['src/client/java']
        resources.srcDirs = ['src/client/resources']
        compileClasspath += main.output + main.compileClasspath
    }
    serveur {
        java.srcDirs = ['src/serveur/java']
        resources.srcDirs = ['src/serveur/resources']
        compileClasspath += main.output + main.compileClasspath
    }
}

// Mixins (tous côté client) : une seule table de correspondance pour toutes les configs *.mixins.json du jar.
mixin {
    add sourceSets.client, "${jar_name}.refmap.json"
}

repositories {
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // GeckoLib = geckolib222 4.4.7 du modpack, le seul GeckoLib du serveur : compilé contre lui, JAMAIS embarqué.
    // (copier TEST SERVEUR - Ptero/mods/geckolib222-forge-1.20.1-4.4.7.jar en libs/geckolib222-<geckolib_libs_version>.jar)
    if (file("libs/geckolib222-${geckolib_libs_version}.jar").exists()) {
        compileOnly fg.deobf("blank:geckolib222:${geckolib_libs_version}")
    }
    // Mods du modpack nécessaires à la compilation (jamais embarqués), copiés des jars installés sur le serveur de test,
    // suffixe -hzutils (cache de deobf partagé par toute la machine) :
    // heraliz_usure : TaCZ (armes, tirs, données des armes) — obligatoire en jeu
    compileOnly fg.deobf("blank:tacz-1.20.1:1.1.8-hotfix-hzutils")
    // heraliz_vehicules : Limitless Vehicle (ywzj_vehicle, réduit par Fuse) — obligatoire en jeu, reste un jar à part
    compileOnly fg.deobf("blank:ywzj_vehicle:0.5.10-fuse-hzutils")
    // zombies : Mutants & Zombies (Pete MC Mods) — gestes d'attaque sur ses modeles, jar intact, jamais embarque
    compileOnly fg.deobf("blank:MutantsZombies:0.9.8-hzutils")
    // heraliz_corps : Curios, CaraCrea (peaux), clans — facultatifs en jeu
    compileOnly fg.deobf("blank:curios-forge:5.14.1-hzutils")
    compileOnly fg.deobf("blank:caracrea:1.1.0-hzutils")
    // heraliz_ping / heraliz_corps : clans, économie, matchs (API) — facultatifs en jeu
    compileOnly fg.deobf("blank:heralisz_clans:0.1.3-hzutils")
    compileOnly fg.deobf("blank:heralisz_economie:0.1.1-hzutils")
    compileOnly fg.deobf("blank:heralisz_matchs:0.2.3-hzutils")
    clientAnnotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var props = [mod_version: mod_version, minecraft_version_range: minecraft_version_range, forge_version_range: forge_version_range,
                 loader_version_range: loader_version_range, mod_license: mod_license, mod_authors: mod_authors]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:-removal', '-Xlint:-deprecation', '-Xmaxerrs', '1000']
}

// ------------------------------------------------------------------ les trois jars
def manifeste = [
        'Specification-Title'     : jar_name,
        'Specification-Vendor'    : mod_authors,
        'Specification-Version'   : '1',
        'Implementation-Title'    : project.name,
        'Implementation-Version'  : mod_version,
        'Implementation-Vendor'   : mod_authors,
]
// Configs de mixins du côté client (src/client/resources/*.mixins.json) : seulement dans -client et -complet.
// Configs de mixins du côté serveur (src/serveur/resources/*.mixins.json : mixins sur TaCZ, noms de TaCZ non obfusqués,
// remap = false, sans table de correspondance) : seulement dans -serveur et -complet.
def mixinsClient = fileTree('src/client/resources') { include '*.mixins.json' }.files*.name.sort()
def mixinsServeur = fileTree('src/serveur/resources') { include '*.mixins.json' }.files*.name.sort()
def manifesteClient = manifeste + (mixinsClient ? ['MixinConfigs': mixinsClient.join(',')] : [:])
def manifesteServeur = manifeste + (mixinsServeur ? ['MixinConfigs': mixinsServeur.join(',')] : [:])
def manifesteComplet = manifeste + ((mixinsClient + mixinsServeur) ? ['MixinConfigs': (mixinsClient + mixinsServeur).join(',')] : [:])

// -complet : commun + client + serveur (solo, profil de test)
tasks.named('jar', Jar).configure {
    archiveClassifier = 'complet'
    from sourceSets.client.output
    from sourceSets.serveur.output
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest { attributes(manifesteComplet) }
    finalizedBy 'reobfJar'
}

// -client : commun + client + assets (pour les joueurs)
tasks.register('clientJar', Jar) {
    group = 'build'
    archiveClassifier = 'client'
    from sourceSets.main.output
    from sourceSets.client.output
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest { attributes(manifesteClient) }
    finalizedBy 'reobfClientJar'
}

// -serveur : commun + serveur + data (pour le serveur), sans mixins client ni table de correspondance (mixins serveur sur
// TaCZ seulement, sans table)
tasks.register('serveurJar', Jar) {
    group = 'build'
    archiveClassifier = 'serveur'
    from sourceSets.main.output
    from sourceSets.serveur.output
    exclude '*.refmap.json'
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest { attributes(manifesteServeur) }
    finalizedBy 'reobfServeurJar'
}

// une tâche reobf<Nom> par jar (sinon le jar garde les noms de développement et plante au chargement)
reobf {
    create('clientJar')
    create('serveurJar')
}

tasks.named('build').configure { dependsOn 'clientJar', 'serveurJar' }

// Copie des trois jars réobfusqués dans dist/fusion/
tasks.register('livrer', Copy) {
    group = 'build'
    dependsOn 'reobfJar', 'reobfClientJar', 'reobfServeurJar'
    from(layout.buildDirectory.dir('libs')) { include "${jar_name}-${mod_version}-complet.jar", "${jar_name}-${mod_version}-client.jar", "${jar_name}-${mod_version}-serveur.jar" }
    into rootProject.file('../../dist/fusion')
}
