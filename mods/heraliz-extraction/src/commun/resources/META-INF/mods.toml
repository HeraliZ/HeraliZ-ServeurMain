# HeraliZ Extraction coupé en trois jars (-client, -serveur, -complet) : UN mod, modId d'origine inchangé.
# Ce fichier est IDENTIQUE dans les trois jars (docs/METHODE_CLIENT_SERVEUR.md).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="heraliz_extraction"
version="${mod_version}"
displayName="HeraliZ Extraction"
authors="${mod_authors}"
description='''Fusée d'extraction : tiens la zone pendant 1:30 à ciel ouvert pour être extrait au spawn. Zones fixes pour les admins (/extraction).'''

[[dependencies.heraliz_extraction]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.heraliz_extraction]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
