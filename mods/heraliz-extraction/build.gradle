// HeraliZ Extraction (gabarit : mods/_gabarit, méthode : docs/METHODE_CLIENT_SERVEUR.md).
// UN mod (pas de fusion : son modId, son paquet, sa classe @Mod), coupé en trois ensembles de sources :
//   commun  (sourceSets.main, src/commun)  : enregistrements, paquets, classes partagées réduites au nécessaire ;
//   client  (src/client)                   : rendu du PC et de la zone, écran, poses, particules, assets/ ;
//   serveur (src/serveur)                  : chronos des joueurs, téléportation, zones fixes, commandes.
// client et serveur voient commun, jamais l'un l'autre ; commun ne voit ni l'un ni l'autre (le compilateur l'interdit).
// Trois jars réobfusqués : -client (commun + client), -serveur (commun + serveur), -complet (tout, pour le solo).
// Construire : PYTHONIOENCODING=utf-8 python outils/lancer.py build mods/heraliz-extraction build livrer
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = jar_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    // Aucune configuration de lancement : pas de client ni de serveur de dev, le propriétaire teste lui-même en jeu.
}

// ------------------------------------------------------------------ les trois ensembles de sources
sourceSets {
    main {                                   // = « commun »
        java.srcDirs = ['src/commun/java']
        resources.srcDirs = ['src/commun/resources']
    }
    client {
        java.srcDirs = ['src/client/java']
        resources.srcDirs = ['src/client/resources']
        compileClasspath += main.output + main.compileClasspath
    }
    serveur {
        java.srcDirs = ['src/serveur/java']
        resources.srcDirs = ['src/serveur/resources']
        compileClasspath += main.output + main.compileClasspath
    }
    // Outil d'aperçu hors jeu (jamais dans les jars) : dessine le modèle du terminal en PNG (gradlew renderPreview)
    apercu {
        java.srcDirs = ['outils/apercu/java']
        resources.srcDirs = []
        compileClasspath += main.output + client.output + main.compileClasspath
        runtimeClasspath += main.output + client.output + main.runtimeClasspath
    }
}

tasks.register('renderPreview', JavaExec) {
    group = 'heraliz'
    description = 'Rend des images PNG du terminal dans build/preview'
    classpath = sourceSets.apercu.runtimeClasspath
    mainClass = 'com.heraliz.extraction.preview.PreviewRenderer'
    args file('build/preview').absolutePath, file('src/client/resources').absolutePath
}

repositories {
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var props = [mod_version: mod_version, minecraft_version_range: minecraft_version_range, forge_version_range: forge_version_range,
                 loader_version_range: loader_version_range, mod_license: mod_license, mod_authors: mod_authors]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:-removal', '-Xlint:-deprecation', '-Xmaxerrs', '1000']
}

// ------------------------------------------------------------------ les trois jars
def manifeste = [
        'Specification-Title'     : jar_name,
        'Specification-Vendor'    : mod_authors,
        'Specification-Version'   : '1',
        'Implementation-Title'    : project.name,
        'Implementation-Version'  : mod_version,
        'Implementation-Vendor'   : mod_authors,
]

// -complet : commun + client + serveur (solo, profil de test)
tasks.named('jar', Jar).configure {
    archiveClassifier = 'complet'
    from sourceSets.client.output
    from sourceSets.serveur.output
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest { attributes(manifeste) }
    finalizedBy 'reobfJar'
}

// -client : commun + client + assets (pour les joueurs)
tasks.register('clientJar', Jar) {
    group = 'build'
    archiveClassifier = 'client'
    from sourceSets.main.output
    from sourceSets.client.output
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest { attributes(manifeste) }
    finalizedBy 'reobfClientJar'
}

// -serveur : commun + serveur (pour le serveur)
tasks.register('serveurJar', Jar) {
    group = 'build'
    archiveClassifier = 'serveur'
    from sourceSets.main.output
    from sourceSets.serveur.output
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest { attributes(manifeste) }
    finalizedBy 'reobfServeurJar'
}

// une tâche reobf<Nom> par jar (sinon le jar garde les noms de développement et plante au chargement)
reobf {
    create('clientJar')
    create('serveurJar')
}

tasks.named('build').configure { dependsOn 'clientJar', 'serveurJar' }

// Copie des trois jars réobfusqués dans dist/fusion/
tasks.register('livrer', Copy) {
    group = 'build'
    dependsOn 'reobfJar', 'reobfClientJar', 'reobfServeurJar'
    from(layout.buildDirectory.dir('libs')) { include "${jar_name}-${mod_version}-complet.jar", "${jar_name}-${mod_version}-client.jar", "${jar_name}-${mod_version}-serveur.jar" }
    into rootProject.file('../../dist/fusion')
}
