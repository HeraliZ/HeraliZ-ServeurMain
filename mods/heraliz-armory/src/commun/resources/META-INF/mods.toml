modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=true
    versionRange="[5.4,)"
    ordering="AFTER"
    side="BOTH"

# GeckoLib (geckolib222 4.4.7 du serveur, jamais embarque) : rendu des objets repris de HeralisZ Armor (ghillies,
# brassards, masques a gaz, objets event). Charge AVANT nous : notre fichier Curios « joueur » (replace: true) est lu
# apres le sien dans son espace de noms (data/geckolib/curios/entities/heraliz_armory_joueur.json).
[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=true
    versionRange="[4.4,)"
    ordering="AFTER"
    side="BOTH"

# HeraliZ Backpack (backpacked) : facultatif, charge avant nous pour la meme raison (slot du sac « back » garde).
[[dependencies.${mod_id}]]
    modId="backpacked"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# TaCZ : facultatif (tirs a la tete : seules les pieces de tete protegent).
[[dependencies.${mod_id}]]
    modId="tacz"
    mandatory=false
    versionRange="[1.1,)"
    ordering="NONE"
    side="BOTH"
