# HeraliZ Boss : UN jar, SIX mods. Chaque boss garde son modId d'origine (objets, blocs, entités, sons, structures,
# configs et canaux réseau inchangés) ; « heraliz_boss » porte le code partagé (pont client/serveur, onglet créatif).
# Ce fichier est IDENTIQUE dans les trois jars (-client, -serveur, -complet) : client et serveur se reconnaissent.
# Chaque [[mods]] a sa classe @Mod (FML 47 : ModLoader.buildMods exige une classe @Mod par modId, et inversement).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="heraliz_boss"
version="${mod_version}"
displayName="HeraliZ Boss"
authors="${mod_authors}"
description='''Les boss HeraliZ réunis en un seul fichier : Ymirak le Mammouth, la Mère des Ruines, le Sujet N-07, le Porteur de Peste et Sylvorn. Onglet créatif commun « HeraliZ · Boss ».'''
[[dependencies.heraliz_boss]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.heraliz_boss]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[mods]]
modId="heralisz_mammoth"
version="${mod_version}"
displayName="HeraliZ Boss · Mammouth"
authors="${mod_authors}"
description='''Ymirak, le Mammouth du Blizzard : boss à 3 phases, son arène (cimetière des mammouths), rituel du cor, décors 3D.'''
[[dependencies.heralisz_mammoth]]
    modId="heraliz_boss"
    mandatory=true
    versionRange="[${mod_version}]"
    ordering="AFTER"
    side="BOTH"
[[dependencies.heralisz_mammoth]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.heralisz_mammoth]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.heralisz_mammoth]]
    modId="geckolib"
    mandatory=true
    versionRange="[4.4,)"
    ordering="AFTER"
    side="BOTH"

