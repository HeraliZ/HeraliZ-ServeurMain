plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Banc d'essai HeraliZ (client de dev seulement, jamais dans le jar) : mod "dayzhotbar_harness" de src/harness.
sourceSets {
    harness {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            // banc d'essai HeraliZ : python outils/lancer.py client src/dayzhotbar <scenario.json> (harness/HotbarHarness)
            if (project.hasProperty('harness')) {
                property 'dayzhotbar.harness', project.property('harness')
                // mixins des mods du banc (Curios, TaCZ...) : refmaps SRG remappees vers les noms officiels
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
                def size = (project.findProperty('harnessSize') ?: '1280x720').toString().split('x')
                args '--width', size[0], '--height', size[1], '--username', 'Heraliz'
                jvmArgs "-Xmx${project.findProperty('harnessXmx') ?: '3G'}"
            }
            mods {
                dayzhotbar_harness {
                    source sourceSets.harness
                }
            }
        }
        server {
            args '--nogui'
        }
    }
}

repositories {
    // banc d'essai seulement : jars de libs/banc resolus par "blank:<nom>:<version>" (cache deobf partage par la
    // machine, indexe par nom + version : memes noms que src/heralisz-matchs/libs pour TaCZ et Curios, suffixe
    // "-hotbar1" pour nos mods copies depuis dist/)
    flatDir { dirs 'libs/banc' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Banc d'essai (runClient -Pharness=...) : TaCZ (arme en main, HUD des munitions) et le moteur des matchs
    // (HUD du mode zombies) avec ses dependances. Rien de tout cela n'entre dans le jar.
    if (project.hasProperty('harness')) {
        runtimeOnly fg.deobf("blank:tacz-1.20.1:1.1.8-hotfix")
        runtimeOnly fg.deobf("blank:simplebedrockmodel:2.2.2")
        runtimeOnly fg.deobf("blank:mixinextras-forge:0.3.6")
        runtimeOnly fileTree(dir: 'libs/banc', include: ['MixinExtras-0.3.6.jar', 'bcel-6.6.1.jar', 'commons-math3-3.6.1.jar', 'luaj-*.jar', 'mclib-20.jar'])
        runtimeOnly fg.deobf("blank:curios-forge:5.14.1")
        runtimeOnly fg.deobf("blank:heralisz_economie:0.1.1-hotbar1")
        runtimeOnly fg.deobf("blank:heralisz_clans:0.1.3-hotbar1")
        runtimeOnly fg.deobf("blank:heralisz_matchs:0.1.4-hotbar1")
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
