# Airstrike coupé en trois jars (-client, -serveur, -complet) : UN mod, modId d'origine inchangé.
# Ce fichier est IDENTIQUE dans les trois jars (docs/METHODE_CLIENT_SERVEUR.md). Le logo n'est que dans -client / -complet.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="airstrike"
version="${mod_version}"
displayName="Airstrike"
logoFile="airstrike_logo.png"
authors="${mod_authors}"
description='''Jumelles de ciblage et frappes aeriennes (bombardement, fumigenes, napalm, gaz, ravitaillement...) avec avions 3D animes.'''

[[dependencies.airstrike]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.airstrike]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
