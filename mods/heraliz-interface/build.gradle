plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // mixins des mods du banc (TaCZ, Xaero, Reanimation...) : refmaps SRG remappees vers les noms officiels
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            // banc d'essai en jeu : python outils/lancer.py client src/heraliz-interface <scenario.json absolu>
            // (= runClient -Pharness=<scenario.json> ; dev/BancInterface, captures dans run/screenshots/interface_*.png)
            if (project.hasProperty('harness')) {
                property 'heraliz.interface.harness', project.property('harness')
                def size = (project.findProperty('harnessSize') ?: '1920x1080').toString().split('x')
                args '--width', size[0], '--height', size[1]
                jvmArgs "-Xmx${project.findProperty('harnessXmx') ?: '2048m'}"
            }
        }
        server {
            args '--nogui'
        }
    }
}

repositories {
    // jars des mods du banc (libs/banc/<artifact>-<version>.jar), resolus par "blank:<artifact>:<version>"
    flatDir { dirs 'libs', 'libs/banc' }
}

// Mixins client : packs de ressources imposés (OptionsMixin, voir client/PackImpose), touches cachées de l'écran
// des commandes (KeyBindsListMixin, voir client/Touches)
mixin {
    add sourceSets.main, "heraliz_interface.refmap.json"
    config "heraliz_interface.mixins.json"
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version, forge_version_range: forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors            : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : 'heraliz_interface.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// copie du jar final dans dist/ a la racine du depot (comme les autres mods)
tasks.register('dist', Copy) {
    dependsOn 'build'
    from(layout.buildDirectory.dir('libs')) { include "${mod_id}-${mod_version}.jar" }
    into rootProject.file('../../dist')
}
