# HeraliZ Décors : les décors 3D de la map (la cité cachée de la faille d'abord) : lumières (lanternes en fer, grosses
# lampes suspendues, guirlandes, projecteurs, cristaux), grands effets dessinés d'un seul tenant (grande cascade, rayons
# de soleil), eau animée, ambiance (brume, lucioles, poussière dorée), mousse pendante, roche, rochers, stalactites. Ce fichier est IDENTIQUE dans les trois jars (-client, -serveur, -complet).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="heraliz_decors"
version="${mod_version}"
displayName="HeraliZ Décors"
authors="${mod_authors}"
description='''Décors 3D de la map HeraliZ : lampes, guirlandes, projecteurs, grande cascade, rayons de soleil, eau animée, ambiance.'''
[[dependencies.heraliz_decors]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.heraliz_decors]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
