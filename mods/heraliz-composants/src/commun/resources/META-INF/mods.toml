# HeraliZ Composants : composants de craft (armes, soins, viseurs, munitions, protection, divers) et objets de
# récupération à revendre. Ce fichier est IDENTIQUE dans les trois jars (-client, -serveur, -complet).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="heraliz_composants"
version="${mod_version}"
displayName="HeraliZ Composants"
authors="${mod_authors}"
description='''Composants de survie pour HeraliZ : pièces d'armes, munitions à recharger, mécanique, électronique et matériaux de récupération.'''
[[dependencies.heraliz_composants]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.heraliz_composants]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
