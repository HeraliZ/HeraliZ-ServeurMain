# HeraliZ Matchs coupé en trois jars (-client, -serveur, -complet) : UN mod, modId d'origine inchangé.
# Ce fichier est IDENTIQUE dans les trois jars (docs/METHODE_CLIENT_SERVEUR.md).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="heralisz_matchs"
version="${mod_version}"
displayName="HeraliZ Matchs"
authors="${mod_authors}"
description='''Matchs du serveur HeraliZ : ClashWar (tournoi entre clans), Duels (Nuketown, recherche et destruction, match a mort, killcam) et Zombies (vagues en groupe). Stuff garde puis rendu, aucune vraie mort en match.'''

[[dependencies.heralisz_matchs]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.heralisz_matchs]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.heralisz_matchs]]
    modId="heralisz_clans"
    mandatory=true
    versionRange="[0.1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.heralisz_matchs]]
    modId="heralisz_economie"
    mandatory=true
    versionRange="[0.1.0,)"
    ordering="AFTER"
    side="BOTH"
