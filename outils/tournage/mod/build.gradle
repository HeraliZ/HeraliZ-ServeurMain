// Mod de tournage des vidéos (TikTok) : JAMAIS sur le serveur ni chez les joueurs. Un seul jar (client + serveur de test).
// Voir outils/tournage/LISEZMOI.md.
plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}
version = '1.0.0'
group = 'fr.heraliz.tournage'
base { archivesName = 'tournage-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
mixin { add sourceSets.main, 'tournage.refmap.json'; config 'tournage.mixins.json' }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar { manifest { attributes('MixinConfigs': 'tournage.mixins.json') }; finalizedBy 'reobfJar' }
