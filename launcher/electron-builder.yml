appId: 'fr.heraliz.launcher'
productName: 'HeraliZ Launcher'
artifactName: '${productName}-setup-${version}.${ext}'

copyright: 'Copyright © 2018-2024 Daniel Scalzi'

asar: true
compression: 'maximum'

# Verrous d'Electron (« fuses »), posés dans l'exécutable à la fabrication : le launcher ne peut plus tourner comme un
# simple Node.js (ELECTRON_RUN_AS_NODE), ni recevoir des options Node ou un débogueur, ni charger autre chose que son
# archive app.asar. Un tricheur a plus de mal à en tirer le jeton du site ou à retirer les protections de Spartan.
# Rien dans le launcher, Helios ou electron-updater n'utilise ce qui est coupé.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true

files:
  - 'index.js'
  - 'package.json'
  - 'LICENSE.txt'
  - 'app/index.html'
  - 'app/preload.js'
  - 'app/heraliz.json'
  - 'app/assets/css/heraliz.css'
  - 'app/assets/fonts/DMSans-*'
  - 'app/assets/images/heraliz-*.{png,jpg,ico}'
  - 'app/assets/images/nouveautes/*.jpg'
  - 'app/assets/images/minecraft.icns'
  - 'app/assets/js/{configmanager,processbuilder,launcher-service,offline-profile,security,renderer,spartan,topo,nouveautes,compte-site,mise-a-jour}.js'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  icon: 'app/assets/images/heraliz-icon.ico'
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
# Nom fixe : c'est le lien public (https://heraliz.fr/telecharger/HeraliZ-Launcher-Setup.exe) et celui de latest.yml.
nsis:
  artifactName: 'HeraliZ-Launcher-Setup.${ext}'
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  icon: 'app/assets/images/heraliz-emblem.png'
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux:
  icon: 'app/assets/images/heraliz-emblem.png'
  target: 'AppImage'
  maintainer: 'HeraliZ'
  vendor: 'HeraliZ'
  synopsis: 'Launcher Minecraft DayZ HeraliZ'
  description: 'Launcher HeraliZ pour Minecraft Forge 1.20.1.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'

# Mise à jour automatique du launcher installé (app/assets/js/mise-a-jour.js) : adresse écrite dans app-update.yml.
# latest.yml et l'installateur y sont déposés par le workflow « Launcher HeraliZ » (case « publier »).
publish:
  - provider: 'generic'
    url: 'https://heraliz.fr/telecharger/'
