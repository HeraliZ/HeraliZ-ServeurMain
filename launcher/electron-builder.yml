appId: 'fr.heraliz.launcher'
productName: 'HeraliZ Launcher'
artifactName: '${productName}-setup-${version}.${ext}'

copyright: 'Copyright © 2018-2024 Daniel Scalzi'

asar: true
compression: 'maximum'

# Verrous d'Electron (« fuses »), posés dans l'exécutable à la fabrication : le launcher ne peut plus tourner comme un
# simple Node.js (ELECTRON_RUN_AS_NODE), ni recevoir des options Node ou un débogueur, ni charger autre chose que son
# archive app.asar. Un tricheur a plus de mal à en tirer le jeton du site ou à retirer les protections de Spartan.
# Rien dans le launcher, Helios ou electron-updater n'utilise ce qui est coupé.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true

files:
  - 'index.js'
  - 'package.json'
  - 'LICENSE.txt'
  - 'app/index.html'
  - 'app/preload.js'
  - 'app/heraliz.json'
  - 'app/assets/css/heraliz.css'
  - 'app/assets/fonts/DMSans-*'
  - 'app/assets/images/heraliz-*.{png,jpg,ico}'
  - 'app/assets/images/nouveautes/*.jpg'
  - 'app/assets/images/pb/*.webp'
  - 'app/assets/images/minecraft.icns'
  - 'app/assets/js/{configmanager,processbuilder,launcher-service,offline-profile,security,signature,renderer,spartan,topo,nouveautes,compte-site,mise-a-jour,effacement,gardien,integrite,secours}.js'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  icon: 'app/assets/images/heraliz-icon.ico'
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
# Nom fixe : c'est le lien public (https://heraliz.fr/telecharger/HeraliZ-Launcher-Setup.exe) et celui de latest.yml.
nsis:
  artifactName: 'HeraliZ-Launcher-Setup.${ext}'
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS : une seule application « universelle » (Mac Intel et Apple Silicon). Pas de certificat Apple (payant) :
# signature « ad hoc » (identity '-'), obligatoire pour qu'elle démarre sur Apple Silicon après les verrous ci-dessus,
# sans « hardened runtime » (réservé aux applications notariées). Au premier lancement, macOS demande une autorisation
# (README.md). Noms fixes : liens publics https://heraliz.fr/telecharger/HeraliZ-Launcher.dmg (et -mac.zip).
mac:
  icon: 'app/assets/images/heraliz-emblem.png'
  target:
    - target: 'dmg'
      arch: 'universal'
    - target: 'zip'
      arch: 'universal'
  artifactName: 'HeraliZ-Launcher-mac.${ext}'
  category: 'public.app-category.games'
  identity: '-'
  hardenedRuntime: false
  notarize: false

dmg:
  artifactName: 'HeraliZ-Launcher.${ext}'
  title: 'HeraliZ Launcher'

# Linux : AppImage (toutes distributions, se met à jour seule) et paquet .deb (Ubuntu, Debian, Mint…). Noms fixes :
# https://heraliz.fr/telecharger/HeraliZ-Launcher.AppImage et HeraliZ-Launcher.deb.
linux:
  icon: 'app/assets/images/heraliz-emblem.png'
  target:
    - target: 'AppImage'
      arch: 'x64'
    - target: 'deb'
      arch: 'x64'
  artifactName: 'HeraliZ-Launcher.${ext}'
  executableName: 'heraliz-launcher'
  # nom du raccourci = desktopName de package.json : le bureau associe la fenêtre au launcher (icône, barre des tâches)
  syncDesktopName: true
  maintainer: 'HeraliZ'
  vendor: 'HeraliZ'
  synopsis: 'Launcher Minecraft DayZ HeraliZ'
  description: 'Launcher HeraliZ pour Minecraft Forge 1.20.1.'
  category: 'Game'

deb:
  packageName: 'heraliz-launcher'

directories:
  buildResources: 'build'
  output: 'dist'

# Mise à jour du launcher installé (app/assets/js/mise-a-jour.js) : adresse écrite dans app-update.yml. latest.yml
# (Windows), latest-mac.yml et latest-linux.yml y sont déposés avec les fichiers par le workflow « Launcher HeraliZ »
# (case « publier »).
publish:
  - provider: 'generic'
    url: 'https://heraliz.fr/telecharger/'
