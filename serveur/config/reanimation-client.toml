#Caméra cinématique pendant une exécution (pour le bourreau et la victime).
#La réanimation, elle, se fait toujours en première personne.
executionCamera = true
#Les couleurs se délavent quand on est au sol.
desaturate = true
#Volume des battements de cœur entendus au sol.
#Range: 0.0 ~ 1.0
heartbeatVolume = 0.8
#Arme affichée pendant une exécution quand le bourreau ne tient pas la bonne : exécution=arme.
#Arme = un id d'arme TaCZ (ex. heralisz_skins:karambit__tiger_tooth), "melee:" + un id HeralisZ (ex. melee:heralisz_melee:sea_gleam__tide_stripe) ou un id d'item.
defaultWeapons = ["karambit=heralisz_skins:karambit__doppler_ruby", "sea_gleam=melee:heralisz_melee:sea_gleam__tide_stripe", "butterfly=heralisz_skins:butterfly__fade", "m9=heralisz_skins:m9__lore", "home_run=melee:heralisz_melee:baseball_bat__walnut"]
#Traînée lumineuse derrière la lame pendant les exécutions au couteau.
knifeTrails = true
#Musique des finishers (catégorie de son « Juke-box / blocs musicaux »).
executionMusic = true

