
#Cartes d'accès (lecteurs de cartes façon Rust)
[keycards]
	#Passages avant que la carte verte casse (0 = illimité)
	#Range: 0 ~ 10000
	usesGreen = 4
	#Passages avant que la carte bleue casse (0 = illimité)
	#Range: 0 ~ 10000
	usesBlue = 3
	#Passages avant que la carte rouge casse (0 = illimité)
	#Range: 0 ~ 10000
	usesRed = 2
	#Passages avant qu'une carte de bunker (Bunker des Bois, Bunker du Pic) casse (0 = illimité)
	#Range: 0 ~ 10000
	usesBunker = 2
	#Durée du signal redstone après un accès accordé (ticks, 20 = 1 s)
	#Range: 10 ~ 12000
	pulseTicks = 100

#Salles à carte (délimitées par le staff avec /salle) : porte tenue ouverte et loot de la salle
[salles]
	#Secondes pour entrer dans la salle une fois la porte ouverte ; personne dedans à la fin : elle se referme
	#Range: 1 ~ 600
	entreeSecondes = 10
	#Secondes d'attente avant que la porte se referme quand le dernier joueur est sorti
	#Range: 0 ~ 60
	fermetureSecondes = 2
	#Minutes, après la sortie du dernier joueur, avant que le loot d'une salle verte réapparaisse
	#Range: 1 ~ 10080
	rechargeVerteMinutes = 30
	#Minutes avant que le loot d'une salle bleue réapparaisse
	#Range: 1 ~ 10080
	rechargeBleueMinutes = 120
	#Minutes avant que le loot d'une salle rouge réapparaisse
	#Range: 1 ~ 10080
	rechargeRougeMinutes = 240

#Portes de bunker (17/11) : désignées par le staff (/salle bunker ajouter [nom], en regardant la porte), ouvertes
#seulement par un lecteur de carte posé à 2 blocs au plus (n'importe quelle couleur : la carte du lecteur posé),
#annoncées à tout le serveur, puis refermées
[bunkers]
	#Minutes pendant lesquelles la porte reste ouverte après un passage de carte (temps réel)
	#Range: 1 ~ 1440
	ouvertureMinutes = 30
	#Secondes avant la fermeture où les joueurs à 48 blocs au plus de la porte sont prévenus (0 = jamais)
	#Range: 0 ~ 600
	avertirSecondes = 60
