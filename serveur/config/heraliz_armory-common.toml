
[protection]
	#Multiplicateur des protections des pieces (balles, corps a corps, morsure, radiation) :
	#1.0 = valeurs du catalogue (plafond commun : plafond ci-dessous, radiation 100 %), 0 = desactive
	#Range: 0.0 ~ 2.0
	multiplier = 1.0
	#Plafond commun des protections (en %) : la somme des pieces portees ne le depasse jamais (radiation : 100 %,
	#Hazmat seulement). 60 : une tenue Unique complete (60 % au corps, 50 % a la tete) ne peut pas etre depassee.
	#Range: 0.0 ~ 100.0
	plafond = 60.0
	#Types de degats traites comme des balles, en plus des projectiles et des balles TaCZ (tag tacz:bullets)
	bullet_damage_types = []
	#Multiplicateur de la protection contre les explosions (0 = desactive)
	#Range: 0.0 ~ 2.0
	explosion_multiplier = 1.0
	#Effets bloques par un masque filtrant (piece portee au visage ou sur la tete), ex. "minecraft:poison"
	gas_effects = ["minecraft:poison"]


[plongee]
	#Eaux du labo sous-marin (17/11, demande du proprietaire) : cercles « x z rayon » de la carte principale ou, la tete sous
	#l'eau, il faut la tenue de plongee. 1980 2025 110 : tout le labo (son verre est a 87 blocs au plus de ce centre).
	labo_zones = ["1980 2025 110"]
	#Sans la tenue, dans ces eaux : secondes d'air avant de se noyer, puis degats par seconde (4 = 2 coeurs).
	#18/11 (demande du proprietaire) : 5,5 s d'air (avant 2,5), puis 2 coeurs par coup chaque seconde (avant 2,5).
	labo_apnee_secondes = 5.5
	labo_degats_par_seconde = 4.0
	#Sans la tenue, sous cette hauteur : le noir (la mer est a 63, le labo de 14 a 35).
	labo_noir_sous_y = 52
	#Avec la tenue : vision de nuit dans ces eaux, pour voir correctement.
	labo_vision_tenue = true

[chiffres]
	#Petits chiffres des degats : quand un joueur en touche un autre, il voit (lui seul) la vie que l'autre
	#a vraiment perdue, au-dessus de sa tete. false = coupe.
	joueurs = true

[reseau]
	#Contenu d'un sac porte (et de tout objet Curios qui en a un) : envoye seulement a son porteur.
	#Les autres joueurs ne recoivent que l'apparence du sac (son contenu leur etait envoye a chaque changement
	#et a chaque fois qu'ils voyaient le porteur arriver). false = comme avant.
	contenu_porteur_seul = true
