#Packet Fixer config file.
#Default values (minecraft default): nbtMaxSize 2097152, packetSize 1048576, decoderSize 8388608 and varInt21Size 3.
#Max values are 2147483647 for packetSize/decoderSize/varInt21 and 9223372036854775807 for nbtMaxSize.
#HeraliZ (19/11, audit F9) : plus de tailles illimitees (un client pouvait faire tomber le serveur avec un seul paquet).
#decoderSize 32 Mo : un paquet une fois decompresse, recu ou envoye (le plus gros connu : les armes TaCZ envoyees a chaque
#connexion, 0,9 Mo environ). packetSize 16 Mo : donnees d'un paquet de mod, dans les deux sens (ce que les joueurs envoient :
#30 Ko au plus). nbtMaxSize 16 Mo : NBT d'un objet recu d'un joueur (sac plein d'armes : quelques centaines de Ko).
#stringSize et varInt21 gardent l'effet d'avant (TaCZ envoie ses textes sans taille ; le paquet reste borne par decoderSize).
#Pourquoi ces tailles : docs/DEPLOIEMENT.md, section 2 (PacketFixer). Le mod recrit ce fichier au demarrage (commentaires).
allSizesUnlimited=false
chunkPacketData=2097152
decoderSize=33554432
nbtMaxSize=16777216
packetSize=16777216
stringSize=2147483647
timeout=90
varInt=5
varInt21=8
varLong=10
