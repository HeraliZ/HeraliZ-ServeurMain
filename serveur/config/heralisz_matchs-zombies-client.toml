
#Musique du mode zombies de HeraliZ. Vos morceaux : config/heralisz_matchs/musiques/ (voir LISEZMOI.txt).
[musique]
	#Volume de la playlist (0 a 1), multiplie par le curseur « Musique » des options.
	#Range: 0.0 ~ 1.0
	volume_musique = 0.6
	#Volume du fond d'ambiance (0 a 1), multiplie par le curseur « Ambiance ».
	#Range: 0.0 ~ 1.0
	volume_ambiance = 0.55
	#continue = la playlist enchaine les morceaux de la 1re manche a la fin ;
	#manches = un morceau par manche, coupe en fondu a la fin de la manche ; aucune = pas de playlist.
	mode = "continue"
	#Jouer la musique « 115 » (integree au mod) en tete de la playlist et a l'easter egg
	#(votre fichier easter_egg.ogg passe avant).
	musique_115 = true
	#Utiliser les jingles classiques integres (debut/fin de manche, boite mystere)
	#a la place des jingles HeraliZ (vos fichiers manche_debut.ogg... passent avant).
	jingles_classiques = true

