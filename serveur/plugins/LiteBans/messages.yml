      \            &r\n&f  [&l🔨&f]&r #FB0000$playerDisplayName has been Banned\n\
      &f         #fc5555ʜᴏᴠᴇʀ ꜰᴏʀ ɪɴꜰᴏ                          \n#fc5555&m      \
