    cooldown: '&cYou need to wait &e$duration&c before you can use this command again.'
    response: ''
    modify_success: '&aPunishment modified successfully.'
    ip_hidden: '[IP Address]'
    unban_usage: '&cUsage: $command <player>'
    broadcast_unban: "&r\n#fc5555&m                                              \
      \              &r\n&f  [&l🔨&f]&r #FB0000$playerDisplayName's Ban has been Revoked\n\
