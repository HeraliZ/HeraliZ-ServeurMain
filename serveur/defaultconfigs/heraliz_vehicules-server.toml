
[regles]
	#Dimensions sans aucun vehicule (anciens bunkers des bases) :
	#on ne peut pas y poser de vehicule et un vehicule qui y arrive est retire (rendu en objet).
	dimensions_interdites = ["heralisz_bases:bunkers"]
	#Refuser de sortir (poser) un vehicule pendant le tag de combat (cle heralisz:combat_jusqua de HeraliZ Matchs).
	refus_en_combat = true
	#Les explosions de vehicules ne cassent aucun bloc (bases, bunkers) : force canDestroyBlock et
	#explosionDropBlock a false dans la config de Limitless Vehicle.
	proteger_blocs = true
	#Les vehicules n'ont plus de coffre : impossible de l'ouvrir (a bord ou sur une epave). Les objets deja
	#ranges dans un vehicule pose sont poses au sol a cote de lui (sans limite de temps) quand il se charge.
	coffre_retire = true
	#Points de vie max des vehicules, en pour cent de ceux de Limitless Vehicle (20 = divises par 5 :
	#moto 20, buggy et fourgon 60, camion 100). Les vehicules deja poses passent au nouveau maximum en gardant
	#leur pourcentage de vie.
	#Range: 1 ~ 1000
	pv_pourcent = 20

