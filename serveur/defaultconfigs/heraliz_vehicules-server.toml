
[regles]
	#Dimensions sans aucun vehicule (arenes du ClashWar, ancien monde des bases) :
	#on ne peut pas y poser de vehicule et un vehicule qui y arrive est retire (rendu en objet).
	dimensions_interdites = ["heraliz_clashwar:arenes", "crac:bases"]
	#Dimensions ou l'on ne pose pas de vehicule et ou aucun vehicule ne voyage (spawn, tutoriel des
	#bases) ; les vehicules deja poses par le staff (decor) y restent.
	dimensions_sans_pose = ["heralisz:spawn", "crac:tuto"]
	#Refuser de sortir (poser) un vehicule pendant le tag de combat (cle heralisz:combat_jusqua du noyau).
	refus_en_combat = true
	#Les explosions de vehicules ne cassent aucun bloc (bases, bunkers) : force canDestroyBlock et
	#explosionDropBlock a false dans la config de Limitless Vehicle.
	proteger_blocs = true
	#Les vehicules n'ont plus de coffre : impossible de l'ouvrir (a bord ou sur une epave). Les objets deja
	#ranges dans un vehicule pose sont poses au sol a cote de lui (sans limite de temps) quand il se charge.
	coffre_retire = true
	#Points de vie max des vehicules, en pour cent de ceux de Limitless Vehicle (20 = divises par 5 :
	#moto 20, buggy et fourgon 60, camion 100). Les vehicules deja poses passent au nouveau maximum en gardant
	#leur pourcentage de vie.
	#Range: 1 ~ 1000
	pv_pourcent = 20
	#Passagers des vehicules proteges de tous les degats (regle d'origine de Limitless Vehicle : moto, camion
	#et fourgon ; pas le buggy). false (11/11) : un joueur dans ou sur un vehicule prend les degats comme a pied
	#(balles, coups, explosions, zombies, feu) ; le vehicule garde ses propres PV.
	passagers_proteges = false
	#Une balle de TaCZ dont le trajet passe par le corps d'un passager le touche lui, meme a travers la
	#carrosserie (fourgon, cabine du camion, motard) ; ailleurs, c'est le vehicule qui prend la balle. false : la
	#carrosserie arrete toutes les balles (le passager cache dedans n'est jamais touche).
	balles_traversent = true
	#Sortie d'un vehicule verifiee par le serveur : si l'endroit choisi par Limitless Vehicle est dans un bloc
	#ou derriere un mur (vehicule colle a un mur, dans un garage), le joueur sort de l'autre cote, a l'arriere ou a
	#l'avant ; sans aucune place libre, sur le vehicule. Jamais de l'autre cote d'un mur. false : endroit du moteur
	#tel quel.
	sortie_sure = true
	#Sortie volontaire d'un vehicule (touche S'accroupir, touche du moteur) refusee au-dessus de cette vitesse au
	#sol, en km/h (conducteur et passagers ; message au joueur). Jamais pour une sortie forcee par le serveur (mise a
	#terre, mort, teleportation, vehicule detruit, deconnexion). 0 : pas de limite. Vitesse max des vehicules : 58 km/h.
	#Range: 0 ~ 1000
	sortie_vitesse_max_kmh = 15
	#Sans conducteur (sortie, mort, mise a terre, deconnexion, teleportation), un vehicule freine tout seul
	#jusqu'a l'arret (frein du vehicule, roues au sol) et coupe son moteur (plus d'essence une fois le moteur arrete) ;
	#le conducteur qui remonte le redemarre comme d'habitude. false : le vehicule continue sur sa lancee, moteur allume.
	arret_sans_conducteur = true

[apparition]
	#Vehicules qui apparaissent tout seuls un peu partout sur la carte (25/11, demande du proprietaire :
	#« des vehicules en plus grande quantite un peu partout, avec une limite sur la carte, chacun avec 3 % d'essence »).
	#Un vehicule apparait hors de la vue des joueurs, pres de l'un d'eux (le coin de carte doit deja etre charge : le
	#serveur ne charge jamais rien pour ca), sur un sol naturel plat (liste « sols »), pas dans l'eau ni sous un toit.
	active = true
	#Vehicules apparus tout seuls sur la carte au plus en meme temps (ceux poses par les joueurs ne comptent
	#pas). Un vehicule detruit, ramasse ou retire libere sa place ; un vehicule jamais revu depuis « oubli_jours » aussi.
	#Range: 0 ~ 500
	max = 40
	#Un essai d'apparition toutes les ... secondes (tant que la carte n'a pas son maximum, et seulement
	#avec un joueur sur la carte).
	#Range: 10 ~ 3600
	intervalle_secondes = 90
	#Essence a l'apparition, en pour cent du reservoir du vehicule.
	#Range: 0.0 ~ 100.0
	essence_pourcent = 3.0
	#Vehicules qui apparaissent et leur poids (plus le poids est grand, plus il est frequent) :
	#« identifiant=poids ». Seulement les vehicules du serveur (moto, buggy, fourgon, camion).
	vehicules = ["ywzj_vehicle:motorcycle=4", "ywzj_vehicle:atv_mrzr4=3", "ywzj_vehicle:hiace=2", "ywzj_vehicle:dump_truck=1"]
	#Monde ou les vehicules apparaissent (la carte).
	dimension = "minecraft:overworld"
	#Blocs au moins entre le vehicule qui apparait et tout joueur (personne ne le voit surgir).
	#Range: 16 ~ 512
	distance_min = 80
	#Blocs au plus entre le vehicule et le joueur pres de qui il apparait (le coin doit etre charge).
	#Range: 32 ~ 1024
	distance_max = 180
	#Blocs au moins entre deux vehicules apparus tout seuls (endroit d'apparition).
	#Range: 0 ~ 2000
	ecart = 150
	#Blocs au moins autour du point d'apparition du monde (le spawn) sans vehicule qui apparait.
	#Range: 0 ~ 5000
	loin_du_spawn = 150
	#Blocs sur lesquels un vehicule peut apparaitre (« #... » : une etiquette de blocs). Sous un toit ou
	#sur un toit : jamais (le dessus de la colonne doit etre un de ces sols, a l'air libre).
	sols = ["minecraft:grass_block", "minecraft:dirt", "minecraft:coarse_dirt", "minecraft:podzol", "minecraft:dirt_path", "minecraft:gravel", "minecraft:sand", "minecraft:red_sand", "minecraft:stone", "minecraft:andesite", "minecraft:snow_block", "minecraft:snow", "minecraft:mud", "minecraft:packed_mud", "minecraft:rooted_dirt"]
	#Un vehicule apparu qui n'a plus ete vu charge depuis ce nombre de jours ne compte plus dans le
	#maximum (il est peut-etre parti dans un coin ou personne ne va).
	#Range: 1 ~ 60
	oubli_jours = 3

[coffre]
	#Coffre des vehicules HeraliZ (27/11, demande du proprietaire) : Maj + clic droit sur un vehicule ouvre son
	#coffre, meme en combat (pour emporter le butin d'un raid). Refuse : a terre, en match, a bord, sur une epave,
	#vehicule qui roule. Vehicule detruit (ou /kill) : tout le contenu tombe au sol a cote de lui. Ce coffre n'est
	#pas celui de Limitless Vehicle (toujours retire, coffre_retire) et aucun entonnoir n'y a acces.
	#false : plus d'ouverture (le contenu reste garde dans le vehicule).
	actif = true
	#Taille du coffre de chaque vehicule : « identifiant=colonnesxlignes » (24 colonnes et 9 lignes au plus,
	#216 cases au plus). Un vehicule absent de la liste n'a pas de coffre. Taille baissee : les objets des cases en
	#trop sont ranges dans les cases libres a l'ouverture, sinon gardes (caches) et poses au sol a la destruction.
	tailles = ["ywzj_vehicle:motorcycle=9x3", "ywzj_vehicle:atv_mrzr4=12x6", "ywzj_vehicle:hiace=15x6", "ywzj_vehicle:dump_truck=24x6"]
	#Distance (blocs) des yeux du joueur au bord du vehicule pour ouvrir le coffre ; il reste ouvert jusqu'a
	#un bloc de plus.
	#Range: 1.0 ~ 16.0
	distance = 5.0
	#Vitesse au sol (km/h) au-dessus de laquelle le coffre ne s'ouvre pas et se ferme (vehicule qui roule).
	#Range: 0.5 ~ 100.0
	vitesse_max_kmh = 4.0
