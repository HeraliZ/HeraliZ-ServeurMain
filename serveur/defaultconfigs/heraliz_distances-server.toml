# Distances du serveur imposées par HeraliZ Utils (le server.properties du Ptero n'est pas mis à jour par la mise en
# ligne, ce fichier l'est). 0 = la valeur du server.properties.
[distances]
	# Distance de vue, en tronçons de 16 blocs. 8 = 128 blocs (choix du propriétaire, 24/10 : serveur et joueurs).
	vue = 8
	# Distance de simulation, en tronçons (server.properties : 5).
	simulation = 0
	# Vue plus courte pour certains mondes seulement, « monde=tronçons ». 01/11 (choix du propriétaire) : 4 dans le
	# tutoriel des bases (chaque joueur y est seul sur sa parcelle). Liste vide : la vue générale partout.
	vues_par_monde = ["crac:tuto=4"]
