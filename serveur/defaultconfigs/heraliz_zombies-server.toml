# Zombies de la survie (HeraliZ Utils). Ce fichier du dépôt fait foi pour le peuplement de la carte : la mise en ligne le
# recopie dans le monde ; la section [zombies] garde ses valeurs par défaut (remises par Forge).

[peuplement]
	actif = true
	intervalle_secondes = 2
	cible_nature = 6
	cible_ville = 10
	cible_par_valeur = 1.5
	nuit = 1.25
	bonus_par_joueur = 0.1
	bonus_groupe_max = 0.4
	cible_max = 24
	rayon_compte = 64
	distance_min = 24
	distance_max = 56
	distance_joueur_min = 20
	part_hors_vue = 0.8
	distance_retrait = 96
	max_total = 1000
	#24/10 : 45 coupait presque tout pendant l'ouverture (1 zombie posé en 5 min) ; 60 = environ 16 TPS
	tick_max_ms = 60.0
	suivre_doMobSpawning = false
	bots = false

#24/10 (performances) : intelligence des zombies HeraliZ, rien ne change de près (voir ZombieSurvieServeur)
[ia]
	actif = true
	#au-delà, sans cible : ni promenade ni Zombie Awareness (réveil dès qu'un joueur approche ou qu'on le touche)
	distance_reduite = 48
	#sous tant de blocs de sa cible, chemin recalculé comme dans Minecraft
	chemin_pres = 12
	#ticks au moins entre deux calculs de chemin vers la même cible : de 12 à 24 blocs, au-delà, cible hors d'atteinte restée sur place
	attente_moyen = 15
	attente_loin = 30
	attente_bloque = 10
	#portée de suivi au plus (Minecraft : 35, jusqu'à 87 avec le bonus de difficulté)
	suivi_max = 40.0
	awareness_rapide = true
