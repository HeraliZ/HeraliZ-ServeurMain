
[corps]
	#Corps a la mort des joueurs (false = comportement vanilla : objets au sol)
	actif = true
	#Secondes pendant lesquelles seul le mort peut fouiller son corps (0 = personne n'est protege, style DayZ)
	#Range: 0 ~ 3600
	protection_secondes = 0
	#Pendant la protection, les membres du clan du mort peuvent aussi fouiller (mod HeraliZ Clans)
	protection_clan = false
	#Minutes (de jeu, serveur allume) avant qu'un corps disparaisse avec ce qu'il contient
	#Range: 1 ~ 10080
	disparition_minutes = 10
	#Secondes avant qu'un corps vide disparaisse
	#Range: 1 ~ 600
	disparition_vide_secondes = 1
	#Corps au plus par chunk : au-dela, le plus ancien du chunk disparait (filet anti-lag)
	#Range: 1 ~ 256
	max_par_chunk = 16
	#Corps au plus sur le serveur : au-dela, le plus ancien disparait (filet anti-lag)
	#Range: 1 ~ 100000
	max_par_monde = 400
	#Distance maximale (blocs) pour fouiller un corps
	#Range: 2.0 ~ 16.0
	distance_fouille = 5.0
	#Dimensions ou aucun corps n'apparait (les matchs gerent leurs morts eux-memes)
	dimensions_exclues = ["heraliz_clashwar:arenes"]

