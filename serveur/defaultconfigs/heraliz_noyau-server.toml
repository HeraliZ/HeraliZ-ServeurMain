
[combat]
	#Duree du tag de combat en secondes (degats infliges ou recus d'un autre joueur)
	#Range: 1 ~ 300
	tag_secondes = 15
	#Deconnexion pendant le tag de combat = mort (le corps reste ; jamais a l'arret du serveur)
	mort_deconnexion = true
	#Refuser au joueur tague (ou a terre) toute commande absente de commandes_permises_combat
	refus_commandes = true
	#Les operateurs (niveau 2) tagues gardent toutes leurs commandes
	operateurs_exemptes = false
	#Seules commandes permises au joueur tague ou a terre (racine en minuscules, sans / ni espace de noms : "tpa" couvre aussi /essentials:tpa)
	commandes_permises_combat = ["login", "register", "l", "reg", "msg", "tell", "w", "r", "me", "quetes", "journalieres", "pb", "saison", "extractions", "event", "report"]

[carte]
	#Sur la carte (minecraft:overworld), en survie ou aventure, hors staff (niveau 2) : refuser toute commande absente de commandes_permises
	actif = true
	#Seules commandes permises sur la carte (racine en minuscules, sans / ni espace de noms)
	commandes_permises = ["tpa", "login", "register", "l", "reg", "msg", "tell", "w", "r", "me", "quetes", "journalieres", "pb", "saison", "extractions", "event", "clan", "suicide", "report", "home", "base", "purge", "coeur", "ping"]

[diag]
	#Rapport automatique à chaque blocage du serveur (/diag, 24/10). Ne coûte rien tant que tout va bien :
	#un fil surveille la durée du tick et ne relève la pile du serveur que pendant un tick trop long.
	auto = true
	#Durée d'un tick (en ms) à partir de laquelle on parle de blocage. Un tick normal : 50 ms au plus.
	#Range: 60 ~ 60000
	seuil_ms = 100
	#Prévenir les opérateurs connectés (niveau 4) à chaque blocage, dans le chat (une fois par 30 s au plus).
	annoncer = true

[recharger]
	#/recharger (24/10) : commandes de rechargement des modules jouées l'une après l'autre, sans
	#redémarrer ni déconnecter personne (quêtes, marchands, recycleur, caisses, casino, raretés, tables de loot,
	#saison, territoires, Purge, zones dangereuses, ClashWar, modpack officiel de l'anticheat). Les réglages en .toml
	#se relisent seuls quand leur fichier change.
	commandes = ["quete recharger", "heraliz reload", "casino reload", "rarete recharger", "heralizloot tables", "saison recharger", "territoire recharger", "purge recharger", "zones recharger", "clashwar recharger", "event recharger", "spartan officiel"]

[survie]
	#Vitesse de la faim (25/10) : la fatigue de Minecraft (course, sauts, coups, vie qui remonte) est
	#multipliée par ce nombre. 1 : comme Minecraft ; 0,35 (28/10) : la barre de faim dure environ trois fois plus longtemps.
	#Range: 0.1 ~ 2.0
	faim_facteur = 0.35

[succes]
	#Succès (« progrès ») de Minecraft (27/10, perf) : false = ni suivis ni enregistrés. Ils étaient vérifiés à
	#chaque changement d'inventaire (chaque tir de TaCZ), environ 1 % du serveur à 90 joueurs, et ne servent pas ici (quêtes,
	#saison et statistiques sont à part ; notifications déjà cachées chez les joueurs). Relu à l'arrivée de chaque joueur.
	actifs = false

[perf]
	#level.dat (27/10) : true = compressé et écrit à côté du fil serveur à chaque sauvegarde automatique (son
	#contenu est toujours relevé par Minecraft) ; à l'arrêt du serveur, écrit tout de suite. false : comme Minecraft.
	level_dat_en_fond = true
	#Mondes dont la zone de départ (2 209 tronçons gardés chargés par Mohist, même sans personne) est
	#libérée après le démarrage (27/10) : ils se chargent quand un joueur y va. Ne pas y mettre le monde du spawn.
	mondes_sans_spawn = ["crac:bases", "crac:tuto", "heraliz_clashwar:arenes"]
	#Mondes de mondes_sans_spawn (01/11) : true = leur zone de départ n'est même plus préparée au démarrage
	#(Mohist chargeait encore 441 tronçons par monde, voire les générait, avant de les libérer) ni remise par /setworldspawn.
	#false : libérée seulement après le démarrage, comme avant. La carte et le monde du spawn gardent la leur (réapparitions
	#sans lit, arrivées au spawn).
	spawn_jamais_prepare = true
	#Minecraft allégé (01/11) : à chaque tick, Minecraft cherche pour chaque tronçon actif s'il y a un joueur
	#(non spectateur) à moins de 128 blocs, en parcourant TOUS les joueurs du monde. true = les joueurs sont rangés une fois
	#par tick dans une grille de 128 blocs et seuls les voisins sont regardés (même réponse, même règle que Minecraft et
	#Mohist, mob-spawn-range de spigot.yml compris). false : comme Minecraft.
	joueurs_proches_grille = true
	#Minecraft allégé (01/11) : la portée de suivi d'une entité (à quelle distance les joueurs la voient) était
	#calculée pour chaque entité, chaque joueur qui bouge et chaque tick en parcourant ses passagers par un flux Java
	#(une dizaine d'objets créés à chaque fois). true = sans passager, la boucle ne parcourt rien et ne crée rien (même
	#portée). false : comme Minecraft.
	portee_suivi_rapide = true
	#Minecraft allégé (01/11) : pour chaque tronçon envoyé à un joueur, Minecraft parcourait TOUTES les entités
	#suivies du monde pour trouver celles du tronçon (~170 tronçons x 4 000 entités à chaque arrivée). true = un index par
	#tronçon, refait dès qu'une entité change de tronçon, apparaît ou disparaît (mêmes entités, même ordre). false : comme
	#Minecraft.
	entites_par_troncon = true
	#Minecraft allégé (01/11) : quand plusieurs joueurs reçoivent le même tronçon dans le même tick (groupe
	#extrait ou téléporté ensemble), son paquet n'est fabriqué qu'une fois (mêmes octets ; oublié dès qu'un bloc, une entité
	#de bloc, la lumière ou les biomes du tronçon changent). false : un paquet par joueur, comme Minecraft.
	paquets_troncons_partages = true

[monde]
	#Tics aléatoires (01/11, choix du propriétaire : carte figée) : gamerule randomTickSpeed de CHAQUE monde, réglée
	#au chargement du monde (mondes créés plus tard compris), après le démarrage et quand ce fichier change, par l'API du jeu
	#comme /gamerule. 0 : plus aucun tic aléatoire (herbe, feuilles, neige, glace, cultures, lave… ne changent plus seuls) ;
	#3 : valeur de Minecraft ; -1 : ne pas toucher (la valeur déjà enregistrée dans le monde reste).
	#Range: -1 ~ 4096
	tics_aleatoires = 0

[redemarrage]
	#/redemarrage : code de sortie de Java à la fin (0 : arrêt normal ; une valeur autre que 0 fait
	#redémarrer le serveur par le panel si son redémarrage après plantage est activé). Sinon : tâche « restart » du panel.
	#Range: 0 ~ 255
	code_sortie = 0
