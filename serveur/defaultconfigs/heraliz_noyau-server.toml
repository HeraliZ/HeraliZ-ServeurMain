
[combat]
	#Duree du tag de combat en secondes (degats infliges ou recus d'un autre joueur)
	#Range: 1 ~ 300
	tag_secondes = 15
	#Deconnexion pendant le tag de combat = mort (le corps reste ; jamais a l'arret du serveur)
	mort_deconnexion = true
	#Refuser au joueur tague (ou a terre) toute commande absente de commandes_permises_combat
	refus_commandes = true
	#Les operateurs (niveau 2) tagues gardent toutes leurs commandes
	operateurs_exemptes = false
	#Seules commandes permises au joueur tague ou a terre (racine en minuscules, sans / ni espace de noms : "tpa" couvre aussi /essentials:tpa)
	commandes_permises_combat = ["login", "register", "l", "log", "reg", "captcha", "totp", "2fa", "msg", "tell", "w", "r", "me", "quetes", "journalieres", "pb", "saison", "extractions", "event"]

[carte]
	#Sur la carte (minecraft:overworld), en survie ou aventure, hors staff (niveau 2) : refuser toute commande absente de commandes_permises
	actif = true
	#Seules commandes permises sur la carte (racine en minuscules, sans / ni espace de noms)
	commandes_permises = ["tpa", "login", "register", "l", "log", "reg", "captcha", "totp", "2fa", "msg", "tell", "w", "r", "me", "quetes", "journalieres", "pb", "saison", "extractions", "event", "clan", "suicide", "home", "base", "purge", "coeur", "canal"]

[diag]
	#Rapport automatique à chaque blocage du serveur (/diag, 24/10). Ne coûte rien tant que tout va bien :
	#un fil surveille la durée du tick et ne relève la pile du serveur que pendant un tick trop long.
	auto = true
	#Durée d'un tick (en ms) à partir de laquelle on parle de blocage. Un tick normal : 50 ms au plus.
	#Range: 60 ~ 60000
	seuil_ms = 100
	#Prévenir les opérateurs connectés (niveau 4) à chaque blocage, dans le chat (une fois par 30 s au plus).
	annoncer = true

[recharger]
	#/recharger [module] relit les données de tous les modules (ou d'un seul), sans redémarrer ni déconnecter
	#personne : quêtes, marchands, recycleur, caisses, casino, raretés, tables de loot, saison, territoires, clans, hérals,
	#Purge, coffres des bases, zones dangereuses, ClashWar, événements, dégâts des armes, modpack officiel de l'anticheat
	#(02/11 : chaque module s'inscrit lui-même ; leurs sous-commandes « recharger » n'existent plus). Ici : commandes EN PLUS
	#jouées ensuite (vide par défaut). Les réglages en .toml se relisent seuls quand leur fichier change.
	commandes = []

[commandes]
	#Commandes retirées pour de bon (02/11) : Minecraft et mods, console comprise (racine en minuscules, sans /
	#ni espace de noms). Appliqué au démarrage et quand ce fichier change ; une commande enlevée de la liste ne revient
	#qu'au redémarrage. Jamais une commande de plugin (Bukkit) : celles-là, voir cachees.
	retirees = ["tacz", "kiwi", "coro", "modernfix", "mfsrc", "ywzj_vehicle", "matmossettings", "tctcoresettings", "debug", "jfr", "perf", "datapack", "function", "schedule", "trigger", "return", "bossbar", "team", "teammsg", "tm", "advancement", "recipe", "fillbiome", "place", "forceload", "spreadplayers", "ride", "loot", "seed", "defaultgamemode", "setidletimeout", "experience", "xp", "enchant", "attribute"]
	#Noms cachés de la liste des commandes (complétion du chat, panneau du staff), toujours utilisables si on les
	#tape (02/11) : autres noms des plugins (WorldEdit, LiteBans...) et commandes sans usage. Serveur Bukkit (Mohist)
	#seulement ; relu à chaque envoi de la liste (connexion, changement de droits).
	cachees = ["curios", "about", "ver", "pl", "timings", "log", "2fa", "changepass", "cp", "email", "verification", "unregister", "unreg", "logout", "perm", "perms", "permission", "permissions", "kaurivpn", "kvpn", "vpn", "avpn", "csf", "regions", ";", "stoplag", "haltactivity", "slay", "stack", "lban", "lmute", "lwarn", "lkick", "lipban", "banip", "ban-ip", "tempipban", "tempbanip", "iptempban", "lipmute", "muteip", "tempipmute", "tempmuteip", "iptempmute", "lunban", "unbanip", "ipunban", "tempunban", "pardon", "pardonip", "pardon-ip", "lunmute", "tempunmute", "unmuteip", "ipunmute", "lunwarn", "removewarnings", "rmwarnings", "rmwarn", "ltempban", "tban", "tmpban", "ltempmute", "lcheckban", "chkban", "lcheckmute", "chkmute", "lcheckwarn", "chkwarn", "lbanlist", "listbans", "lmutelist", "listmutes", "lwarnlist", "listwarns", "lhistory", "hist", "lwarnings", "checkwarn", "warnlist", "listwarn", "warninglist", "listwarnings", "lprunehistory", "lstaffhistory", "lshistory", "staffhist", "shist", "shistory", "lstaffrollback", "liphistory", "iphist", "lnamehistory", "namehist", "luuid", "lgeoip", "geo", "ldupeip", "alts", "checkalts", "listalts", "lipreport", "llockdown", "lbans", "ipmute", "checkmute", "mutelist", "prunehistory", "staffrollback", "lockdown", "geoip", "lastuuid", "ipreport", "biomels", "/gmask", "/toggleplace", "/searchitem", "/l", "/search", "/gen", "/g", "/genbiome", "/gb", "/undo", "/redo", "/clearhistory", "!", "asc", "desc", "j", "/re", "/rep", "/middle", "/outline", "/desel", "/deselect", "/restore", "unbind", "/selwand", "/navwand", "flood", "/lrbuild", ",", "/material", "/fixlava", "/fixwater", "/removeabove", "/removebelow", "/removenear", "/replacenear", "/snow", "/thaw", "/green", "/ex", "/ext", "/extinguish", "ex", "ext", "rem", "rement", "/calc", "/eval", "/evaluate", "/solve", "schem", "/schematic", "/schem", "snap", "pickaxe", "sp", "br", "/brush", "/br", "we", "snapshot", "restore", "cs", ".s"]

[survie]
	#Vitesse de la faim (25/10) : la fatigue de Minecraft (course, sauts, coups, vie qui remonte) est
	#multipliée par ce nombre. 1 : comme Minecraft ; 0,35 (28/10) : la barre de faim dure environ trois fois plus longtemps.
	#Range: 0.1 ~ 2.0
	faim_facteur = 0.35

[succes]
	#Succès (« progrès ») de Minecraft (27/10, perf) : false = ni suivis ni enregistrés. Ils étaient vérifiés à
	#chaque changement d'inventaire (chaque tir de TaCZ), environ 1 % du serveur à 90 joueurs, et ne servent pas ici (quêtes,
	#saison et statistiques sont à part ; notifications déjà cachées chez les joueurs). Relu à l'arrivée de chaque joueur.
	actifs = false

[perf]
	#level.dat (27/10) : true = compressé et écrit à côté du fil serveur à chaque sauvegarde automatique (son
	#contenu est toujours relevé par Minecraft) ; à l'arrêt du serveur, écrit tout de suite. false : comme Minecraft.
	level_dat_en_fond = true
	#Mondes dont la zone de départ (2 209 tronçons gardés chargés par Mohist, même sans personne) est
	#libérée après le démarrage (27/10) : ils se chargent quand un joueur y va. Jamais la carte (réapparitions sans lit).
	#02/11 : crac:bases retiré (ancien monde des bases fermé, plus créé) ; à remettre ici s'il est rouvert. 02/11 : le monde
	#du spawn (heralisz:spawn) ajouté ; ses deux points d'arrivée (réveil, /spawn) restent gardés par leurs propres tickets.
	mondes_sans_spawn = ["crac:tuto", "heraliz_clashwar:arenes", "heralisz:spawn"]
	#Mondes de mondes_sans_spawn (01/11) : true = leur zone de départ n'est même plus préparée au démarrage
	#(Mohist chargeait encore 441 tronçons par monde, voire les générait, avant de les libérer) ni remise par /setworldspawn.
	#false : libérée seulement après le démarrage, comme avant. La carte garde la sienne (réapparitions sans lit).
	spawn_jamais_prepare = true
	#Minecraft allégé (01/11) : à chaque tick, Minecraft cherche pour chaque tronçon actif s'il y a un joueur
	#(non spectateur) à moins de 128 blocs, en parcourant TOUS les joueurs du monde. true = les joueurs sont rangés une fois
	#par tick dans une grille de 128 blocs et seuls les voisins sont regardés (même réponse, même règle que Minecraft et
	#Mohist, mob-spawn-range de spigot.yml compris). false : comme Minecraft.
	joueurs_proches_grille = true
	#Minecraft allégé (01/11) : la portée de suivi d'une entité (à quelle distance les joueurs la voient) était
	#calculée pour chaque entité, chaque joueur qui bouge et chaque tick en parcourant ses passagers par un flux Java
	#(une dizaine d'objets créés à chaque fois). true = sans passager, la boucle ne parcourt rien et ne crée rien (même
	#portée). false : comme Minecraft.
	portee_suivi_rapide = true
	#Minecraft allégé (01/11) : pour chaque tronçon envoyé à un joueur, Minecraft parcourait TOUTES les entités
	#suivies du monde pour trouver celles du tronçon (~170 tronçons x 4 000 entités à chaque arrivée). true = un index par
	#tronçon, refait dès qu'une entité change de tronçon, apparaît ou disparaît (mêmes entités, même ordre). false : comme
	#Minecraft.
	entites_par_troncon = true
	#Minecraft allégé (01/11) : quand plusieurs joueurs reçoivent le même tronçon dans le même tick (groupe
	#extrait ou téléporté ensemble), son paquet n'est fabriqué qu'une fois (mêmes octets ; oublié dès qu'un bloc, une entité
	#de bloc, la lumière ou les biomes du tronçon changent). false : un paquet par joueur, comme Minecraft.
	paquets_troncons_partages = true
	#Minecraft allégé, étape 2 (01/11) : à chaque paquet de mouvement d'un joueur, Minecraft juge TOUTES les entités
	#suivies du monde pour lui (77 ms par tick au banc à 150 joueurs, surtout les balles de TaCZ). true = seules celles des
	#cases de 32 blocs à portée et celles qu'il voit déjà sont jugées, avec la décision de Minecraft refaite à l'identique
	#(vanish, anti-ESP de Spartan, passagers, spectateurs compris) ; pareil pour une entité ou un joueur qui change de
	#section. Une paire sur 8 192 est rejugée par Minecraft, et tout est comparé à Minecraft toutes les 60 s : un écart
	#coupe jusqu'au redémarrage. false : comme Minecraft.
	suivi_par_troncon = true
	#Minecraft allégé, étape 2 (01/11) : test de Bukkit « ce joueur peut-il voir cette entité ? » (vanish), posé par
	#Mohist pour chaque entité à portée. true = pour un joueur à qui aucun plugin ne cache ni ne montre d'entité, la réponse
	#est lue directement sur l'entité (même réponse ; le vrai test sinon, et une fois sur 4 096 pour comparer). false : le
	#vrai test de Bukkit à chaque fois.
	suivi_voir_rapide = true
	#Minecraft allégé, étape 2 (01/11) : un tronçon déjà complet demandé sur le fil du serveur (getChunk) est rendu
	#tel quel, sans le ticket « unknown » d'un tick que Minecraft pose à chaque fois (comme Paper ; même tronçon rendu).
	#Seule différence : un tronçon que plus rien ne tient (aucun joueur, aucun autre ticket) redescend 1 à 2 ticks plus
	#tôt. false : comme Minecraft.
	troncons_sans_ticket = true
	#Minecraft allégé, étape 2 (01/11) : à chaque tick, Minecraft parcourt TOUS les tronçons chargés (~23 000) pour
	#trouver ceux qui tournent. true = liste des tronçons qui peuvent tourner, tenue à jour quand leur niveau change (mêmes
	#tronçons, Minecraft les mélange ensuite au hasard comme avant ; comparée à Minecraft toutes les 60 s). false : comme
	#Minecraft.
	troncons_actifs_liste = true
	#Minecraft allégé, étape 2 (01/11) : à chaque tick, Minecraft compare deux fois chaque case du menu ouvert de
	#chaque joueur à ses copies (NBT complet des armes, sacs, armures). true = quand les deux copies sont le même objet et
	#que la 1re comparaison a dit « pareil », la 2e (la même question) est sautée. false : comme Minecraft.
	menus_une_comparaison = true

[monde]
	#Tics aléatoires (01/11, choix du propriétaire : carte figée) : gamerule randomTickSpeed de CHAQUE monde, réglée
	#au chargement du monde (mondes créés plus tard compris), après le démarrage et quand ce fichier change, par l'API du jeu
	#comme /gamerule. 0 : plus aucun tic aléatoire (herbe, feuilles, neige, glace, cultures, lave… ne changent plus seuls) ;
	#3 : valeur de Minecraft ; -1 : ne pas toucher (la valeur déjà enregistrée dans le monde reste).
	#Range: -1 ~ 4096
	tics_aleatoires = 0
	#Tronçons forcés (02/11) : true = au démarrage, une fois, tous les tronçons forcés de chaque monde sont
	#retirés par l'API du jeu, comme « /forceload remove all » (commande retirée, voir [commandes] retirees), et le journal
	#dit combien et où. Les 13 laissés sur la carte par les scripts de pose des décors du 24/10 y gardaient chargés à vie
	#environ 2 000 tronçons, même serveur vide. Aucun de nos mods n'en pose ; les tickets des autres mods (Forge) et des
	#plugins ne sont pas touchés. false : on n'y touche pas.
	retirer_troncons_forces = true

[redemarrage]
	#/redemarrage : code de sortie de Java à la fin (0 : arrêt normal ; une valeur autre que 0 fait
	#redémarrer le serveur par le panel si son redémarrage après plantage est activé). Sinon : tâche « restart » du panel.
	#Range: 0 ~ 255
	code_sortie = 0
