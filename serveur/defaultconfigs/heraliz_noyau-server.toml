
[combat]
	#Duree du tag de combat en secondes (degats infliges ou recus d'un autre joueur)
	#Range: 1 ~ 300
	tag_secondes = 15
	#Deconnexion pendant le tag de combat = mort (le corps reste ; jamais a l'arret du serveur ni dans le monde du spawn)
	mort_deconnexion = true
	#Refuser au joueur tague (ou a terre) toute commande absente de commandes_permises_combat
	refus_commandes = true
	#Les operateurs (niveau 2) tagues gardent toutes leurs commandes
	operateurs_exemptes = false
	#Seules commandes permises au joueur tague ou a terre (racine en minuscules, sans / ni espace de noms : "tpa" couvre aussi /essentials:tpa)
	commandes_permises_combat = ["login", "register", "l", "log", "reg", "captcha", "totp", "2fa", "msg", "tell", "w", "r", "me", "quetes", "journalieres", "pb", "saison", "extractions", "event", "aide", "money", "argent", "profil", "stats"]

[carte]
	#Sur la carte (minecraft:overworld), en survie ou aventure, hors staff (niveau 2) : refuser toute commande absente de commandes_permises
	actif = true
	#Seules commandes permises sur la carte (racine en minuscules, sans / ni espace de noms)
	commandes_permises = ["tpa", "login", "register", "l", "log", "reg", "captcha", "totp", "2fa", "msg", "tell", "w", "r", "me", "quetes", "journalieres", "pb", "saison", "extractions", "event", "clan", "suicide", "home", "sethome", "base", "purge", "coeur", "canal", "aide", "money", "argent", "profil", "stats"]

[diag]
	#Rapport automatique à chaque blocage du serveur (/diag, 24/10). Ne coûte rien tant que tout va bien :
	#un fil surveille la durée du tick et ne relève la pile du serveur que pendant un tick trop long.
	auto = true
	#Durée d'un tick (en ms) à partir de laquelle on parle de blocage. Un tick normal : 50 ms au plus.
	#Range: 60 ~ 60000
	seuil_ms = 100
	#Prévenir les opérateurs connectés (niveau 4) à chaque blocage, dans le chat (une fois par 30 s au plus).
	annoncer = true
	#Relevés de la pile (19/11, audit des lenteurs) : le veilleur commence à relever la pile du serveur dès que le tick
	#dure plus que ce temps (ms), pour que le rapport décrive le blocage depuis son début (avant : seulement après seuil_ms, 2 ou
	#3 relevés pris à la fin d'un tick de 114 ms). Seul un tick plus long que seuil_ms fait un rapport ; les relevés d'un tick
	#plus court sont jetés. Une valeur plus grande que seuil_ms : comme avant (relevés après le seuil).
	#Range: 10 ~ 60000
	releves_des_ms = 50
	#Démarrage du serveur (19/11) : pendant ce temps (secondes) après « Done », les ticks longs (classes et données
	#lues pour la première fois) ne sont pas des alertes : ni message aux opérateurs, ni ligne « [diag] blocage » ; ils sont
	#écrits dans le journal (« [diag] démarrage ») et dans diag/demarrage-<date>.txt. 0 : alertes dès le démarrage.
	#Range: 0 ~ 3600
	calme_demarrage_s = 180

[recharger]
	#/recharger [module] relit les données de tous les modules (ou d'un seul), sans redémarrer ni déconnecter
	#personne : quêtes, marchands, recycleur, caisses, casino, raretés, tables de loot, saison, territoires, clans, hérals,
	#Purge, coffres des bases, zones dangereuses, ClashWar, événements, dégâts des armes, modpack officiel de l'anticheat
	#(02/11 : chaque module s'inscrit lui-même ; leurs sous-commandes « recharger » n'existent plus). Ici : commandes EN PLUS
	#jouées ensuite (vide par défaut). Les réglages en .toml se relisent seuls quand leur fichier change.
	commandes = []

[commandes]
	#Commandes retirées pour de bon (02/11) : Minecraft et mods, console comprise (racine en minuscules, sans /
	#ni espace de noms). Appliqué au démarrage et quand ce fichier change ; une commande enlevée de la liste ne revient
	#qu'au redémarrage. Jamais une commande de plugin (Bukkit) : celles-là, voir cachees.
	retirees = ["tacz", "kiwi", "coro", "modernfix", "mfsrc", "ywzj_vehicle", "matmossettings", "tctcoresettings", "debug", "jfr", "perf", "datapack", "function", "schedule", "trigger", "return", "bossbar", "team", "teammsg", "tm", "advancement", "recipe", "fillbiome", "place", "forceload", "spreadplayers", "ride", "loot", "seed", "defaultgamemode", "setidletimeout", "experience", "xp", "enchant", "attribute"]
	#Noms cachés de la liste des commandes (complétion du chat, panneau du staff), toujours utilisables si on les
	#tape (02/11) : autres noms des plugins (WorldEdit, LiteBans...) et commandes sans usage. Serveur Bukkit (Mohist)
	#seulement ; relu à chaque envoi de la liste (connexion, changement de droits).
	cachees = ["curios", "about", "ver", "pl", "timings", "log", "2fa", "changepass", "cp", "email", "verification", "unregister", "unreg", "logout", "perm", "perms", "permission", "permissions", "kaurivpn", "kvpn", "vpn", "avpn", "csf", "regions", ";", "stoplag", "haltactivity", "slay", "stack", "lban", "lmute", "lwarn", "lkick", "lipban", "banip", "ban-ip", "tempipban", "tempbanip", "iptempban", "lipmute", "muteip", "tempipmute", "tempmuteip", "iptempmute", "lunban", "unbanip", "ipunban", "tempunban", "pardon", "pardonip", "pardon-ip", "lunmute", "tempunmute", "unmuteip", "ipunmute", "lunwarn", "removewarnings", "rmwarnings", "rmwarn", "ltempban", "tban", "tmpban", "ltempmute", "lcheckban", "chkban", "lcheckmute", "chkmute", "lcheckwarn", "chkwarn", "lbanlist", "listbans", "lmutelist", "listmutes", "lwarnlist", "listwarns", "lhistory", "hist", "lwarnings", "checkwarn", "warnlist", "listwarn", "warninglist", "listwarnings", "lprunehistory", "lstaffhistory", "lshistory", "staffhist", "shist", "shistory", "lstaffrollback", "liphistory", "iphist", "lnamehistory", "namehist", "luuid", "lgeoip", "geo", "ldupeip", "alts", "checkalts", "listalts", "lipreport", "llockdown", "lbans", "ipmute", "checkmute", "mutelist", "prunehistory", "staffrollback", "lockdown", "geoip", "lastuuid", "ipreport", "biomels", "/gmask", "/toggleplace", "/searchitem", "/l", "/search", "/gen", "/g", "/genbiome", "/gb", "/undo", "/redo", "/clearhistory", "!", "asc", "desc", "j", "/re", "/rep", "/middle", "/outline", "/desel", "/deselect", "/restore", "unbind", "/selwand", "/navwand", "flood", "/lrbuild", ",", "/material", "/fixlava", "/fixwater", "/removeabove", "/removebelow", "/removenear", "/replacenear", "/snow", "/thaw", "/green", "/ex", "/ext", "/extinguish", "ex", "ext", "rem", "rement", "/calc", "/eval", "/evaluate", "/solve", "schem", "/schematic", "/schem", "snap", "pickaxe", "sp", "br", "/brush", "/br", "we", "snapshot", "restore", "cs", ".s"]

[survie]
	#Vitesse de la faim (25/10) : la fatigue de Minecraft (course, sauts, coups, vie qui remonte) est
	#multipliée par ce nombre. 1 : comme Minecraft ; 0,35 (28/10) : la barre de faim dure environ trois fois plus longtemps.
	#Range: 0.1 ~ 2.0
	faim_facteur = 0.35
	#Vie qui remonte toute seule (04/11, choix du propriétaire : « on récupère nos PV très vite »). « lente » : la
	#récupération de Minecraft est coupée (règle naturalRegeneration à false, posée par le serveur) et remplacée par la
	#nôtre, réglée ci-dessous ; « coupee » : aucune récupération, seulement les soins ; « minecraft » : comme Minecraft (le
	#ventre plein et la saturation rendent 1 cœur par seconde). Relu sans redémarrer.
	regeneration = "lente"
	#Mode « lente » : vie rendue à chaque palier (en PV : 2 = 1 cœur).
	#Range: 0.5 ~ 20.0
	regen_pv = 2.0
	#Mode « lente » : secondes entre deux paliers.
	#Range: 1 ~ 300
	regen_intervalle_s = 10
	#Mode « lente » : barre de faim minimale (sur 20) pour que la vie remonte (Minecraft : 18).
	#Range: 0 ~ 20
	regen_faim_min = 18
	#Mode « lente » : secondes sans prendre de dégâts avant que la vie recommence à remonter ; jamais
	#en combat (tag de combat) ni à terre.
	#Range: 0 ~ 300
	regen_apres_degats_s = 10
	#Mode « lente » : fatigue ajoutée par PV rendu (Minecraft : 6), multipliée par faim_facteur.
	#Range: 0.0 ~ 40.0
	regen_fatigue_par_pv = 6.0

[pas]
	#Bruits de pas (03/11, retour du propriétaire : « on n'entend pas assez les pas des ennemis »). Le pas d'un joueur
	#est joué par son propre jeu pour lui-même (jamais touché ici) et envoyé par le serveur aux AUTRES joueurs ; celui d'un
	#zombie est envoyé par le serveur à tous. true = réglages ci-dessous ; false : comme Minecraft (pas d'un autre joueur
	#entendu à 16 blocs au plus).
	actif = true
	#Distance (blocs) jusqu'à laquelle on entend le pas d'un autre joueur, de moins en moins fort avec la
	#distance (Minecraft : 16). Un joueur accroupi reste silencieux, comme dans Minecraft. Vanish du staff respecté.
	#Range: 8 ~ 64
	portee_joueurs = 24
	#Volume du pas d'un autre joueur tout près, par rapport à Minecraft (1 : comme Minecraft ; 1,3 (03/11,
	#choix du propriétaire : « un peu mieux », 2 était trop fort)). Ses propres pas ne changent pas.
	#Range: 0.25 ~ 4.0
	volume_joueurs = 1.3
	#Baisse du pas d'un autre joueur avec la distance : volume x (1 - (distance / portee_joueurs) ^ douceur).
	#1 : en ligne droite, comme Minecraft ; plus grand : baisse plus douce au début, plus rapide vers la fin. 1,2 : à 8 blocs
	#environ deux fois plus fort que Minecraft, à 16 blocs comme Minecraft à 8, plus rien à 24.
	#Range: 0.5 ~ 3.0
	douceur = 1.2
	#Volume du pas des zombies et des autres monstres, par rapport à avant (1 : comme avant, soit la moitié
	#de Minecraft, réglée le 24/10 dans le pack de ressources des joueurs ; 2 : comme Minecraft ; 03/11, choix du
	#propriétaire : 1). Leur distance ne change pas : 11 blocs pour les zombies.
	#Range: 0.25 ~ 4.0
	volume_monstres = 1.0

[succes]
	#Succès (« progrès ») de Minecraft (27/10, perf) : false = ni suivis ni enregistrés. Ils étaient vérifiés à
	#chaque changement d'inventaire (chaque tir de TaCZ), environ 1 % du serveur à 90 joueurs, et ne servent pas ici (quêtes,
	#saison et statistiques sont à part ; notifications déjà cachées chez les joueurs). Relu à l'arrivée de chaque joueur.
	actifs = false

[perf]
	#level.dat (27/10) : true = compressé et écrit à côté du fil serveur à chaque sauvegarde automatique (son
	#contenu est toujours relevé par Minecraft) ; à l'arrêt du serveur, écrit tout de suite. false : comme Minecraft.
	level_dat_en_fond = true
	#Mondes dont la zone de départ (2 209 tronçons gardés chargés par Mohist, même sans personne) est
	#libérée après le démarrage (27/10) : ils se chargent quand un joueur y va. Jamais la carte (réapparitions sans lit).
	#02/11 : crac:bases retiré (ancien monde des bases fermé, plus créé) ; à remettre ici s'il est rouvert. 02/11 : le monde
	#du spawn (heralisz:spawn) ajouté ; ses deux points d'arrivée (réveil, /spawn) restent gardés par leurs propres tickets.
	mondes_sans_spawn = ["crac:tuto", "heraliz_clashwar:arenes", "heralisz:spawn"]
	#Mondes de mondes_sans_spawn (01/11) : true = leur zone de départ n'est même plus préparée au démarrage
	#(Mohist chargeait encore 441 tronçons par monde, voire les générait, avant de les libérer) ni remise par /setworldspawn.
	#false : libérée seulement après le démarrage, comme avant. La carte garde la sienne (réapparitions sans lit).
	spawn_jamais_prepare = true
	#Minecraft allégé (01/11) : à chaque tick, Minecraft cherche pour chaque tronçon actif s'il y a un joueur
	#(non spectateur) à moins de 128 blocs, en parcourant TOUS les joueurs du monde. true = les joueurs sont rangés une fois
	#par tick dans une grille de 128 blocs et seuls les voisins sont regardés (même réponse, même règle que Minecraft et
	#Mohist, mob-spawn-range de spigot.yml compris). false : comme Minecraft.
	joueurs_proches_grille = true
	#Minecraft allégé (01/11) : la portée de suivi d'une entité (à quelle distance les joueurs la voient) était
	#calculée pour chaque entité, chaque joueur qui bouge et chaque tick en parcourant ses passagers par un flux Java
	#(une dizaine d'objets créés à chaque fois). true = sans passager, la boucle ne parcourt rien et ne crée rien (même
	#portée). false : comme Minecraft.
	portee_suivi_rapide = true
	#Minecraft allégé (01/11) : pour chaque tronçon envoyé à un joueur, Minecraft parcourait TOUTES les entités
	#suivies du monde pour trouver celles du tronçon (~170 tronçons x 4 000 entités à chaque arrivée). true = un index par
	#tronçon, refait dès qu'une entité change de tronçon, apparaît ou disparaît (mêmes entités, même ordre). false : comme
	#Minecraft.
	entites_par_troncon = true
	#Minecraft allégé (01/11) : quand plusieurs joueurs reçoivent le même tronçon dans le même tick (groupe
	#extrait ou téléporté ensemble), son paquet n'est fabriqué qu'une fois (mêmes octets ; oublié dès qu'un bloc, une entité
	#de bloc, la lumière ou les biomes du tronçon changent). false : un paquet par joueur, comme Minecraft.
	paquets_troncons_partages = true
	#Minecraft allégé, étape 2 (01/11) : à chaque paquet de mouvement d'un joueur, Minecraft juge TOUTES les entités
	#suivies du monde pour lui (77 ms par tick au banc à 150 joueurs, surtout les balles de TaCZ). true = seules celles des
	#cases de 32 blocs à portée et celles qu'il voit déjà sont jugées, avec la décision de Minecraft refaite à l'identique
	#(vanish, anti-ESP de Spartan, passagers, spectateurs compris) ; pareil pour une entité ou un joueur qui change de
	#section. Une paire sur 8 192 est rejugée par Minecraft, et tout est comparé à Minecraft toutes les 60 s : un écart
	#coupe jusqu'au redémarrage. false : comme Minecraft.
	suivi_par_troncon = true
	#Minecraft allégé, étape 2 (01/11) : test de Bukkit « ce joueur peut-il voir cette entité ? » (vanish), posé par
	#Mohist pour chaque entité à portée. true = pour un joueur à qui aucun plugin ne cache ni ne montre d'entité, la réponse
	#est lue directement sur l'entité (même réponse ; le vrai test sinon, et une fois sur 4 096 pour comparer). false : le
	#vrai test de Bukkit à chaque fois.
	suivi_voir_rapide = true
	#Minecraft allégé, étape 2 (01/11) : un tronçon déjà complet demandé sur le fil du serveur (getChunk) est rendu
	#tel quel, sans le ticket « unknown » d'un tick que Minecraft pose à chaque fois (comme Paper ; même tronçon rendu).
	#Seule différence : un tronçon que plus rien ne tient (aucun joueur, aucun autre ticket) redescend 1 à 2 ticks plus
	#tôt. false : comme Minecraft.
	troncons_sans_ticket = true
	#Minecraft allégé, étape 2 (01/11) : à chaque tick, Minecraft parcourt TOUS les tronçons chargés (~23 000) pour
	#trouver ceux qui tournent. true = liste des tronçons qui peuvent tourner, tenue à jour quand leur niveau change (mêmes
	#tronçons, Minecraft les mélange ensuite au hasard comme avant ; comparée à Minecraft toutes les 60 s). false : comme
	#Minecraft.
	troncons_actifs_liste = true
	#Minecraft allégé, étape 2 (01/11) : à chaque tick, Minecraft compare deux fois chaque case du menu ouvert de
	#chaque joueur à ses copies (NBT complet des armes, sacs, armures). true = quand les deux copies sont le même objet et
	#que la 1re comparaison a dit « pareil », la 2e (la même question) est sautée. false : comme Minecraft.
	menus_une_comparaison = true
	#Chargement d'un tronçon (11/11) : quand aucun relevé de hauteur ne manque dans le tronçon lu, Minecraft
	#parcourt quand même ses 256 colonnes pour ne rien noter (10 à 25 % du temps de lecture sur la carte construite).
	#true = rien à refaire, rien de parcouru (même résultat). false : comme Minecraft.
	hauteurs_sans_balayage = true
	#Sauvegarde au fil de l'eau (11/11) : à chaque tick, Minecraft passe en revue TOUS les tronçons chargés pour écrire
	#ceux qui ont changé (8 ms par tick à 100 joueurs). true = une tranche d'un vingtième par tick, en reprenant où le tick
	#d'avant s'est arrêté : chaque tronçon est regardé une fois par seconde, mêmes écritures (20 par tick au plus). La
	#sauvegarde automatique, les déchargements et l'arrêt regardent toujours tout. false : comme Minecraft.
	sauvegardes_etalees = true
	#Tronçons qui tournent (11/11) : Minecraft mélange leur liste à chaque tick, pour les apparitions naturelles de
	#créatures. true = pas de mélange dans un monde où la règle doMobSpawning est à faux (rien n'apparaît : l'ordre ne
	#sert à rien). false : mélange à chaque tick, comme Minecraft.
	melange_si_apparitions = true
	#Téléportations de nos mods (19/11, audit des lenteurs) : warps, extraction, /tpa, éjection du casino, sortie des salles
	#à carte, ClashWar... passent par le noyau : l'arrivée est demandée à Minecraft (5 x 5 tronçons lus en tâche de fond) et le
	#joueur part dès que les 3 x 3 tronçons autour du point sont prêts, 3 s au plus (avant : 0,4 à 2,5 s de gel pour tout le
	#serveur quand l'arrivée n'était pas chargée). false : tout de suite, comme avant.
	arrivees_prechargees = true
	#/tp de Minecraft (19/11, staff) : un joueur envoyé vers une arrivée pas encore chargée part dès qu'elle est prête
	#(3 s au plus) ; le message de Minecraft part tout de suite, un bandeau prévient celui qui a tapé la commande. Arrivée
	#déjà chargée : tout de suite, comme avant. false : comme Minecraft.
	tp_precharge = true
	#Mouvements (19/11, comme le réglage prevent-moving-into-unloaded-chunks de Paper) : un joueur qui avance vers un
	#tronçon encore en lecture (vol rapide du staff, effets de vitesse) est renvoyé à sa place, comme pour « moved too
	#quickly », au lieu de faire attendre ce tronçon par tout le serveur. Marche normale : jamais (les tronçons sont prêts
	#bien avant). false : comme Minecraft.
	mouvements_troncons_prets = true
	#Grands déchargements (19/11) : au-delà de 2 000 tronçons à décharger (après WorldEdit, après le départ d'une grande
	#zone), Minecraft décharge et écrit tout l'excédent dans le même tick, sans regarder le temps (1,4 et 2 s de gel le 19/11).
	#Ici : au plus ce nombre de déchargements forcés par tick, en plus de ceux que le temps libre permet (comme Minecraft) ;
	#le reste suit aux ticks suivants. Au-delà de 20 000 en attente (mémoire) : règle de Minecraft. 0 : règle de Minecraft.
	#Range: 0 ~ 100000
	dechargements_forces_par_tick = 50
	#Sauvegarde automatique (19/11) : la partie « fml » de level.dat (registres de Forge, des dizaines de milliers
	#d'identifiants) et les réglages de génération des mondes étaient refaits à chaque sauvegarde, alors qu'ils ne changent
	#plus une fois le serveur démarré. true = faits à la première sauvegarde, puis resservis tels quels (même contenu).
	#false : refaits à chaque fois, comme Forge.
	registres_en_memoire = true
	#Fichiers data/ des mondes (19/11) : données de Minecraft, des mods et des nôtres qui n'ont pas leur propre écriture
	#(territoires, corps, recycleurs, récolte, casino...). Leur contenu est relevé puis copié sur le fil du serveur ; la
	#compression et l'écriture (fichier à côté puis remplacement) partent sur l'écrivain en fond du noyau. Pendant l'arrêt :
	#tout de suite, après les écritures en file. false : écrits sur le fil du serveur, comme Minecraft.
	donnees_en_fond = true
	#Sauvegarde automatique des joueurs (19/11) : Minecraft écrivait TOUS les joueurs connectés dans le même tick
	#(265 à 325 ms à 20-30 bots le 25/10). true = quelques-uns par tick pendant 5 s ; un joueur qui a un coffre ou un autre
	#menu ouvert est écrit tout de suite (échange en cours), un joueur qui se déconnecte est écrit par Minecraft. /save-all,
	#l'arrêt et Bukkit écrivent toujours tout. false : comme Minecraft.
	joueurs_etales = true
	#Sauvegarde automatique des entités (19/11) : Minecraft remettait en NBT toutes les entités de tous les tronçons
	#chargés dans le même tick (zombies, corps, véhicules...). true = par tranches pendant 5 s (comme la sauvegarde étalée
	#des tronçons de Paper). /save-all flush et l'arrêt écrivent toujours tout. false : comme Minecraft.
	entites_etalees = true
	#Démarrage (19/11) : les classes de nos mods sont lues et préparées à l'avance sur un fil à part, dès le lancement du
	#serveur, sans être lancées : la première ouverture d'un écran, le premier tournoi ou la première connexion ne les lisent
	#plus sur le fil du serveur. Jamais les mods des autres auteurs. false : lues à leur première utilisation.
	classes_prechargees = true
	#Démarrage (19/11) : classes de ces plugins lues à l'avance, par le chargeur du plugin, sur un fil à part, 20 s après
	#« Done » : Mohist les traduit alors avant l'arrivée des joueurs (1,4 s de gel à la première connexion, 0,2 à 0,8 s au
	#premier WorldEdit, le 18/11). Liste vide : rien.
	plugins_prechauffes = ["WorldEdit", "WorldGuard", "WorldGuardExtraFlags", "LuckPerms", "AuthMe", "LiteBans"]
	#Tronçons qui tournent (20/11, audit du tick : 7,8 ms par tick à 100 joueurs) : à chaque tick, Minecraft passe sur chaque
	#tronçon autour des joueurs (temps passé, tics de blocs, foudre, glace, neige). Quand rien ne peut y arriver (tics aléatoires
	#à 0, doMobSpawning à faux, pas de pluie, gel_eau à false), seul compte le temps passé par les joueurs (difficulté locale) :
	#chaque tronçon n'est alors vu qu'une fois tous les N ticks, avec N ticks de temps d'un coup (même total). Les blocs changés
	#partent toujours aux joueurs à chaque tick. Dès qu'il pleut ou qu'une règle change : chaque tick, comme Minecraft.
	#1 : chaque tick, comme Minecraft.
	#Range: 1 ~ 200
	troncons_tranches = 20
	#Apparitions naturelles (20/11, audit du tick : 0,7 ms par tick à 100 joueurs) : à chaque tick, Minecraft compte toutes
	#les créatures du monde et cherche les joueurs proches de chaque monstre, pour ses apparitions naturelles. true = sauté dans
	#un monde où la règle doMobSpawning est à faux (rien n'apparaît : le compte ne sert à rien ; les zombies viennent du
	#peuplement). false : à chaque tick, comme Minecraft.
	apparitions_sans_releve = true
	#Tickets de chargement (20/11, audit du tick : 0,5 ms par tick à 100 joueurs) : à chaque tick, Minecraft passe en revue
	#tous les tickets du monde (un par tronçon vu par un joueur) pour retirer ceux qui ont fini leur temps, alors que presque
	#aucun n'a de durée. true = revue faite seulement au tick où un ticket peut avoir fini (mêmes tickets retirés, au même
	#tick). false : à chaque tick, comme Minecraft.
	tickets_a_echeance = true

[monde]
	#Tics aléatoires (01/11, choix du propriétaire : carte figée) : gamerule randomTickSpeed de CHAQUE monde, réglée
	#au chargement du monde (mondes créés plus tard compris), après le démarrage et quand ce fichier change, par l'API du jeu
	#comme /gamerule. 0 : plus aucun tic aléatoire (herbe, feuilles, neige, glace, cultures, lave… ne changent plus seuls) ;
	#3 : valeur de Minecraft ; -1 : ne pas toucher (la valeur déjà enregistrée dans le monde reste).
	#Range: -1 ~ 4096
	tics_aleatoires = 0
	#Tronçons forcés (02/11) : true = au démarrage, une fois, tous les tronçons forcés de chaque monde sont
	#retirés par l'API du jeu, comme « /forceload remove all » (commande retirée, voir [commandes] retirees), et le journal
	#dit combien et où. Les 13 laissés sur la carte par les scripts de pose des décors du 24/10 y gardaient chargés à vie
	#environ 2 000 tronçons, même serveur vide. Aucun de nos mods n'en pose ; les tickets des autres mods (Forge) et des
	#plugins ne sont pas touchés. false : on n'y touche pas.
	retirer_troncons_forces = true
	#Eau qui gèle (19/11, retour du propriétaire : « dans l'arctique l'eau gèle ») : dans un biome froid, Minecraft change
	#en glace l'eau au bord d'un plan d'eau, puis la glace gagne de proche en proche, près des joueurs, même avec
	#tics_aleatoires = 0 (ce n'est pas un tic aléatoire). false : l'eau ne gèle jamais (la carte est construite à la main) ;
	#true : comme Minecraft. La glace déjà formée reste : la remettre en eau à la main (WorldEdit).
	gel_eau = false
	#Neige qui s'entasse (19/11) : quand il neige dans un biome froid, Minecraft pose des couches de neige sur le sol
	#et les blocs. false : la neige tombe mais ne s'entasse plus ; true : comme Minecraft.
	neige_au_sol = false

[redemarrage]
	#/redemarrage : code de sortie de Java à la fin (0 : arrêt normal ; une valeur autre que 0 fait
	#redémarrer le serveur par le panel si son redémarrage après plantage est activé). Sinon : tâche « restart » du panel.
	#Range: 0 ~ 255
	code_sortie = 0
