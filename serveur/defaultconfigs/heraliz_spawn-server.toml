# Monde du spawn composé par outils/monde_spawn.py composer : bordure agrandie pour contenir la grotte, le
# tunnel et le schematic du spawn (centrée sur le point de réveil). Les autres réglages gardent leur défaut.
[spawn]
	bordure = 384

# Protection du monde du spawn : aucun dégât, aucune créature, explosions sans effet.
[protection]
	actif = true
	# Vigiles du casino (zone du casino et zone VIP) : sans eux, retirés dans la seconde.
	entites_permises = ["heralizcasino:videur"]
