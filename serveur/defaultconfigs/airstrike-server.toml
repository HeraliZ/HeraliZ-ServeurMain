#Internal, do not edit: lets new versions of the mod update values left at their old defaults.
#Range: 1 ~ 1000
configVersion = 3

#Designator (binoculars)
[designator]
	#Maximum designation range in blocks.
	#Range: 16 ~ 1024
	maxRange = 150
	#Cooldown of the binoculars after calling a strike (seconds).
	#Range: 0 ~ 3600
	cooldownSeconds = 30
	#Delay between the designation and the aircraft passing over the target (seconds).
	#Range: 6 ~ 120
	strikeDelaySeconds = 12
	#Maximum number of simultaneous strikes called by one player.
	#Range: 1 ~ 16
	maxActivePerPlayer = 1
	#Maximum number of simultaneous strikes on the server.
	#Range: 1 ~ 64
	maxActiveTotal = 6
	#Consume one payload item per strike (never in creative).
	consumePayload = true
	#Pop a coloured signal smoke on the target when a strike is called (warns everybody).
	targetMarker = true
	#Warn players close to the target (60 blocks) with a radio message.
	announceNearby = false

#Damage
[damage]
	#Bombs destroy blocks (set to false for base-protected servers).
	destroyBlocks = false
	#Napalm places fire blocks (only if destroyBlocks is true).
	napalmPlacesFire = true
	#Explosion power of each bomb of a bombing run (TNT = 4).
	#Range: 0.0 ~ 12.0
	bombPower = 3.5
	#Explosion power of the guided bomb.
	#Range: 0.0 ~ 16.0
	precisionPower = 7.0
	#Explosion power of each cluster bomblet.
	#Range: 0.0 ~ 8.0
	bombletPower = 1.8
	#Damage of each cannon round (strafing run).
	#Range: 0.0 ~ 100.0
	gunDamage = 4.0
	#Strafing passes of a gun run (1, or 2 with a turn back over the target).
	#Range: 1 ~ 2
	gunPasses = 1
	#Cannon rounds fired by each strafing pass.
	#Range: 10 ~ 200
	gunRounds = 60
	#Bombs dropped by a bombing run.
	#Range: 1 ~ 8
	bombCount = 6
	#Bomblets released by the cluster bomb.
	#Range: 4 ~ 64
	bombletCount = 16
	#Players close to an explosion hear their ears ring and the world muffled for a few seconds.
	deafening = true

#Area effects
[areas]
	#Duration of the smoke screen (seconds).
	#Range: 5 ~ 600
	smokeSeconds = 30
	#Duration of the toxic gas cloud (seconds).
	#Range: 5 ~ 600
	gasSeconds = 25
	#Duration of the napalm fire (seconds).
	#Range: 2 ~ 120
	napalmSeconds = 20
	#Players inside the smoke screen are blinded.
	smokeBlinds = true
	#Monsters lose their target when it hides inside the smoke.
	smokeBreaksAggro = true
	#Explosions and cannon fire attract idle monsters (zombies...) within this radius, 0 = off.
	#Range: 0 ~ 256
	noiseAttractsMonsters = 48

#Aircraft
[aircraft]
	#Altitude of the attack jet above the target (blocks).
	#Range: 20.0 ~ 200.0
	jetAltitude = 44.0
	#Speed of the attack jet (blocks per tick).
	#Range: 0.5 ~ 8.0
	jetSpeed = 3.0
	#Altitude of the cargo plane above the target (blocks).
	#Range: 20.0 ~ 200.0
	cargoAltitude = 56.0
	#Speed of the cargo plane (blocks per tick).
	#Range: 0.5 ~ 6.0
	cargoSpeed = 1.9
	#Aircraft release decoy flares on their way out.
	flares = true

#Supply drop
[supply]
	#Loot table used to fill the supply crate.
	lootTable = "airstrike:chests/supply_drop"
	#Signal smoke duration once the crate has landed (seconds).
	#Range: 0 ~ 3600
	signalSmokeSeconds = 90
	#Crates disappear after this many minutes (0 = never).
	#Range: 0 ~ 10000
	despawnMinutes = 20

#Patrol helicopter event (/helico): flies over the map, fires back at whoever shoots it, crashes with its loot.
[helico]
	#Helicopter event enabled (automatic launches and /helico lancer).
	actif = true
	#Launch automatically on a timer (otherwise only /helico lancer).
	auto = true
	#Minutes after the server start before the first automatic helicopter.
	#Range: 1 ~ 10000
	premierDelaiMinutes = 60
	#Minimum minutes between two automatic helicopters (counted from the end of the previous one).
	#Range: 5 ~ 10000
	intervalleMinMinutes = 120
	#Maximum minutes between two automatic helicopters.
	#Range: 5 ~ 10000
	intervalleMaxMinutes = 180
	#Players in survival on the map (overworld) needed for an automatic launch.
	#Range: 0 ~ 500
	joueursMin = 5
	#Minutes of patrol before the helicopter leaves the map if it is not shot down.
	#Range: 1 ~ 600
	dureeMinutes = 20
	#Tell the players on the map when it arrives, is shot down or leaves.
	annonces = true
	#Health of the helicopter (TaCZ bullets and explosions; melee does nothing).
	#Range: 10.0 ~ 100000.0
	vie = 1500.0
	#Patrol speed (blocks per tick).
	#Range: 0.1 ~ 2.0
	vitesse = 0.55
	#Patrol height above the ground (blocks).
	#Range: 12 ~ 120
	hauteur = 34
	#Height above its target while it attacks (blocks).
	#Range: 8 ~ 120
	hauteurCombat = 24
	#Damage of each machine gun round (a real projectile: armour protects).
	#Range: 0.0 ~ 100.0
	degatsBalle = 3.0
	#Rounds per burst.
	#Range: 1 ~ 100
	ballesParRafale = 10
	#Ticks between two rounds of a burst.
	#Range: 1 ~ 20
	cadenceTicks = 2
	#Minimum ticks between two bursts.
	#Range: 5 ~ 600
	pauseMinTicks = 40
	#Maximum ticks between two bursts.
	#Range: 5 ~ 600
	pauseMaxTicks = 70
	#Spread of the rounds (degrees).
	#Range: 0.0 ~ 30.0
	dispersionDegres = 2.5
	#Range of the machine gun (blocks).
	#Range: 16 ~ 256
	porteeTir = 90
	#Seconds the helicopter keeps hunting a player who shot it.
	#Range: 5 ~ 600
	memoireSecondes = 30
	#A player aiming at it with a gun for this many seconds becomes a target too (0 = off).
	#Range: 0 ~ 60
	viseeSecondes = 4
	#Also fire at the load test bots (/bots).
	tirerSurBots = false
	#Power of the crash explosion (hurts players, never breaks blocks).
	#Range: 0.0 ~ 10.0
	puissanceCrash = 4.0
	#Minimum seconds the wreck burns (crates and parts locked meanwhile).
	#Range: 0 ~ 3600
	feuMinSecondes = 60
	#Maximum seconds the wreck burns.
	#Range: 0 ~ 3600
	feuMaxSecondes = 150
	#Minutes the wreck, its crates and the T7 chest stay once the fire is out.
	#Range: 1 ~ 600
	epaveMinutes = 10
	#Seconds of searching (right click held, standing still) to take a part from the wreck.
	#Range: 1 ~ 120
	fouilleSecondes = 8
	#HeraliZ Loot T7 chest left at the crash (t7_coffre_armes, t7_largage, t7_coffre_fort...).
	coffreT7 = "t7_coffre_armes"
	#HeraliZ Loot table of the two helicopter crates.
	tableT6 = "t6"
	#Players this close (blocks) see and hear the helicopter, even beyond their view distance.
	#Range: 64 ~ 2000
	porteeSuivi = 500

