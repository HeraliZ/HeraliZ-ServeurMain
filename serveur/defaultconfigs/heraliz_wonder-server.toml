
#Regles generales
[general]
	#Autoriser le tir des Wonder Weapons hors d'une partie de zombies (le mode creatif est toujours autorise).
	#false = ces armes n'existent que dans le mode zombies (D-042).
	tirHorsZombies = false
	#Journal du cout serveur des tirs (une ligne toutes les 30 s s'il y a eu des tirs).
	journalPerf = false

#Pistolet a rayons (Ray Gun) : eclaboussure verte a l'impact
[pistolet_a_rayons]
	#Degats de l'eclaboussure au centre (le Pack-a-Punch du mode zombies les multiplie x2/x3/x4).
	#Range: 0.0 ~ 10000.0
	degatsEclaboussure = 60.0
	#Degats de l'eclaboussure au bord du rayon.
	#Range: 0.0 ~ 10000.0
	degatsEclaboussureBord = 20.0
	#Rayon de l'eclaboussure (blocs).
	#Range: 0.5 ~ 8.0
	rayon = 2.0
	#Rayon au Pack-a-Punch niveau 1 (Porter's X2) ; +0,25 par niveau au-dessus.
	#Range: 0.5 ~ 10.0
	rayonPap = 3.0
	#L'eclaboussure blesse le tireur s'il tire a bout portant, comme dans CoD : ZOMBIES (seulement en partie de zombies,
	#ou le mode zombies plafonne ses propres explosifs a 3 PV), TOUJOURS, JAMAIS.
	#Allowed Values: ZOMBIES, TOUJOURS, JAMAIS
	autoDegats = "ZOMBIES"
	#Degats maximum de l'eclaboussure sur le tireur (au centre).
	#Range: 0.0 ~ 100.0
	autoDegatsMax = 6.0

#Wunderwaffe DG-2 : foudre en chaine
[wunderwaffe]
	#Cibles foudroyees au plus par tir (DG-2).
	#Range: 1 ~ 64
	cibles = 10
	#Cibles au Pack-a-Punch niveau 1 (DG-3 JZ) ; +2 par niveau au-dessus.
	#Range: 1 ~ 64
	ciblesPap = 20
	#Distance d'un saut d'arc a la cible suivante (blocs).
	#Range: 1.0 ~ 24.0
	saut = 8.0
	#Distance d'un saut au Pack-a-Punch niveau 1 ; +0,75 par niveau au-dessus.
	#Range: 1.0 ~ 32.0
	sautPap = 10.5
	#Portee du premier eclair (blocs).
	#Range: 8.0 ~ 160.0
	portee = 64.0
	#Eclair qui frappe un bloc : il saute quand meme sur une cible a moins de cette distance de l'impact.
	#Range: 0.0 ~ 8.0
	rayonImpactSol = 3.5
	#En partie de zombies, toute creature de la partie ayant au plus ces PV max meurt foudroyee d'un coup (CoD).
	#Au-dessus (boss), elle prend degatsColosse.
	#Range: 1.0 ~ 1.0E7
	pvMaxFoudroye = 4000.0
	#Degats d'un arc sur une creature trop solide pour mourir d'un coup.
	#Range: 0.0 ~ 1000000.0
	degatsColosse = 250.0
	#Degats d'un arc hors partie de zombies (monstres seulement ; jamais les joueurs).
	#Range: 0.0 ~ 10000.0
	degatsHorsZombies = 30.0

